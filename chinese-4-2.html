.card.b{background:linear-gradient(160deg,#2f9d6b,#1e7a9c)}
.card .em{font-size:2.6rem}
.card .t{font-size:1.5rem;font-weight:900;margin-top:.3rem}
.card .d{font-size:1.05rem;margin-top:.4rem;opacity:.95;line-height:1.5}
#stage{position:fixed;inset:0;display:none}
#stage.on{display:block}
#stage iframe{width:100%;height:100%;border:0;display:block}
#back{position:fixed;top:.6rem;left:.6rem;z-index:50;display:none;min-width:2.8rem;height:2.8rem;border:.18rem solid #a9b8cc;background:#fff;border-radius:.9rem;font-size:1.05rem;font-weight:800;color:var(--ink);cursor:pointer;padding:0 .7rem;box-shadow:0 .25rem 0 #d0d0d0}
#back.on{display:block}
@media (max-width:420px){#menu .ttl{font-size:1.5rem}.card{padding:1.2rem 1.1rem}.card .em{font-size:2.1rem}.card .t{font-size:1.25rem}.card .d{font-size:.95rem}}

const menu = document.getElementById('menu');
const stage = document.getElementById('stage');
const back = document.getElementById('back');
const fr = document.getElementById('fr');
function openGame(html){
  menu.style.display = 'none';
  stage.classList.add('on');
  back.classList.add('on');
  fr.setAttribute('srcdoc', html);
}
function toMenu(){
  stage.classList.remove('on');
  back.classList.remove('on');
  fr.removeAttribute('srcdoc');
  fr.setAttribute('src', 'about:blank');
  menu.style.display = '';
}
document.getElementById('btnQuiz').onclick = () => openGame(QUIZ_HTML);
document.getElementById('btnFind').onclick = () => openGame(FIND_HTML);
back.onclick = toMenu;
</script>
