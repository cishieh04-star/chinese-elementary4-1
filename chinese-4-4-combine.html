<style>
:root{--ink:#333;--blue:#d9507f;--green:#2f9d6b;--gold:#ffc83d;--orange:#ff9a3c;--red:#d9443a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden}
body{display:flex;flex-direction:column;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:#fff8ec;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#menu{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;padding:6vh 5vw;text-align:center}
#menu .ttl{font-size:min(2.2rem,7vw);font-weight:900}
#menu .sub{font-size:min(1.2rem,4.2vw);color:#77716a;margin-top:-.6rem}
.cards{display:flex;flex-wrap:wrap;gap:1.6rem;justify-content:center;max-width:56rem}
.card{width:min(22rem,88vw);border:none;border-radius:1.6rem;padding:1.6rem 1.4rem;cursor:pointer;color:#fff;text-align:left;box-shadow:0 .5rem 0 rgba(0,0,0,.18);transition:transform .08s}
.card:active{transform:translateY(.3rem)}
.card.a{background:linear-gradient(160deg,#ff9a3c,#d9507f)}
.card.b{background:linear-gradient(160deg,#2f9d6b,#1e7a9c)}
.card .em{font-size:2.6rem}
.card .t{font-size:1.5rem;font-weight:900;margin-top:.3rem}
.card .d{font-size:1.05rem;margin-top:.4rem;opacity:.95;line-height:1.5}
#stage{position:fixed;inset:0;display:none}
#stage.on{display:block}
#stage iframe{width:100%;height:100%;border:0;display:block}
#back{position:fixed;top:.6rem;left:.6rem;z-index:50;display:none;min-width:2.8rem;height:2.8rem;border:.18rem solid #a9b8cc;background:#fff;border-radius:.9rem;font-size:1.05rem;font-weight:800;color:var(--ink);cursor:pointer;padding:0 .7rem;box-shadow:0 .25rem 0 #d0d0d0}
#back.on{display:block}
@media (max-width:420px){#menu .ttl{font-size:1.5rem}.card{padding:1.2rem 1.1rem}.card .em{font-size:2.1rem}.card .t{font-size:1.25rem}.card .d{font-size:.95rem}}
.styleSel{display:flex;flex-direction:column;align-items:center;gap:.5rem;background:#fff;border:.16rem solid #f0d9b5;border-radius:1.1rem;padding:.8rem 1.1rem;max-width:min(30rem,90vw)}
.styleSel .lbl{font-size:1rem;font-weight:800;color:#a85b00}
.styleSel .row{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center}
.styleSel .sbtn{border:.16rem solid #d9b98f;background:#fff;border-radius:.9rem;padding:.55rem 1rem;font-size:1rem;font-weight:800;color:#555;cursor:pointer;box-shadow:0 .2rem 0 #e8d8bd}
.styleSel .sbtn.on{background:#ffc83d;border-color:#e0a500;color:#5a3d00;box-shadow:0 .2rem 0 #c98c00}
.styleSel .note{font-size:.82rem;color:#877a68;text-align:center;line-height:1.4}
@media (max-width:420px){.styleSel{padding:.6rem .8rem}.styleSel .lbl{font-size:.92rem}.styleSel .sbtn{font-size:.9rem;padding:.5rem .85rem}.styleSel .note{font-size:.76rem}}
</style></head><body>
<div id="menu">
  <div class="ttl">拍拍樂園</div>
  <div class="sub">四年級 第四課</div>
  <div class="styleSel">
    <div class="lbl">🔤 選注音、一字多音要怎麼玩？</div>
    <div class="row" id="styleRow">
      <button class="sbtn" data-z="classic">🎯 經典選字</button>
      <button class="sbtn" data-z="wheel">🎡 摩天輪</button>
      <button class="sbtn" data-z="claw">🕹️ 夾娃娃機</button>
    </div>
    <div class="note">🎯 經典選字：直接列出四個選項，點一下就知道對不對。　🎡 摩天輪：整個注音是一個選項，四選一，選項會轉動。　🕹️ 夾娃娃機：把注音符號拆開，一個一個夾出正確答案。點一下風格，就直接進入遊戲！</div>
  </div>
  <div class="cards">
    <button class="card a" id="btnQuiz">
      <div class="em">📖</div>
      <div class="t">拍拍語文大挑戰</div>
      <div class="d">選注音・認識字・詞語填空・改錯字，練習認識這一課的生字。</div>
    </button>
    <button class="card b" id="btnFind">

      <div class="t">拍拍找字樂</div>
      <div class="d">在好玩的畫面裡，找出這一課的生字！</div>
    </button>
  </div>
</div>

  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

const menu = document.getElementById('menu');
const stage = document.getElementById('stage');
const back = document.getElementById('back');
const fr = document.getElementById('fr');
const STYLE_KEY='paipai-outer-zystyle-g4l4';
let outerZyStyle='claw';
try{const sv=localStorage.getItem(STYLE_KEY);if(['classic','wheel','claw'].includes(sv))outerZyStyle=sv}catch(e){}
function paintStyleRow(){
  document.querySelectorAll('#styleRow .sbtn').forEach(b=>{
    b.classList.toggle('on', b.dataset.z===outerZyStyle);
  });
}
document.querySelectorAll('#styleRow .sbtn').forEach(b=>{
  b.onclick=()=>{outerZyStyle=b.dataset.z;try{localStorage.setItem(STYLE_KEY,outerZyStyle)}catch(e){}paintStyleRow();openGame(QUIZ_HTML)};
});
paintStyleRow();
function openGame(html){
  menu.style.display = 'none';
  stage.classList.add('on');
  back.classList.add('on');
  const injected = html.replace('<script>', `<script>window.__zyStyleOverride='${outerZyStyle}';`);
  fr.setAttribute('srcdoc', injected);
}
function toMenu(){
  stage.classList.remove('on');
  back.classList.remove('on');
  fr.removeAttribute('srcdoc');
  fr.setAttribute('src', 'about:blank');
  menu.style.display = '';
}
document.getElementById('btnQuiz').onclick = () => openGame(QUIZ_HTML);
document.getElementById('btnFind').onclick = () => openGame(FIND_HTML);
back.onclick = toMenu;
</script>
</body></html>
