<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>糖果點心樂園・國語四年級第二課〈放學後〉（第 20 回）</title>
<style>:root{
  --sky1:#7fd6ff;--sky2:#c9f0ff;--grass:#7ddc6a;--grass2:#4fbf4a;--sun:#ffd84d;--sun2:#ffb703;
  --coral:#ff6b6b;--coral2:#e04848;--blue:#3b9cff;--blue2:#1f78e0;--green:#3ecf72;--green2:#22a653;
  --purple:#9b6bff;--purple2:#7647e0;--ink:#2b3a55;--ink2:#5a6b8c;--card:#ffffff;--line:#d8e6f7;
  --bg:#e8f6ff;--shadow:0 .35rem 0 rgba(30,60,110,.18);--fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(clamp(14px,calc(.6vw + 1.2vh + 6px),32px)*var(--fs));height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;font-weight:700;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:.22rem solid var(--purple);outline-offset:.15rem}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:scr .25s ease}
@keyframes scr{from{opacity:0;transform:translateY(.6rem)}to{opacity:1;transform:none}}
ruby{ruby-position:over}
rt{font-size:.46em;font-weight:700;color:#d0301f;letter-spacing:0;user-select:none}
.zy-off rt{display:none}
.zy-on ruby{ruby-align:center}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:3rem;padding:.55rem 1.3rem;border-radius:1.1rem;
  background:var(--sun);color:#5a3b00;font-size:1.15rem;font-weight:900;box-shadow:0 .3rem 0 var(--sun2);position:relative;top:0;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(.28rem);box-shadow:0 .02rem 0 var(--sun2)}
.btn.g{background:var(--green);color:#fff;box-shadow:0 .3rem 0 var(--green2)}
.btn.g:active:not(:disabled){box-shadow:0 .02rem 0 var(--green2)}
.btn.b{background:var(--blue);color:#fff;box-shadow:0 .3rem 0 var(--blue2)}
.btn.b:active:not(:disabled){box-shadow:0 .02rem 0 var(--blue2)}
.btn.r{background:var(--coral);color:#fff;box-shadow:0 .3rem 0 var(--coral2)}
.btn.r:active:not(:disabled){box-shadow:0 .02rem 0 var(--coral2)}
.btn.p{background:var(--purple);color:#fff;box-shadow:0 .3rem 0 var(--purple2)}
.btn.w{background:#fff;color:var(--ink);box-shadow:0 .3rem 0 #b9cde6}
.btn.w:active:not(:disabled){box-shadow:0 .02rem 0 #b9cde6}
.btn.big{font-size:1.3rem;min-height:3.6rem;padding:.6rem 1.3rem;border-radius:1.3rem}
.btn.sm{min-height:2.4rem;padding:.3rem .8rem;font-size:.95rem;border-radius:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ibtn{width:2.8rem;height:2.8rem;border-radius:50%;background:#fff;box-shadow:0 .22rem 0 #b9cde6;font-size:1.3rem;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ibtn:active{transform:translateY(.2rem);box-shadow:none}
.ibtn.on{background:var(--sun);box-shadow:0 .22rem 0 var(--sun2)}
/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:.5rem;padding:.55rem .7rem;flex:none;flex-wrap:wrap;background:linear-gradient(#fff,#eaf6ff);border-bottom:.2rem solid var(--line);z-index:5}
.hud .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .75rem;border-radius:999px;background:#fff;border:.15rem solid var(--line);font-size:1rem;font-weight:900;white-space:nowrap}
.pill.lv{background:var(--purple);color:#fff;border-color:var(--purple2)}
.pill.coin{background:#fff6cc;border-color:#ffe07a}
.pill.net{background:#dcfbe6;border-color:#9fe6b6}
.xpbar{width:5.5rem;height:.7rem;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden;display:inline-block}
.xpbar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}
.hearts{display:inline-flex;gap:.15rem;font-size:1.3rem}
.hearts .lost{filter:grayscale(1);opacity:.35}
.title-h{font-size:1.25rem;font-weight:900;display:flex;align-items:center;gap:.4rem}
/* ---------- title screen ---------- */
.title-scr{background:linear-gradient(#7fd6ff 0%,#c9f0ff 55%,#bff3c0 55%,#7ddc6a 100%);align-items:center;text-align:center;padding:1rem;overflow:auto}
.title-scr>div{position:relative;z-index:1}
.title-scr .logo{font-size:min(3.4rem,11vw);font-weight:900;color:#fff;text-shadow:0 .25rem 0 var(--blue2),0 .5rem 0 rgba(0,0,0,.12);line-height:1.15;letter-spacing:.05em}
.title-scr .sub{display:inline-block;margin:.4rem 0 .8rem;padding:.3rem 1rem;background:var(--sun);border-radius:99px;color:#5a3b00;font-weight:900;box-shadow:0 .2rem 0 var(--sun2)}
.title-card{background:#fff;border-radius:1.6rem;padding:1rem 1.2rem;box-shadow:var(--shadow);max-width:34rem;width:100%}
.avatars{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:.5rem 0}
.avatars button{width:3.1rem;height:3.1rem;border-radius:1rem;font-size:1.8rem;background:#f0f7ff;border:.2rem solid transparent}
.avatars button.sel{border-color:var(--purple);background:#efe6ff;transform:scale(1.1)}
.nameinp{width:100%;font:inherit;font-size:1.3rem;padding:.6rem 1rem;border-radius:1rem;border:.2rem solid var(--line);text-align:center;font-weight:800;color:var(--ink);background:#fff;user-select:text}
.nameinp:focus{outline:none;border-color:var(--blue)}
.cloud{pointer-events:none;z-index:0;position:absolute;font-size:3rem;opacity:.9;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
/* ---------- hub map ---------- */
.hub{background:linear-gradient(#8fdcff 0%,#d9f4ff 38%,#c4f2b8 38%,#8be07a 100%)}
.mapwrap{flex:1;position:relative;overflow:auto;min-height:0}
.map{position:relative;width:100%;height:100%;min-height:56rem;min-width:min(100%,60rem);margin:0 auto}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.deco{position:absolute;font-size:2.4rem;pointer-events:none;opacity:.95}
.node{background:none;border:0;padding:0;font:inherit;color:inherit;position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.15rem;width:6.9rem;z-index:2}
.node .orb{width:4.6rem;height:4.6rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;
  background:radial-gradient(circle at 30% 25%,#fff8c8,var(--sun) 55%,var(--sun2));border:.28rem solid #fff;box-shadow:0 .4rem 0 rgba(30,60,110,.25);transition:transform .15s}
.node:hover .orb{transform:scale(1.08)}
.node:active .orb{transform:scale(.95)}
.node.cur .orb{animation:bob 1.1s ease-in-out infinite;box-shadow:0 0 0 .35rem rgba(255,255,255,.7),0 .4rem 0 rgba(30,60,110,.25)}
.node.lock .orb{background:radial-gradient(circle at 30% 25%,#eee,#bbb 60%,#999);filter:grayscale(.4)}
.node.boss .orb{width:5.6rem;height:5.6rem;font-size:3rem;background:radial-gradient(circle at 30% 25%,#ffd0d0,var(--coral) 60%,var(--coral2))}
.node .nm{background:#fff;border-radius:.8rem;padding:.1rem .6rem;font-size:.95rem;font-weight:900;box-shadow:0 .15rem 0 rgba(30,60,110,.18);text-align:center;line-height:1.25}
.node .sk{font-size:.72rem;color:var(--ink2);font-weight:800;text-align:center;line-height:1.1;background:rgba(255,255,255,.8);border-radius:.5rem;padding:0 .3rem}
.stars{font-size:1.05rem;letter-spacing:.05rem;filter:drop-shadow(0 .08rem 0 rgba(0,0,0,.2))}
.stars .off{filter:grayscale(1);opacity:.35}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.45rem)}}
.netty{position:absolute;z-index:3;display:flex;align-items:flex-end;gap:.4rem;pointer-events:none}
.netty .bubble{background:#fff;border-radius:1rem;padding:.45rem .8rem;font-size:.95rem;max-width:15rem;box-shadow:var(--shadow);position:relative;pointer-events:auto}
.netty svg{width:4.6rem;height:4.6rem;animation:bob 2.2s ease-in-out infinite;flex:none}
.dock{display:flex;gap:.5rem;padding:.55rem .6rem;justify-content:center;flex-wrap:wrap;flex:none;background:linear-gradient(#fff,#eaf6ff);border-top:.2rem solid var(--line)}
.dock .btn{flex:1;max-width:10rem;min-width:5.5rem;padding:.4rem .5rem;font-size:1rem}
/* ---------- generic page ---------- */
.page{flex:1;overflow:auto;padding:.9rem;min-height:0}
.wrap{max-width:60rem;margin:0 auto;width:100%}
.card{background:var(--card);border-radius:1.2rem;padding:.9rem 1rem;box-shadow:var(--shadow);margin-bottom:.8rem}
.card h3{margin:.1rem 0 .4rem;font-size:1.15rem}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.7rem}
.tab{padding:.45rem 1rem;border-radius:99px;background:#fff;border:.15rem solid var(--line);font-weight:900;font-size:1rem}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue2)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.sw{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.55rem .2rem;border-bottom:.1rem dashed var(--line)}
.sw:last-child{border:0}
.sw small{display:block;font-size:.8rem;color:var(--ink2);font-weight:700}
.toggle{width:3.6rem;height:2rem;border-radius:99px;background:#c9d6e8;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.6rem;height:1.6rem;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 .1rem .2rem rgba(0,0,0,.25)}
.toggle.on{background:var(--green)}
.toggle.on::after{left:1.8rem}
.seg{display:inline-flex;border-radius:.9rem;overflow:hidden;border:.15rem solid var(--line)}
.seg button{padding:.35rem .8rem;background:#fff;font-weight:900}
.seg button.on{background:var(--blue);color:#fff}
.hint{font-size:.9rem;color:var(--ink2);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{padding:.25rem .7rem;border-radius:99px;background:#eef5ff;border:.12rem solid var(--line);font-size:.95rem;font-weight:800}
/* ---------- stage screen ---------- */
.stage{background:linear-gradient(#e9f7ff,#f6fff0)}
.stagebody{flex:1;position:relative;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:.7rem .8rem .9rem;gap:.6rem;align-items:stretch}
.inst{background:#fff;border-radius:1rem;padding:.4rem .8rem;font-size:1rem;box-shadow:0 .2rem 0 rgba(30,60,110,.12);display:flex;align-items:center;gap:.5rem;flex:none}
.inst .em{font-size:1.6rem}
.prog{height:.8rem;background:#d6e6f7;border-radius:99px;overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#9be564);border-radius:99px;transition:width .4s}
/* MCQ */
.qcard{background:#fff;border-radius:1.3rem;padding:1rem 1.1rem;box-shadow:var(--shadow);font-size:1.35rem;line-height:2.3;display:flex;gap:.6rem;align-items:flex-start}
.qcard .qt{flex:1;min-width:0;overflow-wrap:anywhere}
.qcard .sp{flex:none}
.opts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.7rem}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{background:#fff;border-radius:1.1rem;padding:.7rem .9rem;text-align:left;font-size:1.2rem;line-height:1.9;box-shadow:0 .3rem 0 #b9cde6;border:.18rem solid transparent;display:flex;gap:.6rem;align-items:center;min-height:3.4rem;transition:transform .08s}
.opt:active:not(:disabled){transform:translateY(.25rem);box-shadow:0 .03rem 0 #b9cde6}
.opt .k{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:900}
.opt.ok{background:#d9f9e3;border-color:var(--green);box-shadow:0 .3rem 0 var(--green2)}
.opt.ok .k{background:var(--green)}
.opt.bad{background:#ffe0e0;border-color:var(--coral);box-shadow:0 .3rem 0 var(--coral2);animation:shake .35s}
.opt.bad .k{background:var(--coral)}
.opt.gone{opacity:.25;pointer-events:none}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-.4rem)}75%{transform:translateX(.4rem)}}
@media(max-width:34rem){.opts{grid-template-columns:minmax(0,1fr)}}
.skilltag{display:inline-block;font-size:.8rem;background:#efe6ff;color:var(--purple2);border-radius:99px;padding:.05rem .6rem;font-weight:900;margin-right:.4rem;vertical-align:middle}
.mark{background:#fff0a8;border-radius:.4rem;padding:0 .15rem}
.blank{display:inline-block;min-width:2.4em;border-bottom:.18rem solid var(--ink);text-align:center;color:var(--purple2)}
/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(20,40,80,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:46rem;background:#fff;border-radius:1.6rem 1.6rem 0 0;padding:1rem 1.2rem 1.1rem;box-shadow:0 -.4rem 1.2rem rgba(0,0,0,.2);animation:up .28s cubic-bezier(.2,1.3,.5,1);max-height:80%;overflow:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .hd{display:flex;align-items:center;gap:.6rem;font-size:1.5rem;font-weight:900;margin-bottom:.3rem}
.sheet.ok .hd{color:var(--green2)}
.sheet.bad .hd{color:var(--coral2)}
.sheet .body{font-size:1.15rem;line-height:2.2;margin:.2rem 0 .7rem}
.sheet .ans{background:#f0f7ff;border-radius:.9rem;padding:.4rem .8rem;margin:.3rem 0;font-size:1.1rem;line-height:2.1}
.modalbg{position:fixed;inset:0;background:rgba(20,40,80,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:1rem;animation:fade .2s}
.modal{background:#fff;border-radius:1.5rem;padding:1.1rem 1.3rem;max-width:30rem;width:100%;box-shadow:var(--shadow);text-align:center;max-height:92%;overflow:auto}
.modal h2{margin:.2rem 0 .4rem;font-size:1.5rem}
.modal .row{justify-content:center;margin-top:.8rem}
.toast{position:fixed;left:50%;top:5rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.5rem 1.1rem;border-radius:99px;font-size:1.05rem;z-index:70;animation:toast 2.2s forwards;pointer-events:none;text-align:center;max-width:90vw}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-.8rem)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.pop{position:fixed;z-index:65;pointer-events:none;font-weight:900;font-size:1.6rem;color:var(--sun2);text-shadow:0 .1rem 0 #fff,0 0 .3rem #fff;animation:popup .9s forwards}
@keyframes popup{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-3rem) scale(1.3)}}
.conf{position:fixed;top:-2rem;font-size:1.8rem;z-index:80;pointer-events:none;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
/* result */
.result{align-items:center;justify-content:center;text-align:center;padding:1rem;background:linear-gradient(#fff7d1,#e6f7ff);overflow:auto}
.result>.big{font-size:3.2rem;margin:.2rem 0}
.result .stars{font-size:3rem}
.result .rows{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin:.6rem 0}
.result .rows .pill{font-size:1.15rem;padding:.4rem 1rem}
/* ---------- Boss ---------- */
.bosshead{display:flex;align-items:center;gap:.8rem;background:linear-gradient(#ffd6d6,#ffeaea);border-radius:1.2rem;padding:.5rem .9rem;box-shadow:var(--shadow);flex:none}
.bosshead .bossface{font-size:3.2rem}
.powers{display:flex;gap:.5rem;flex:none}
/* ---------- class mode ---------- */
.race{background:linear-gradient(#bfe9ff,#e5f8ff);border-radius:1.2rem;padding:.6rem .8rem;box-shadow:var(--shadow);flex:none}
.rtrack{display:flex;align-items:center;gap:.6rem;margin:.3rem 0}
.rtrack .tn{width:6rem;font-size:1rem;font-weight:900;flex:none;text-align:right;color:var(--ink)}
.rtrack .lane2{flex:1;height:2.4rem;background:rgba(255,255,255,.7);border-radius:99px;position:relative}
.rtrack .bal{position:absolute;top:-.5rem;font-size:2.4rem;transform:translateX(-50%);transition:left .8s cubic-bezier(.3,1.4,.5,1)}
.tpill{padding:.35rem .9rem;border-radius:99px;color:#fff;font-weight:900;font-size:1.2rem;display:inline-block}
.timerbar{height:.9rem;border-radius:99px;background:#d6e6f7;overflow:hidden;flex:none}
.timerbar i{display:block;height:100%;background:var(--green);transition:background .3s}
.teamcfg{display:flex;gap:.5rem;flex-wrap:wrap}
.teamcfg input{font:inherit;font-weight:800;padding:.4rem .7rem;border-radius:.8rem;border:.15rem solid var(--line);width:9rem;user-select:text}
/* ---------- misc ---------- */
.village{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.6rem,1fr));gap:.5rem;background:linear-gradient(#bfe9ff,#bff3b0);border-radius:1.2rem;padding:.8rem;min-height:12rem}
.hut{font-size:2.4rem;text-align:center;line-height:1;position:relative;animation:scr .4s}
.hut::after{content:"";position:absolute;left:50%;top:-.2rem;transform:translateX(-50%);font-size:1.5rem;opacity:.85}
.cert{width:100%;max-width:40rem;border-radius:1rem;box-shadow:var(--shadow);display:block;margin:0 auto}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.6rem}
.badge{background:#fff;border-radius:1rem;padding:.6rem .4rem;text-align:center;box-shadow:0 .2rem 0 #cfdcee;font-size:.85rem;line-height:1.4}
.badge .e{font-size:2.3rem;display:block}
.badge.no{opacity:.4;filter:grayscale(1)}
.bar2{display:flex;align-items:center;gap:.5rem;margin:.3rem 0;font-size:.95rem}
.bar2 .nm{width:7.5rem;flex:none}
.bar2 .tr{flex:1;height:1.2rem;background:#e3eefb;border-radius:99px;overflow:hidden}
.bar2 .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:99px}
.bar2 .v{width:4.5rem;text-align:right;flex:none;font-size:.85rem;color:var(--ink2)}
.wb{background:#fff;border-radius:1rem;padding:.7rem .9rem;box-shadow:0 .2rem 0 #cfdcee;margin-bottom:.6rem;font-size:1.05rem;line-height:2.1}
.idcard{background:linear-gradient(#fff,#fff7dc);border:.18rem solid #ffe07a;border-radius:1rem;padding:.6rem .8rem;line-height:1.9}
.idcard b{font-size:1.4rem;color:var(--coral2)}
.idcard.no{opacity:.45;filter:grayscale(1);border-style:dashed}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.reduce *{animation-duration:.01s!important;transition-duration:.01s!important}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
@media print{body{overflow:visible}#app{position:static}.hud,.dock,.btn,.tabs{display:none}}

#zyBtn{position:fixed;top:.5rem;right:.6rem;z-index:90;min-width:3.5rem;height:3rem;border-radius:1rem;background:#fff;border:.15rem solid var(--line);box-shadow:0 .25rem 0 #b9cde6;font-weight:900;font-size:.9rem;line-height:1.1;padding:.1rem .5rem;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center}
#zyBtn small{font-size:.62rem;letter-spacing:.02rem;color:#d0301f}
#zyBtn.on{background:var(--sun);color:#5a3b00;box-shadow:0 .25rem 0 var(--sun2);border-color:#fff}
#zyBtn:active{transform:translateY(.2rem);box-shadow:none}
.hud,.title-scr{padding-right:4.8rem}
.zy-on .qcard,.zy-on .opt,.zy-on .speech,.zy-on .sheet .body,.zy-on .sheet .ans,.zy-on .inst,.zy-on .sense,.zy-on .brick,.zy-on .ordi,.zy-on .wb,.zy-on .enemy .say,.zy-on .runq,.zy-on .gate .g,.zy-on .sorti,.zy-on .cardc,.zy-on .wtile,.zy-on .idcard,.zy-on .hint{line-height:2.7}
.zy-on .chtile{line-height:2.4;min-width:2.8rem}
.zy-on .pchar,.zy-on .slot{line-height:2.2}
.zy-on .node .nm,.zy-on .node .sk{line-height:2}
.brick .mark{color:#2b3a55}

#go{padding:.7rem .5rem;white-space:nowrap}

.inst>span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
.inst>span:last-child,.opt>span:last-child,.ordi>span:last-child,.speech>div>div{min-width:0}

.zy-on .gate .g{font-size:1rem;line-height:2.5;padding:.3rem 0}.zy-on .gate .g rt{font-size:.4em}

.opt,.sense,.cardc,.ordi,.brick{overflow-wrap:anywhere;max-width:100%}

.btn{white-space:nowrap}.lanebtns .btn{white-space:normal}

.wtile.zt{font-size:1.1rem}
.wtile.sel{outline:3px solid #ffb300;background:#fff8e1}
.wtile.popped.zt{opacity:.5}

const DATA={"items": [{"id": "z4_2", "sec": "一", "no": "2", "k": "zy", "st": ["S1"], "sk": "zy", "s": "他因未遵守球賽規⟪則⟫而引發⟪爭⟫議，比賽也因此⟪暫⟫停，⟪幸⟫好沒有人員受傷，裁判已經向他提出了⟪警⟫告。", "src": "一.2"}, {"id": "z4_3", "sec": "一", "no": "3", "k": "zy", "st": ["S1"], "sk": "zy", "s": "今天是冬至，爸爸忙裡⟪偷⟫閒和我們聚在一起包⟪湯⟫圓，享受難得的家庭時光。", "src": "一.3"}, {"id": "z4_5", "sec": "一", "no": "5", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪爭⟫吵", "src": "一.5"}, {"id": "z4_6", "sec": "一", "no": "6", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪繩⟫之以法", "src": "一.6"}, {"id": "z4_7", "sec": "一", "no": "7", "k": "zy", "st": ["S1"], "sk": "zy", "s": "赴⟪湯⟫蹈火", "src": "一.7"}, {"id": "z4_8", "sec": "一", "no": "8", "k": "zy", "st": ["S1"], "sk": "zy", "s": "這個餐廳告示牌在⟪警⟫惕小朋友，不要奔跑以免撞到端熱⟪湯⟫的服務人員，千萬別為了貪玩而⟪捨⟫棄安全。", "src": "一.8"}, {"id": "z4_9", "sec": "一", "no": "9", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪拋⟫球", "src": "一.9"}, {"id": "z4_10", "sec": "一", "no": "10", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪招⟫手", "src": "一.10"}, {"id": "z4_12", "sec": "一", "no": "12", "k": "zy", "st": ["S1"], "sk": "zy", "s": "跳⟪繩⟫", "src": "一.12"}, {"id": "z_a1", "sec": "一", "no": "1", "k": "zy", "st": ["S1"], "sk": "zy", "s": "晚餐時，⟪姐⟫⟪姐⟫悄悄對我說她不想喝玉米濃⟪湯⟫。", "src": "一.1（短文分句）"}, {"id": "z_a2", "sec": "一", "no": "1", "k": "zy", "st": ["S1"], "sk": "zy", "s": "爸爸聽到後⟪暫⟫時放下手上的碗筷，", "src": "一.1（短文分句）"}, {"id": "z_a3", "sec": "一", "no": "1", "k": "zy", "st": ["S1"], "sk": "zy", "s": "告訴我們不能⟪拋⟫棄節省的原⟪則⟫，", "src": "一.1（短文分句）"}, {"id": "z_a4", "sec": "一", "no": "1", "k": "zy", "st": ["S1"], "sk": "zy", "s": "因為我們是如此⟪幸⟫運才有食物可以享用，", "src": "一.1（短文分句）"}, {"id": "z_a5", "sec": "一", "no": "1", "k": "zy", "st": ["S1"], "sk": "zy", "s": "浪費⟪糧⟫食是不好的。", "src": "一.1（短文分句）"}, {"id": "z_a6", "sec": "一", "no": "1", "k": "zy", "st": ["S1"], "sk": "zy", "s": "最後，我們⟪依⟫照爸爸的話約⟪束⟫自己浪費的行為，", "src": "一.1（短文分句）"}, {"id": "z_a7", "sec": "一", "no": "1", "k": "zy", "st": ["S1"], "sk": "zy", "s": "把珍惜食物當作準⟪繩⟫。", "src": "一.1（短文分句）"}, {"id": "zp_a", "sec": "一", "no": "1", "k": "zp", "st": ["S2"], "sk": "zy", "s": "晚餐時，⟪姐⟫⟪姐⟫悄悄對我說她不想喝玉米濃⟪湯⟫。爸爸聽到後⟪暫⟫時放下手上的碗筷，告訴我們不能⟪拋⟫棄節省的原⟪則⟫，因為我們是如此⟪幸⟫運才有食物可以享用，浪費⟪糧⟫食是不好的。\n最後，我們⟪依⟫照爸爸的話約⟪束⟫自己浪費的行為，把珍惜食物當作準⟪繩⟫。", "title": "一頓特別的晚餐", "qs": [], "src": "一.1（短文）"}, {"id": "z_b1", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "午後，⟪姐⟫⟪姐⟫和爸爸一起欣賞影片。", "src": "一.4（短文分句）"}, {"id": "z_b2", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "畫面中，⟪警⟫察緊追不⟪捨⟫的跟著違反交通規⟪則⟫的民眾，", "src": "一.4（短文分句）"}, {"id": "z_b3", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "鳴笛聲⟪招⟫來雜⟪糧⟫商店老闆的注意。", "src": "一.4（短文分句）"}, {"id": "z_b4", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "最後那位違規民眾的機車⟪拋⟫錨，", "src": "一.4（短文分句）"}, {"id": "z_b5", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪警⟫察便迅速的將人⟪繩⟫之以法，結⟪束⟫這場短⟪暫⟫的追逐。", "src": "一.4（短文分句）"}, {"id": "z_b6", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "過沒多久，有人⟪依⟫據監控影片，", "src": "一.4（短文分句）"}, {"id": "z_b7", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "發現他是日前闖入溫泉公園的⟪偷⟫鞋大盜，", "src": "一.4（短文分句）"}, {"id": "z_b8", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "此事立刻引起媒體⟪爭⟫相報導，", "src": "一.4（短文分句）"}, {"id": "z_b9", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪幸⟫好泡⟪湯⟫民眾鞋子失蹤的案件，很快便真相大白。", "src": "一.4（短文分句）"}, {"id": "zp_b", "sec": "一", "no": "4", "k": "zp", "st": ["S2"], "sk": "zy", "s": "午後，⟪姐⟫⟪姐⟫和爸爸一起欣賞影片。\n畫面中，⟪警⟫察緊追不⟪捨⟫的跟著違反交通規⟪則⟫的民眾，鳴笛聲⟪招⟫來雜⟪糧⟫商店老闆的注意。最後那位違規民眾的機車⟪拋⟫錨，⟪警⟫察便迅速的將人⟪繩⟫之以法，結⟪束⟫這場短⟪暫⟫的追逐。\n過沒多久，有人⟪依⟫據監控影片，發現他是日前闖入溫泉公園的⟪偷⟫鞋大盜，此事立刻引起媒體⟪爭⟫相報導，⟪幸⟫好泡⟪湯⟫民眾鞋子失蹤的案件，很快便真相大白。", "title": "午後的影片", "qs": [], "src": "一.4（短文）"}, {"id": "z_c1", "sec": "一", "no": "11", "k": "zy", "st": ["S1"], "sk": "zy", "s": "為了能有足夠的⟪糧⟫食，大家經常⟪捨⟫棄休息時間，", "src": "一.11（短文分句）"}, {"id": "z_c2", "sec": "一", "no": "11", "k": "zy", "st": ["S1"], "sk": "zy", "s": "一天清晨，村裡的老伯伯準備出海時，發現漁船突然⟪拋⟫錨，", "src": "一.11（短文分句）"}, {"id": "z_c3", "sec": "一", "no": "11", "k": "zy", "st": ["S1"], "sk": "zy", "s": "幸好他立刻⟪警⟫覺到，⟪暫⟫停出海，並且用⟪繩⟫子固定好船隻，", "src": "一.11（短文分句）"}, {"id": "z_c4", "sec": "一", "no": "11", "k": "zy", "st": ["S1"], "sk": "zy", "s": "以免船隻漂離岸邊，否⟪則⟫後果可能不堪設想。", "src": "一.11（短文分句）"}, {"id": "zp_c", "sec": "一", "no": "11", "k": "zp", "st": ["S2"], "sk": "zy", "s": "海邊有個小漁村，村民靠捕魚和種田維生。為了能有足夠的⟪糧⟫食，大家經常⟪捨⟫棄休息時間，一早就出海捕魚。\n一天清晨，村裡的老伯伯準備出海時，發現漁船突然⟪拋⟫錨，幸好他立刻⟪警⟫覺到，⟪暫⟫停出海，並且用⟪繩⟫子固定好船隻，以免船隻漂離岸邊，否⟪則⟫後果可能不堪設想。", "title": "海邊的小漁村", "qs": [], "src": "一.11（短文）"}, {"id": "zk_t21", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "對著我們⟪招⟫⟪招⟫手：有時是香氣撲鼻的奶油餅乾，", "src": "課本（課文〈放學後〉）"}, {"id": "zk_t22", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "有時是層次分明的千層糕，有時是軟綿可口的紅豆⟪湯⟫。", "src": "課本（課文〈放學後〉）"}, {"id": "zk_t23", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "總是不敵美食當前，將功課⟪拋⟫到腦後，", "src": "課本（課文〈放學後〉）"}, {"id": "zpk_t2", "sec": "課本", "no": "課文", "k": "zp", "st": ["S2"], "sk": "zy", "s": "回到家裡，常有美味的點心，對著我們⟪招⟫⟪招⟫手：有時是香氣撲鼻的奶油餅乾，有時是層次分明的千層糕，有時是軟綿可口的紅豆⟪湯⟫。好友們常常不約而同來我家「寫功課」，大家一坐下來，總是不敵美食當前，將功課⟪拋⟫到腦後，把眼前的美食一掃而空。", "title": "課文第二段：美味的點心", "qs": [], "src": "課本（課文〈放學後〉）"}, {"id": "zk_t31", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "除了美味的點心，我最重要的精神食⟪糧⟫，就是國語日報。", "src": "課本（課文〈放學後〉）"}, {"id": "zk_t32", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "我和⟪姐⟫⟪姐⟫常常為了誰先看而⟪爭⟫吵不休，", "src": "課本（課文〈放學後〉）"}, {"id": "zk_t33", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "後來我們一起想出好方法：⟪姐⟫⟪姐⟫看左邊，", "src": "課本（課文〈放學後〉）"}, {"id": "zk_t34", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "我就看右邊；⟪姐⟫⟪姐⟫看正面，我就看反面……。", "src": "課本（課文〈放學後〉）"}, {"id": "zpk_t3", "sec": "課本", "no": "課文", "k": "zp", "st": ["S2"], "sk": "zy", "s": "除了美味的點心，我最重要的精神食⟪糧⟫，就是國語日報。我和⟪姐⟫⟪姐⟫常常為了誰先看而⟪爭⟫吵不休，後來我們一起想出好方法：⟪姐⟫⟪姐⟫看左邊，我就看右邊；⟪姐⟫⟪姐⟫看正面，我就看反面……。我們一邊吃點心，一邊讀有趣的故事，還有什麼比這更快樂呢？", "title": "課文第三段：精神食糧", "qs": [], "src": "課本（課文〈放學後〉）"}, {"id": "zk_t41", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪姐⟫⟪姐⟫、同學和我會在附近的公園，", "src": "課本（課文〈放學後〉）"}, {"id": "zk_t42", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "玩你追我躲的「⟪警⟫察抓小⟪偷⟫」，有時則是玩跳⟪繩⟫，", "src": "課本（課文〈放學後〉）"}, {"id": "zk_t43", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "不管是比速度，還是比次數，大家都奮勇⟪爭⟫先，不落人後。", "src": "課本（課文〈放學後〉）"}, {"id": "zk_t44", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "才⟪依⟫⟪依⟫不⟪捨⟫的結⟪束⟫遊戲。", "src": "課本（課文〈放學後〉）"}, {"id": "zpk_t4", "sec": "課本", "no": "課文", "k": "zp", "st": ["S2"], "sk": "zy", "s": "寫完功課以後，就是我的玩樂時間，⟪姐⟫⟪姐⟫、同學和我會在附近的公園，玩你追我躲的「⟪警⟫察抓小⟪偷⟫」，有時則是玩跳⟪繩⟫，不管是比速度，還是比次數，大家都奮勇⟪爭⟫先，不落人後。我們經常玩到太陽快下山，聽到大人們紛紛呼喊：「回家吃晚餐了！」才⟪依⟫⟪依⟫不⟪捨⟫的結⟪束⟫遊戲。", "title": "課文第四段：玩樂時間", "qs": [], "src": "課本（課文〈放學後〉）"}, {"id": "zk_t51", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "多希望時間⟪暫⟫停，讓我可以永遠停留在這美好的⟪幸⟫福時光。", "src": "課本（課文〈放學後〉）"}, {"id": "zpk_t5", "sec": "課本", "no": "課文", "k": "zp", "st": ["S2"], "sk": "zy", "s": "放學後的美好時光，不論是吃點心、看報紙，還是玩遊戲，時間總是過得特別快。多希望時間⟪暫⟫停，讓我可以永遠停留在這美好的⟪幸⟫福時光。", "title": "課文第五段：美好時光", "qs": [], "src": "課本（課文〈放學後〉）"}, {"id": "z4x_01", "sec": "補充", "no": "1", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪爭⟫吵", "src": "補充題（詞語）", "gen": 1}, {"id": "z4x_02", "sec": "補充", "no": "2", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪爭⟫先", "src": "補充題（詞語）", "gen": 1}, {"id": "z4x_03", "sec": "補充", "no": "3", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪爭⟫取", "src": "補充題（詞語）", "gen": 1}, {"id": "z4x_04", "sec": "補充", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪姐⟫姐", "src": "補充題（詞語）", "gen": 1}, {"id": "z4x_05", "sec": "補充", "no": "5", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪姐⟫妹", "src": "補充題（詞語）", "gen": 1}, {"id": "z4x_06", "sec": "補充", "no": "6", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪糧⟫食", "src": "補充題（詞語）", "gen": 1}, {"id": "z4x_07", "sec": "補充", "no": "7", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪糧⟫倉", "src": "補充題（詞語）", "gen": 1}, {"id": "z4x_08", "sec": "補充", : "文章說：警察便迅速的將人繩之以法，那位被抓的，是騎車違規的民眾。", "bk": "b1", "src": "一.4（打勾題）；課本習作一的提問"}, {"id": "b1q2", "sec": "補充", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "文章裡，姐姐和爸爸一起做什麼？", "opts": ["欣賞影片", "去公園跑步", "煮晚餐"], "ans": 0, "why": "文章說：姐姐和爸爸一起欣賞影片。", "src": "補充（短文）", "bk": "b1", "gen": 1}, {"id": "b1q3", "sec": "補充", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "違規民眾的機車後來怎麼了？", "opts": ["拋錨", "撞到樹", "被偷走"], "ans": 0, "why": "文章說：最後那位違規民眾的機車拋錨。", "src": "補充（短文）", "bk": "b1", "gen": 1}, {"id": "b1q4", "sec": "補充", "no": "4", "k": "mc", "st": ["S10"], "sk": "read", "stem": "是誰發現偷鞋大盜的？", "opts": ["有人依據監控影片", "警察看見他在偷鞋", "爸爸在公園抓到他"], "ans": 0, "why": "文章說：有人依據監控影片，發現他是偷鞋大盜。", "src": "補充（短文）", "bk": "b1", "gen": 1}, {"id": "b1q5", "sec": "補充", "no": "5", "k": "mc", "st": ["S10"], "sk": "read", "stem": "偷鞋大盜偷鞋的地方是哪裡？", "opts": ["溫泉公園", "雜糧商店", "學校操場"], "ans": 0, "why": "文章說：日前闖入溫泉公園的偷鞋大盜。", "src": "補充（短文）", "bk": "b1", "gen": 1}, {"id": "b2q1", "sec": "一", "no": "11-1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "老伯伯在發現漁船拋錨時，做了什麼事？", "opts": ["立刻出海捕魚", "用繩子把船隻固定好", "趕緊通知其他村民", "把船開到另一個地方"], "ans": 1, "why": "文章說：暫停出海，並且用繩子固定好船隻。", "bk": "b2", "src": "一.11（１）"}, {"id": "b2q2", "sec": "一", "no": "11-2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "根據文章，如果老伯伯沒有將船綁上繩子，後續可能發生什麼事？", "opts": ["船會漂離岸邊", "漁獲會變多", "船會自動回來", "沒有任何影響"], "ans": 0, "why": "文章說：以免船隻漂離岸邊，否則後果可能不堪設想。", "bk": "b2", "src": "一.11（２）"}, {"id": "b2q3", "sec": "補充", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "村民靠什麼維生？", "opts": ["捕魚和種田", "開商店", "教書"], "ans": 0, "why": "文章說：村民靠捕魚和種田維生。", "src": "補充（短文）", "bk": "b2", "gen": 1}, {"id": "b2q4", "sec": "補充", "no": "4", "k": "mc", "st": ["S10"], "sk": "read", "stem": "為了有足夠的糧食，大家經常捨棄什麼？", "opts": ["休息時間", "吃飯時間", "睡覺的床"], "ans": 0, "why": "文章說：大家經常捨棄休息時間，一早就出海捕魚。", "src": "補充（短文）", "bk": "b2", "gen": 1}, {"id": "b2q5", "sec": "補充", "no": "5", "k": "mc", "st": ["S10"], "sk": "read", "stem": "老伯伯是在什麼時候準備出海的？", "opts": ["一天清晨", "中午", "半夜"], "ans": 0, "why": "文章說：一天清晨，村裡的老伯伯準備出海。", "src": "補充（短文）", "bk": "b2", "gen": 1}, {"id": "b3q1", "sec": "十", "no": "1-1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "這篇文章主要是描述什麼內容？", "opts": ["放學時匆忙的心情", "鄰居街坊的情誼", "走在路上的安全須知", "放學路上觀察到的人、事、物"], "ans": 3, "why": "全文寫作者在放學路上，觀察到的廣告、店面、朋友和鄰居等人、事、物。", "bk": "b3", "src": "十.1（１）"}, {"id": "b3q2", "sec": "十", "no": "1-2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "為什麼作者認為自己有雙福爾摩斯的眼睛？", "opts": ["因為作者長得像福爾摩斯。", "他會用心觀察各種事物。", "他喜歡看偵探小說。", "他的視力特別好。"], "ans": 1, "why": "作者說只要夠用心，每天都能發現新鮮的事物，所以他覺得自己的眼睛像福爾摩斯一樣會觀察。", "bk": "b3", "src": "十.1（２）"}, {"id": "b3q3", "sec": "十", "no": "1-3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "下列關於本文的敘述，何者正確？", "opts": ["父親總是責怪作者走路不專心。", "作者和鄰居互不認識。", "作者常和朋友一邊談天，一邊走回家。", "作者回家總是匆匆忙忙。"], "ans": 2, "why": "文章說：我常常和好友一起回家，一路上有說有笑。", "bk": "b3", "src": "十.1（３）"}, {"id": "b3q4", "sec": "補充", "no": "4", "k": "mc", "st": ["S10"], "sk": "read", "stem": "作者在晚餐的餐桌上，會做什麼？", "opts": ["把新發現和家人分享", "看電視", "玩玩具"], "ans": 0, "why": "文章說：晚餐的餐桌上是我的播報時間，我總會把每天的新發現與家人分享。", "src": "補充（短文）", "bk": "b3", "gen": 1}, {"id": "b3q5", "sec": "補充", "no": "5", "k": "mc", "st": ["S10"], "sk": "read", "stem": "陳伯伯正在做什麼？", "opts": ["運動、跑步", "種花", "逗貓"], "ans": 0, "why": "文章說：我也常常遇見正在運動的陳伯伯。", "src": "補充（短文）", "bk": "b3", "gen": 1}, {"id": "b3q6", "sec": "補充", "no": "6", "k": "mc", "st": ["S10"], "sk": "read", "stem": "王奶奶一邊逗弄什麼，一邊照顧盆栽？", "opts": ["流浪貓", "小鳥", "小狗"], "ans": 0, "why": "文章說：她一邊逗弄流浪貓，一邊照顧她的寶貝盆栽。", "src": "補充（短文）", "bk": "b3", "gen": 1}, {"id": "b3q7", "sec": "補充", "no": "7", "k": "mc", "st": ["S10"], "sk": "read", "stem": "作者喜歡走在放學的路上，因為讓他感到什麼？", "opts": ["被溫暖包圍", "很孤單", "很害怕"], "ans": 0, "why": "文章說：同學的友情和鄰居的熱情，讓我感到被溫暖包圍。", "src": "補充（短文）", "bk": "b3", "gen": 1}, {"id": "b4q2", "sec": "十", "no": "2-2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "根據文章內容，下列哪些敘述正確？（可以不只一個）\n①描述假日時，主角和爸爸到潮境公園進行尋寶之旅。\n②主角在潮境公園找到的寶物，包括海洋生物和廢棄物。\n③從文章中，能看出主角喜歡和愛玩捉迷藏的寄居蟹相處。", "opts": ["只有①", "①和②", "②和③", "①、②、③都對"], "ans": 2, "why": "文章說「星期三放學後」去的，不是假日，所以①不對；②③都正確。（原題是複選，這裡改成選出正確的組合。）", "bk": "b4", "src": "十.2（２，複選題改成選出正確的組合）"}, {"id": "b4q3", "sec": "補充", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "主角是星期幾，和爸爸去潮境公園的？", "opts": ["星期三", "星期六", "星期日"], "ans": 0, "why": "文章說：星期三放學後，爸爸開車載我來到潮境公園。", "src": "補充（短文）", "bk": "b4", "gen": 1}, {"id": "b4q4", "sec": "補充", "no": "4", "k": "mc", "st": ["S10"], "sk": "read", "stem": "主角一邊探尋寄居蟹，一邊撿拾什麼？", "opts": ["瓶子、塑膠袋等廢棄物", "貝殼和石頭", "漂亮的海螺"], "ans": 0, "why": "文章說：一邊撿拾瓶子、塑膠袋等廢棄物。", "src": "補充（短文）", "bk": "b4", "gen": 1}, {"id": "b4q5", "sec": "補充", "no": "5", "k": "mc", "st": ["S10"], "sk": "read", "stem": "主角想怎麼處理這些廢棄物？", "opts": ["發揮創意，變成可再利用的寶物", "丟回海裡", "帶回家收藏"], "ans": 0, "why": "文章說：我要發揮創意，讓這些廢棄物起死回生，把垃圾變成可再利用的寶物。", "src": "補充（短文）", "bk": "b4", "gen": 1}, {"id": "b4q6", "sec": "補充", "no": "6", "k": "mc", "st": ["S10"], "sk": "read", "stem": "回程時，寄居蟹好像對主角說了什麼？", "opts": ["謝謝", "再見，不要走", "快點回家"], "ans": 0, "why": "文章說：寄居蟹又探出頭，彷彿向我說聲「謝謝」。", "src": "補充（短文）", "bk": "b4", "gen": 1}, {"id": "b5q1", "sec": "十一", "no": "1-1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "魏淑得的是什麼病？", "opts": ["傷風感冒", "身體不斷變小", "無法控制情緒", "語言能力退化成幼兒"], "ans": 1, "why": "文章說：吃得一天比一天少，身體也日漸縮小。", "bk": "b5", "src": "十一.1（１）"}, {"id": "b5q2", "sec": "十一", "no": "1-2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "何者和「束手無策」的意思相近？", "opts": ["一籌莫展", "束手就擒", "束之高閣", "無拘無束"], "ans": 0, "why": "「一籌莫展」，是比喻毫無辦法，和「束手無策」的意思相近。束手就擒：不加抵抗，就讓人綑綁捉拿。束之高閣：比喻棄置不用。無拘無束：自由而不受約束。", "bk": "b5", "src": "十一.1（２）"}, {"id": "b5q3", "sec": "十一", "no": "1-3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "下列句子，何者不適合填入「束手無策」？\n①這個病人已經病入膏肓了，醫師們都□□□□。\n②面對突如其來的事件，所有的官員都□□□□。\n③這個罪犯無法否認法官提供的證據，只好□□□□。\n④面對對手強勁的進攻，我們都□□□□，最後輸了比賽。", "opts": ["①", "②", "③", "④"], "ans": 2, "why": "第③句應該填「束手就擒」，不適合填「束手無策」。", "bk": "b5", "src": "十一.1（３）"}, {"id": "b5q5", "sec": "補充", "no": "5", "k": "mc", "st": ["S10"], "sk": "read", "stem": "魏淑原本是什麼樣的人？", "opts": ["英勇壯碩的大將軍", "瘦弱的書生", "年輕的醫生"], "ans": 0, "why": "文章說：有位名叫魏淑的大將軍，他英勇壯碩。", "src": "補充（短文）", "bk": "b5", "gen": 1}, {"id": "b5q6", "sec": "補充", "no": "6", "k": "mc", "st": ["S10"], "sk": "read", "stem": "家人為什麼急得像熱鍋上的螞蟻？", "opts": ["魏淑得了怪病，越來越小", "魏淑打了敗仗", "魏淑離家出走"], "ans": 0, "why": "因為魏淑得了怪病，身體日漸縮小，家人很著急。", "src": "補充（短文）", "bk": "b5", "gen": 1}, {"id": "b5q7", "sec": "補充", "no": "7", "k": "mc", "st": ["S10"], "sk": "read", "stem": "魏淑的妻子，用什麼方法餵他吃齋食？", "opts": ["用筷子挾著，一點一點餵", "讓他自己用手抓", "用大湯匙灌下去"], "ans": 0, "why": "文章說：他的妻子只好耐心的用筷子挾著齋食一點一點的餵他。", "src": "補充（短文）", "bk": "b5", "gen": 1}, {"id": "b5q8", "sec": "補充", "no": "8", "k": "mc", "st": ["S10"], "sk": "read", "stem": "「束手無策」這個成語，是從哪個詞變來的？", "opts": ["拱手無措", "拱手讓人", "手足無措"], "ans": 0, "why": "文章說：就從這裡的「拱手無措」演變而出。", "src": "補充（短文）", "bk": "b5", "gen": 1}, {"id": "b6q1", "sec": "十一", "no": "2-1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "趙嘏以什麼才能聞名於世？", "opts": ["寫詩", "行醫", "出兵打仗", "善於謀略"], "ans": 0, "why": "文章說：趙嘏的詩曾得到詩人杜牧的讚賞，因此人們很敬佩他。", "bk": "b6", "src": "十一.2（１）"}, {"id": "b6q2", "sec": "十一", "no": "2-2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "常建為什麼要寫一首不完整的詩？", "opts": ["他才疏學淺，不知道完整的詩是四句。", "他寫到一半沒有靈感。", "他想引起趙嘏的興趣。", "他太過匆忙沒時間完成。"], "ans": 2, "why": "文章說：原來常建故意先寫下前兩句，他想藉此引起趙嘏的興趣。", "bk": "b6", "src": "十一.2（２）"}, {"id": "b6q3", "sec": "十一", "no": "2-3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "從常建故意先寫兩句詩的行為，可以推測他具有什麼特質？", "opts": ["忠心耿耿", "樂善好施", "善良寬厚", "聰明機智"], "ans": 3, "why": "常建想出先寫兩句詩，引趙嘏補完的辦法，可見他聰明機智。", "bk": "b6", "src": "十一.2（３）"}, {"id": "b6q4", "sec": "十一", "no": "2-4", "k": "mc", "st": ["S10"], "sk": "read", "stem": "下列句子，何者空格中不適合填入「拋磚引玉」？\n①農場主人□□□□，用一把米吸引雞群走進雞舍。\n②主持人□□□□的說詞很巧妙，引起許多聽眾紛紛表達自己的見解。\n③老爺爺慷慨解囊捐款，□□□□之下，引起周遭民眾的迴響。\n④班長□□□□，率先上臺唱一首歌，希望能帶動同學表演的熱情。", "opts": ["①", "②", "③", "④"], "ans": 0, "why": "「拋磚引玉」是先發表自己粗淺的意見，引出別人更好的意見，也比喻以身作則，引發眾人響應。第①句用米吸引雞群，並沒有這個意思。", "bk": "b6", "src": "十一.2（４）"}, {"id": "b6q5", "sec": "補充", "no": "5", "k": "mc", "st": ["S10"], "sk": "read", "stem": "常建是在哪裡題詩的？", "opts": ["靈巖寺的牆上", "皇宮的柱子上", "學校的黑板上"], "ans": 0, "why": "文章說：他興沖沖的來到靈巖寺，在牆上題了兩句詩。", "src": "補充（短文）", "bk": "b6", "gen": 1}, {"id": "b6q6", "sec": "補充", "no": "6", "k": "mc", "st": ["S10"], "sk": "read", "stem": "「拋磚引玉」可以用來形容什麼？", "opts": ["自己先發表粗淺的意見，引出別人更好的意見", "把磚頭丟到別人家", "把玉石賣掉"], "ans": 0, "why": "「拋磚引玉」，是比喻自己先發表粗陋的意見，以引出別人更好的意見。", "src": "補充（短文）", "bk": "b6", "gen": 1}, {"id": "b8q1", "sec": "補充", "no": "1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "放學後，小美和哥哥一起走到哪裡？", "opts": ["公園", "圖書館", "市場"], "ans": 0, "why": "短文說：小美和哥哥一起走到公園。", "src": "補充（短文）", "bk": "b8", "gen": 1}, {"id": "b8q2", "sec": "補充", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "小美從什麼東西上滑下來？", "opts": ["溜滑梯", "腳踏車", "公車"], "ans": 0, "why": "短文說：小美爬上去，開心的滑下來。", "src": "補充（短文）", "bk": "b8", "gen": 1}, {"id": "b8q3", "sec": "補充", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "哥哥在旁邊做什麼？", "opts": ["跳繩", "打球", "看書"], "ans": 0, "why": "短文說：哥哥在旁邊跳繩。", "src": "補充（短文）", "bk": "b8", "gen": 1}, {"id": "b8q4", "sec": "補充", "no": "4", "k": "mc", "st": ["S10"], "sk": "read", "stem": "是誰來接他們回家吃晚餐？", "opts": ["媽媽", "爸爸", "老師"], "ans": 0, "why": "短文說：媽媽來接他們回家吃晚餐。", "src": "補充（短文）", "bk": "b8", "gen": 1}, {"id": "b9q1", "sec": "補充", "no": "1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "奶奶做了什麼點心？", "opts": ["紅豆湯圓", "奶油餅乾", "千層糕"], "ans": 0, "why": "短文說：奶奶做了一盤熱騰騰的紅豆湯圓。", "src": "補充（短文）", "bk": "b9", "gen": 1}, {"id": "b9q2", "sec": "補充", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "小明聞到香甜的味道，馬上做什麼？", "opts": ["跑進廚房幫忙", "去外面玩", "回房間睡覺"], "ans": 0, "why": "短文說：小明聞到香甜的味道，馬上跑進廚房幫忙。", "src": "補充（短文）", "bk": "b9", "gen": 1}, {"id": "b9q3", "sec": "補充", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "小明拿著什麼，把湯圓放進碗裡？", "opts": ["湯匙", "筷子", "叉子"], "ans": 0, "why": "短文說：他拿著湯匙，一顆一顆把湯圓放進碗裡。", "src": "補充（短文）", "bk": "b9", "gen": 1}, {"id": "b9q4", "sec": "補充", "no": "4", "k": "mc", "st": ["S10"], "sk": "read", "stem": "爺爺嘗了湯圓，笑著說什麼？", "opts": ["真好吃，謝 糧」是米麥以外的其他穀類。", "ans": 1, "why": "「雜糧」，是米麥以外的其他穀類。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf150", "sec": "補充", "no": "150", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「愉快」是心裡覺得高興、舒服。", "ans": 1, "why": "「愉快」，是心裡覺得高興、舒服。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf151", "sec": "補充", "no": "151", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「驚慌失措」是因為害怕，不知道該怎麼辦。", "ans": 1, "why": "「驚慌失措」，是因為害怕慌亂，不知道該怎麼辦。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf152", "sec": "補充", "no": "152", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「驚訝」是對意想不到的事，覺得奇怪。", "ans": 1, "why": "「驚訝」，是對意想不到的事，覺得奇怪。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf153", "sec": "補充", "no": "153", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「以身作則」是用自己的行為，當別人的榜樣。", "ans": 1, "why": "「以身作則」，是用自己的行為，當別人的榜樣。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf154", "sec": "補充", "no": "154", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「力爭上游」是努力奮鬥，求取上進。", "ans": 1, "why": "「力爭上游」，是努力奮鬥，求取上進。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf155", "sec": "補充", "no": "155", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「力爭上游」和「自甘墮落」的意思相反。", "ans": 1, "why": "「力爭上游」是求取上進，「自甘墮落」是甘願自暴自棄，意思相反。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf156", "sec": "補充", "no": "156", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「束手無策」是面對問題，毫無辦法。", "ans": 1, "why": "「束手無策」，是比喻面對問題時，毫無解決的辦法。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf157", "sec": "補充", "no": "157", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「拋磚引玉」是先說出粗淺的意見，引出別人更好的意見。", "ans": 1, "why": "「拋磚引玉」，是比喻自己先發表粗陋的意見，以引出別人的佳作或高論。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf158", "sec": "補充", "no": "158", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「赴湯蹈火」是不怕危險，奮不顧身。", "ans": 1, "why": "「赴湯蹈火」，是比喻奮不顧身，不避艱險。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf159", "sec": "補充", "no": "159", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「捨本逐末」是只顧小處，忘了根本。", "ans": 1, "why": "「捨本逐末」，是不求事物的根本大端，只重視微末小節。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf160", "sec": "補充", "no": "160", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「赴湯蹈火」是在廚房煮湯。", "ans": 0, "why": "「赴湯蹈火」，是比喻奮不顧身，不避艱險，不是煮湯。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf161", "sec": "補充", "no": "161", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "〈放學後〉這一課，是改寫自徐國能的作品。", "ans": 1, "why": "課本的作者簡介說：改寫自徐國能〈颱風假的日子〉。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf162", "sec": "補充", "no": "162", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "作者每天放學，總是飛也似的趕回家。", "ans": 1, "why": "課文說：我總是飛也似的趕回家。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf163", "sec": "補充", "no": "163", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "作者放學回到家，總是先去公園玩。", "ans": 0, "why": "課文說：回到家裡，常有美味的點心，是先回家吃點心，不是先去公園。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf164", "sec": "補充", "no": "164", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "課文裡的點心有奶油餅乾、千層糕和紅豆湯。", "ans": 1, "why": "課文說：有時是奶油餅乾，有時是千層糕，有時是紅豆湯。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf165", "sec": "補充", "no": "165", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「香氣撲鼻」是形容軟綿可口的紅豆湯。", "ans": 0, "why": "「香氣撲鼻」是形容奶油餅乾；「軟綿可口」才是形容紅豆湯。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf166", "sec": "補充", "no": "166", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「層次分明」是形容千層糕。", "ans": 1, "why": "課文說：層次分明的千層糕。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf167", "sec": "補充", "no": "167", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "作者最重要的精神食糧是國語日報。", "ans": 1, "why": "課文說：我最重要的精神食糧，就是國語日報。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf168", "sec": "補充", "no": "168", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "作者和姐姐為了誰先看報紙，常常爭吵。", "ans": 1, "why": "課文說：我和姐姐常常為了誰先看而爭吵不休。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf169", "sec": "補充", "no": "169", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "作者和姐姐想出的好方法，是姐姐看左邊，我看右邊。", "ans": 1, "why": "課文說：姐姐看左邊，我就看右邊；姐姐看正面，我就看反面。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf170", "sec": "補充", "no": "170", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "作者和姐姐後來決定，誰也不看報紙。", "ans": 0, "why": "他們想出好方法：姐姐看左邊，我就看右邊，兩個人一起看。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf171", "sec": "補充", "no": "171", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "作者在公園玩「警察抓小偷」和跳繩。", "ans": 1, "why": "課文說：玩你追我躲的「警察抓小偷」，有時則是玩跳繩。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf172", "sec": "補充", "no": "172", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "作者聽到大人呼喊回家吃晚餐，馬上開心的跑回家。", "ans": 0, "why": "課文說：才依依不捨的結束遊戲，是捨不得離開。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf173", "sec": "補充", "no": "173", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「依依不捨」是十分捨不得離開。", "ans": 1, "why": "「依依不捨」，是十分捨不得離開。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf174", "sec": "補充", "no": "174", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「不約而同」是事先約好了，才一起去做。", "ans": 0, "why": "「不約而同」是沒有事先約定，卻做了相同的事。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf175", "sec": "補充", "no": "175", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「奮勇爭先」是勇敢的搶著向前。", "ans": 1, "why": "「奮勇爭先」，是勇敢的搶著向前。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf176", "sec": "補充", "no": "176", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "作者多希望時間暫停，永遠停留在美好的時光。", "ans": 1, "why": "課文說：多希望時間暫停，讓我可以永遠停留在這美好的幸福時光。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf177", "sec": "補充", "no": "177", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「點心對著我們招招手」，是把點心當成人來寫。", "ans": 1, "why": "點心不會真的招手，作者把點心當成人來寫，好像在歡迎我們。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf178", "sec": "補充", "no": "178", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "運用各種感官觀察，寫下感受，讀起來更能感覺到食物的美味。", "ans": 1, "why": "這是課本教學走廊的提醒：運用各種感官進行觀察，寫下感受的詞語，讀起來更能感覺到食物的美味。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf179", "sec": "補充", "no": "179", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「香氣撲鼻」是用鼻子聞到的感覺。", "ans": 1, "why": "「香氣撲鼻」，是用鼻子聞到的感覺。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf180", "sec": "補充", "no": "180", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「層次分明」是用眼睛看到的感覺。", "ans": 1, "why": "「層次分明」，是用眼睛看到的感覺。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf181", "sec": "補充", "no": "181", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「軟綿可口」是用嘴巴吃到的感覺。", "ans": 1, "why": "「軟綿可口」，是用嘴巴吃到的感覺。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf182", "sec": "補充", "no": "182", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "說話時，要清楚表達想法，還要具體詳細說明理由。", "ans": 1, "why": "課本說：說話時，要能清楚表達，說出自己的想法，並具體詳細說明理由。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf183", "sec": "補充", "no": "183", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "說明理由時，只要說「因為我喜歡」就夠了，不用說得很詳細。", "ans": 0, "why": "說話要具體詳細說明理由，不能只說「我喜歡」。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf184", "sec": "補充", "no": "184", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「不管……還是……」常用來表示：不論哪一種情形，結果都一樣。", "ans": 1, "why": "「不管是比速度，還是比次數，大家都奮勇爭先」，就是不論哪種比賽，結果都一樣。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf185", "sec": "補充", "no": "185", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「不論……總……」前後兩句話，意思常常是不管怎樣，結果都一樣。", "ans": 1, "why": "「不論多麼困難的題目，哥哥總能算出答案」，就是不管怎樣，結果都一樣。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf186", "sec": "補充", "no": "186", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「我一邊聽音樂，一邊享用下午茶」，句子中的「一邊……一邊……」，是說兩件事同時進行。", "ans": 1, "why": "「一邊……一邊……」，是說兩件事同時進行。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf187", "sec": "補充", "no": "187", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "吃飯時不要浪費糧食，要珍惜食物。", "ans": 1, "why": "食物得來不易，不浪費糧食，是惜福的表現。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf188", "sec": "補充", "no": "188", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "飯吃不完，可以隨手丟掉。", "ans": 0, "why": "浪費糧食是不好的，吃不完的食物不要隨手丟掉。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf189", "sec": "補充", "no": "189", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "過馬路時，要遵守交通規則。", "ans": 1, "why": "遵守交通規則，才能保護自己和別人。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf190", "sec": "補充", "no": "190", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "騎機車可以不用戴安全帽，因為警察看不到。", "ans": 0, "why": "騎機車要戴安全帽，不管警察有沒有看到，都要遵守規則。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf191", "sec": "補充", "no": "191", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "在泳池邊、餐廳裡奔跑，很危險。", "ans": 1, "why": "在泳池邊、餐廳裡奔跑，容易跌倒或撞到別人。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf192", "sec": "補充", "no": "192", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "發現別人的東西不見了，可以偷偷拿走。", "ans": 0, "why": "偷拿別人的東西是不對的行為。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf193", "sec": "補充", "no": "193", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "玩遊戲時，大家要遵守規則，才公平。", "ans": 1, "why": "遵守規則，遊戲才公平，也才好玩。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf194", "sec": "補充", "no": "194", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "玩遊戲輸了，可以耍賴不遵守規則。", "ans": 0, "why": "輸了也要遵守規則，遊戲才公平。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf195", "sec": "補充", "no": "195", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「又快又穩」的組成方式是「又＋樣子＋又＋樣子」。", "ans": 1, "why": "「又快又穩」，是「又＋樣子＋又＋樣子」。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf196", "sec": "補充", "no": "196", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「香氣撲鼻的奶油餅乾」的組成方式是「樣子＋的＋東西」。", "ans": 1, "why": "「香氣撲鼻」是樣子，「奶油餅乾」是東西。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf197", "sec": "補充", "no": "197", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「飛也似的趕回家」，是說作者趕得像飛一樣快。", "ans": 1, "why": "「飛也似的」，是說像飛一樣，形容很快。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf198", "sec": "補充", "no": "198", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「還有什麼比這更快樂呢？」是在問問題，要等人回答。", "ans": 0, "why": "這是反問句，意思是沒有什麼比這更快樂了，不需要回答。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "o12a", "sec": "十二", "no": "1", "k": "order", "st": ["S6"], "sk": "sent", "chunks": ["是比速度", "還是", "不管", "都不落人後", "比次數"], "ord": [2, 0, 1, 4, 3], "comma": [0, 4], "end": "。", "std": "不管是比速度，還是比次數，都不落人後。", "why": "先說「不管」，再說「是比速度」，然後說「還是」「比次數」，最後說「都不落人後」。"}, {"id": "o12b", "sec": "十二", "no": "2", "k": "order", "st": ["S6"], "sk": "sent", "chunks": ["我總是", "每天", "趕回家", "到了放學的時候", "飛也似的"], "ord": [1, 3, 0, 4, 2], "comma": [3], "end": "。", "std": "每天到了放學的時候，我總是飛也似的趕回家。", "why": "先說「每天」「到了放學的時候」，再說「我總是」「飛也似的」，最後說「趕回家」。"}, {"id": "o10", "sec": "十", "no": "2-1", "k": "order", "st": ["S6"], "sk": "sent", "chunks": ["前往潮境公園", "回程告別", "在潮間帶與寄居蟹互動和「尋寶」", "從岸邊走到海蝕平臺找潮間帶動物"], "ord": [0, 3, 2, 1], "comma": [0, 3, 2], "end": "。", "std": "前往潮境公園，從岸邊走到海蝕平臺找潮間帶動物，在潮間帶與寄居蟹互動和「尋寶」，回程告別。", "why": "先前往潮境公園，再從岸邊走到海蝕平臺找動物，接著在潮間帶和寄居蟹互動、尋寶，最後回程告別。", "src": "十.2（１：依照文章先後順序排列）"}, {"id": "o11", "sec": "十一", "no": "1-4", "k": "order", "st": ["S6"], "sk": "sent", "chunks": ["尋遍名醫和道士都束手無策。", "生日時吃了齋食竟然不藥而癒。", "魏淑原本是一個身材魁武的大將軍。", "他得了一種怪病，身體會漸漸縮小。"], "ord": [2, 3, 0, 1], "comma": [], "end": "", "std": "魏淑原本是一個身材魁武的大將軍。他得了一種怪病，身體會漸漸縮小。尋遍名醫和道士都束手無策。生日時吃了齋食竟然不藥而癒。", "why": "故事先說魏淑原本是大將軍，接著得了怪病，然後尋遍名醫都沒辦法，最後吃了齋食竟然痊癒。", "src": "十一.1（４：按照故事排出正確的順序）"}, {"id": "og_1", "sec": "課本", "no": "", "k": "order", "st": ["S6"], "sk": "sent", "chunks": ["回到家裡", "常有美味的點心", "對著我們招招手"], "ord": [0, 1, 2], "comma": [0, 1], "end": "。", "std": "回到家裡，常有美味的點心，對著我們招招手。", "why": "先說回到家裡，再說常有美味的點心，最後說對著我們招招手。", "src": "課本（課文第二段）"}, {"id": "og_2", "sec": "課本", "no": "", "k": "order", "st": ["S6"], "sk": "sent", "chunks": ["有時是", "香氣撲鼻的", "奶油餅乾"], "ord": [0, 1, 2], "comma": [], "end": "。", "std": "有時是香氣撲鼻的奶油餅乾。", "why": "先說有時是，再說香氣撲鼻的，最後說奶油餅乾。", "src": "課本（課文第二段）"}, {"id": "og_3", "sec": "課本", "no": "", "k": "order", "st": ["S6"], "sk": "sent", "chunks": ["有時是", "層次分明的", "千層糕"], "ord": [0, 1, 2], "comma": [], "end": "。", "std": "有時是層次分明的千層糕。", "why": "先說有時是，再說層次分明的，最後說千層糕。", "src": "課本（課文第二段）"}, {"id": "og_4", "sec": "課本", "no": "", "k": "order", "st": ["S6"], "sk": "sent", "chunks": ["有時是", "軟綿可口的", "紅豆湯"], "ord": [0, 1, 2], "comma": [], "end": "。", "std": "有時是軟綿可口的紅豆湯。", "why": "先說有時是，再說軟綿可口的，最後說紅豆湯。", "src": "課本（課文第二段）"}, {"id": "og_5", "sec": "課本", "no": "", "k": "order", "st": ["S6"], "sk": "sent", "chunks": ["好友們", "常常", "不約而同", "來我家寫功課"], "ord": [0, 1, 2, 3], "comma": [], "end": "。", "std": "好友們常常不約而同來我家寫功課。", "why": "先說誰，再說常常，然後說不約而同，最後說來我家寫功課。", "src": "課本（課文第二段）"}, {"id": "og_6", "sec": "課本", "no": "", "k": "order", "st": ["S6"], "sk": "sent", "chunks": ["大家一坐下來", "總是不敵美食當前", "將功課拋到腦後"], "ord": [0, 1, 2], "comma": [0, 1], "end": "。", "std": "大家一坐下來，總是不敵美食當前，將功課拋到腦後。", "why": "先說大家一坐下來，再說總是不敵美食當前，最後說將功課拋到腦後。", "src": "課本（課文第二段）"}, {"id": "og_7", "sec": "課本", "no": "", "k": "order", "st": ["S6"], "sk": "sent", "chunks": ["除了美味的點心", "我最重要的精神食糧", "就是國語日報"], "ord": [0, 1, 2], "comma": [0, 1], "end": "。", "std": "除了美味的點心，我最重要的精神食糧，就是國語日報。", "why": "先說除了美味的點心，再說我最重要的精神食糧，最後說就是國語日報。", "src": "課本（課文第三段）"}, {"id": " 游"], "ans": 3, "why": "「力爭上游」，是努力奮鬥，求取上進，最適合。赴湯蹈火：比喻奮不顧身，不避艱險。拋磚引玉：比喻自己先發表粗淺的意見，引出別人更好的意見。以身作則：以自身行為作為他人的榜樣。", "src": "六.3"}, {"id": "q6x_1", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「以身作則」是什麼意思？", "opts": ["以自己的行為，當別人的榜樣", "自己不做，叫別人做", "只說不做"], "ans": 0, "why": "「以身作則」，是以自身行為作為他人的榜樣。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_2", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「力爭上游」是什麼意思？", "opts": ["努力奮鬥，求取上進", "甘願自暴自棄", "在河裡游泳"], "ans": 0, "why": "「力爭上游」，是比喻努力奮鬥，求取上進。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_3", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「自甘墮落」是什麼意思？", "opts": ["甘願自暴自棄，不求上進", "努力向上", "很有禮貌"], "ans": 0, "why": "「自甘墮落」，是甘願自暴自棄，不求上進。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_4", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「捨本逐末」是什麼意思？", "opts": ["不重視根本，只重視小地方", "把根本放在第一位", "很會做生意"], "ans": 0, "why": "「捨本逐末」，是不求事物的根本大端，只重視微末小節。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_5", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「赴湯蹈火」是什麼意思？", "opts": ["比喻奮不顧身，不怕危險", "在廚房煮湯", "在火上跳舞"], "ans": 0, "why": "「赴湯蹈火」，是比喻奮不顧身，不避艱險。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_6", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「束手無策」是什麼意思？", "opts": ["面對問題，毫無辦法", "把手綁起來", "做事很有計畫"], "ans": 0, "why": "「束手無策」，是比喻面對問題時，毫無解決的辦法。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_7", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「束手就擒」是什麼意思？", "opts": ["不加抵抗，讓人綁起來抓走", "努力逃跑", "想出好辦法"], "ans": 0, "why": "「束手就擒」，是不加抵抗，就讓人綑綁捉拿。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_8", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「一籌莫展」是什麼意思？", "opts": ["一點辦法也沒有", "想出很多辦法", "做事很快"], "ans": 0, "why": "「一籌莫展」，是比喻毫無辦法。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_9", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「拋磚引玉」是什麼意思？", "opts": ["自己先說粗淺的意見，引出別人更 別人。", "src": "課本（課文〈放學後〉）"}, {"id": "cs_12", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「依依不捨」是什麼意思？", "opts": ["十分捨不得離開", "馬上就離開", "不想來"], "ans": 0, "why": "「依依不捨」，是十分捨不得離開。", "src": "課本（課文〈放學後〉）"}, {"id": "cs_13", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「多希望時間暫停」，表示作者覺得放學後的時光怎麼樣？", "opts": ["非常美好，希望不要結束", "很無聊", "很可怕"], "ans": 0, "why": "作者希望時間暫停，永遠停留在這美好的幸福時光，表示非常喜歡。", "src": "課本（課文〈放學後〉）"}, {"id": "cs_14", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "作者覺得放學後的時間，過得怎麼樣？", "opts": ["特別快", "特別慢", "停住不動"], "ans": 0, "why": "課文說：時間總是過得特別快。", "src": "課本（課文〈放學後〉）"}, {"id": "cf_1", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "這一課〈放學後〉，主要在寫什麼？", "opts": ["作者放學後的生活", "上課時的情形", "一次旅行"], "ans": 0, "why": "全文寫作者放學後吃點心、看國語日報、玩遊戲的生活。", "src": "課本（課文句型、標點）"}, {"id": "cf_2", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「不管是比速度，還是比次數，大家都奮勇爭先」，「不管……還是……」是什麼意思？", "opts": ["不論哪一種情形，結果都一樣", "只有第一種情形", "兩種情形都不好"], "ans": 0, "why": "「不管……還是……」，表示不論哪一種情形，結果都一樣。", "src": "課本（課文句型、標點）"}, {"id": "cf_3", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「姐姐看左邊，我就看右邊」，他們是怎麼看報紙的？", "opts": ["兩個人一起看，一人看一邊", "輪流看，一次一個人", "只有姐姐看"], "ans": 0, "why": "姐姐看左邊，我就看右邊，兩個人一起看。", "src": "課本（課文句型、標點）"}, {"id": "cf_4", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「我們經常玩到太陽快下山」，「經常」是什麼意思？", "opts": ["時常，常常", "偶爾", "從來不"], "ans": 0, "why": "「經常」，是時常，常常。", "src": "課本（課文句型、標點）"}, {"id": "cf_5", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「不論是吃點心、看報紙，還是玩遊戲」，句子中的「、」叫什麼？", "opts": ["頓號", "逗號", "句號"], "ans": 0, "why": "「、」叫做頓號，用來隔開並列的詞語。", "src": "課本（課文句型、標點）"}, {"id": "cf_6", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「回家吃晚餐了！」句尾的「！」叫什麼？", "opts": ["驚嘆號", "問號", "頓號"], "ans": 0, "why": "「！」叫做驚嘆號，用在表示驚訝、感嘆或呼喊的句子後面。", "src": "課本（課文句型、標點）"}, {"id": "cf_7", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「還有什麼比這更快樂呢？」句尾的「？」叫什麼？", "opts": ["問號", "句號", "驚嘆號"], "ans": 0, "why": "「？」叫做問號，用在問句的後面。", "src": "課本（課文句型、標點）"}, {"id": "cf_8", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「玩你追我躲的「警察抓小偷」」，「警察抓小偷」外面的「」叫什麼？", "opts": ["引號", "括號", "頓號"], "ans": 0, "why": "「」叫做引號，用來標示特別的名稱或別人說的話。", "src": "課本（課文句型、標點）"}, {"id": "cf_9", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "作者用「飛也似的」來形容什麼？", "opts": ["趕回家的速度很快", "天氣很好", "點心很好吃"], "ans": 0, "why": "「飛也似的趕回家」，是形容趕回家的速度像飛一樣快。", "src": "課本（課文句型、標點）"}, {"id": "g4_1", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "小明怎麼回家？", "opts": ["飛也似的跑回家", "慢慢走回家", "坐車回家"], "ans": 0, "why": "短文說：小明飛也似的跑回家。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "放學了，小明飛也似的跑回家。"}, {"id": "g4_2", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "餅乾聞起來怎麼樣？", "opts": ["香氣撲鼻", "臭臭的", "沒有味道"], "ans": 0, "why": "短文說：香氣撲鼻的餅乾。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "桌上有一盤香氣撲鼻的餅乾，哥哥看了直流口水。"}, {"id": "g4_3", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "奶奶煮了什麼？", "opts": ["紅豆湯", "青菜", "麵條"], "ans": 0, "why": "短文說：奶奶煮了一鍋熱呼呼的紅豆湯。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "奶奶煮了一鍋熱呼呼的紅豆湯，大家都喝得很開心。"}, {"id": "g4_4", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "姐姐和我怎麼看報紙？", "opts": ["輪流看", "搶著看", "都不看"], "ans": 0, "why": "短文說：姐姐和我輪流看報紙。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "姐姐和我輪流看報紙，大家都不吵架了。"}, {"id": "g4_5", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "同學們在公園玩什麼？", "opts": ["跳繩", "打球", "騎車"], "ans": 0, "why": "短文說：同學們在公園玩跳繩。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "放學後，同學們在公園玩跳繩，大家都很努力。"}, {"id": "g4_6", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "誰在路口指揮交通？", "opts": ["警察叔叔", "老師", "媽媽"], "ans": 0, "why": "短文說：警察叔叔在路口指揮交通。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "警察叔叔在路口指揮交通，大家都遵守規則。"}, {"id": "g4_7", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "媽媽喊大家做什麼？", "opts": ["回家吃飯", "去公園", "寫功課"], "ans": 0, "why": "短文說：媽媽喊：「回家吃飯了！」", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "太陽快下山了，媽媽喊：「回家吃飯了！」"}, {"id": "g4_8", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "小美吃完點心後做什麼？", "opts": ["寫功課", "玩遊戲", "睡覺"], "ans": 0, "why": "短文說：小美認真寫功課。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "吃完點心後，小美認真寫功課，一下子就寫完了。"}, {"id": "g4_9", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "弟弟離開公園時，心情怎麼樣？", "opts": ["捨不得", "很開心", "很生氣"], "ans": 0, "why": "短文說：弟弟捨不得離開公園，依依不捨的走回家。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "弟弟捨不得離開公園，依依不捨的走回家。"}, {"id": "g4_10", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "爸爸說不可以浪費什麼？", "opts": ["糧食", "時間", "金錢"], "ans": 0, "why": "短文說：不可以浪費糧食。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "爸爸說，要珍惜食物，不可以浪費糧食。"}, {"id": "g4_11", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "小華把什麼借給同學？", "opts": ["雨傘", "書包", "外套"], "ans": 0, "why": "短文說：小華把傘借給同學。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "下雨了，小華把傘借給同學，自己淋雨回家。"}], "books": [{"id": "b0", "title": "放學後（課文）", "src": "課本 第二課", "e": "🏠", "paras": ["每天到了放學的時候，我總是飛也似的趕回家。", "回到家裡，常有美味的點心，對著我們招招手：有時是香氣撲鼻的奶油餅乾，有時是層次分明的千層糕，有時是軟綿可口的紅豆湯。好友們常常不約而同來我家「寫功課」，大家一坐下來，總是不敵美食當前，將功課拋到腦後，把眼前的美食一掃而空。", "除了美味的點心，我最重要的精神食糧，就是國語日報。我和姐姐常常為了誰先看而爭吵不休，後來我們一起想出好方法：姐姐看左邊，我就看右邊；姐姐看正面，我就看反面……。我們一邊吃點心，一邊讀有趣的故事，還有什麼比這更快樂呢？", "寫完功課以後，就是我的玩樂時間，姐姐、同學和我會在附近的公園，玩你追我躲的「警察抓小偷」，有時則是玩跳繩，不管是比速度，還是比次數，大家都奮勇爭先，不落人後。我們經常玩到太陽快下山，聽到大人們紛紛呼喊：「回家吃晚餐了！」才依依不捨的結束遊戲。", "放學後的美好時光，不論是吃點心、看報紙，還是玩遊戲，時間總是過得特別快。多希望時間暫停，讓我可以永遠停留在這美好的幸福時光。"], "notes": ["不約而同：沒有事先約定，卻做了相同的事。", "精神食糧：指能讓心靈得到滿足的書報、文章等。", "奮勇爭先：勇敢的搶著向前。", "依依不捨：十分捨不得離開。"]}, {"id": "b7", "title": "你認同作者的看法嗎？（我會說話）", "src": "課本（教學走廊：我會說話）", "e": "🗣", "paras": ["你認同作者的看法嗎？說話時，要能清楚表達，說出自己的想法，並具體詳細說明理由。", "我認同作者的看法。放學後的時光很美好，因為可以吃點心、看報紙，還能玩刺激有趣的遊戲，讓人樂在其中，感覺時間過得特別快。", "我不認同作者的看法。我認為上學的時光比放學後更美好，因為學校裡有許多同學，我們可以一起聊天、學習，放學後只有我一個人。", "這裡的理由可以先找一找作者做的事、說的話，再用自己的角度說明。"], "notes": []}, {"id": "b1", "title": "午後的影片", "src": "一.4（閱讀）", "e": "🎬", "paras": ["午後，姐姐和爸爸一起欣賞影片。", "畫面中，警察緊追不捨的跟著違反交通規則的民眾，鳴笛聲招來雜糧商店老闆的注意。最後那位違規民眾的機車拋錨，警察便迅速的將人繩之以法，結束這場短暫的追逐。", "過沒多久，有人依據監控影片，發現他是日前闖入溫泉公園的偷鞋大盜，此事立刻引起媒體爭相報導，幸好泡湯民眾鞋子失蹤的案件，很快便真相大白。"], "notes": []}, {"id": "b2", "title": "海邊的小漁村", "src": "一.11（閱讀）", "e": "🌊", "paras": ["海邊有個小漁村，村民靠捕魚和種田維生。為了能有足夠的糧食，大家經常捨棄休息時間，一早就出海捕魚。", "一天清晨，村裡的老伯伯準備出海時，發現漁船突然拋錨，幸好他立刻警覺到，暫停出海，並且用繩子固定好船隻，以免船隻漂離岸邊，否則後果可能不堪設想。"], "notes": []}, {"id": "b3", "title": "放學的路上", "src": "十.1（閱讀）", "e": "🎒", "paras": ["我喜歡走在放學的路上，悠閒愉快的氣氛，總能讓我忘卻學校生活的緊張。", "我總會一邊哼歌，一邊睜大雙眼左顧右盼。有時，我會發現路口的大樓換上了新的廣告標語；有時，也會看到街角又出現新的店面。晚餐的餐桌上是我的播報時間，我總會把每天的新發現與家人分享，就像記者報導即時新聞一樣。爸爸時常笑著說：「我怎麼就沒發現這些不一樣？」我會得意洋洋的說：「因為我這雙福爾摩斯眼睛是獨一無二的呀！」", "我常常和好友一起回家，一路上有說有笑。說到學校開心的事，我們總會一起開懷大笑；聊到生活中的苦惱，我倆也會互相安慰，彼此鼓勵。我也常常遇見正在運動的陳伯伯，他總是紅光滿面，用宏亮的聲音大聲喊著：「嘿！要不要和我一起跑步呢？」路過王奶奶家時，會見到她一邊逗弄流浪貓，一邊照顧她的寶貝盆栽並說：「多多喝水，快快長大！」有時她會熱心的準備一把自己種的青菜，叮嚀我要拿給媽媽。我喜歡走在放學的路上，同學的友情和鄰居的熱情，讓我感到被溫暖包圍。", "只要夠用心，在放學的路上，我每天都能發現新鮮的事物，每天都會看見不一樣的風景。"], "notes": []}, {"id": "b4", "title": "潮境尋寶記", "src": "十.2（閱讀）", "e": "🐚", "paras": ["星期三放學後，爸爸開車載我來到基隆的潮境公園，進行一趟尋寶之旅。", "到達潮境公園，遠遠向前望去，綠色的海藻就像一條美麗的河流。岸邊的礁石又溼又滑，我們小心翼翼的向前走。接著，我移步到海蝕平臺，蹲下來找尋潮間帶動物的蹤影。終於，在海蝕溝中看到寄居蟹從殼裡探出頭。", "走在潮間帶，寄居蟹似乎想和我玩捉迷藏。我一邊探尋牠們的蹤跡，一邊撿拾瓶子、塑膠袋等廢棄物。來到這裡像在「尋寶」，除了看到小巧可愛的海洋生物，還發現形形色色的廢棄物。我要發揮創意，讓這些廢棄物起死回生，把垃圾變成可再利用的寶物。", "回程時，寄居蟹又探出頭，彷彿向我說聲「謝謝」。我也跟牠們揮了揮手，告別這座大自然的寶庫。"], "notes": ["潮間帶：漲潮時被海水淹沒、退潮時露出來的海岸地帶。", "海蝕平臺：海浪長期侵蝕岩岸，形成的平坦岩石地面。", "寄居蟹：住在空貝殼裡的小螃蟹。"]}, {"id": "b5", "title": "束手無策", "src": "十一（成語故事）", "e": "🙌", "paras": ["唐朝時，有位名叫魏淑的大將軍，他英勇壯碩，城裡的人既敬佩他的功績，也畏懼他散發出來的威嚴。", "有一天，魏淑忽然得了一種怪病，這種病在身體上不會出現任何病痛，但吃得一天比一天少，身體也日漸縮小。家人們急得像熱鍋上的螞蟻，不但上山下海遍尋名醫，還不遠千里拜訪各處的道士，但不幸的是，一見到魏淑，再厲害的名醫也只能把雙手抱在胸前，對這個病一點兒辦法也沒有。就這樣，不到一年的時間，魏淑的身體竟然縮回像嬰兒一樣的大小，只能讓他的母親和妻子輪流抱在手中。", "直到某一年的生日，家人請來和尚為他誦經祈福，並且虔誠的準備了齋食。因為魏淑實在太瘦弱了，他的妻子只好耐心的用筷子挾著齋食一點一點的餵他，說也奇怪，不一會兒魏淑就能進食一小碗了。從此之後，他每天的飲食分量日漸增加，身體也漸漸長大，不到半年，就恢復原來健壯的樣子。", "後來「束手無策」這個成語，就從這裡的「拱手無措」演變而出，用來比喻面對問題時，毫無解決的辦法。"], "notes": ["誦經：念誦佛經。", "虔誠：恭敬而誠懇。", "齋食：素食。"]}, {"id": "b6", "title": "拋磚引玉", "src": "十一（成語故事）", "e": "🧱", "paras": ["唐朝有一位詩人名叫趙嘏，他的詩曾得到詩人杜牧的讚賞，因此人們很敬佩他。當時還有一位詩人名叫常建，他對自己的詩作並不滿意，因此非常仰慕趙嘏的詩。", "有一次，趙嘏到蘇州去遊覽，正好在蘇州的常建得知後非常興奮。他想：「這可是個千載難逢的好機會，我一定要設法讓趙嘏留下幾句好詩來！」他突然心生一計，興沖沖的來到靈巖寺。", "沒過多久，趙嘏果然到寺廟中遊覽，他一抬頭，只見到牆上題了兩句詩：「館娃宮畔十年寺，水闊雲多客至稀。」原來常建故意先寫下前兩句，他想藉此引起趙嘏的興趣。", "果不其然，趙嘏提筆在後面補上：「聞說春來倍惆悵，百花深處一僧歸。」意境高妙，完成了一首好詩。後來，人們就以「拋磚引玉」用來比喻自己先發表粗陋的詩文或不成熟的意見，以引出別人的佳作或高論，多用作自謙之詞。也用於比喻以身作則，引發眾人響應。"], "notes": ["讚賞：稱讚欣賞。", "粗陋：粗糙簡陋。", "自謙：自己很謙虛。"]}, {"id": "b8", "title": "公園裡的小美", "src": "補充", "e": "🛝", "paras": ["放學後，小美和哥哥一起走到公園。", "公園裡有一座長長的溜滑梯，小美爬上去，開心的滑下來。", "哥哥在旁邊跳繩，一下、兩下、三下，跳得又快又穩。", "太陽快下山了，媽媽來接他們回家吃晚餐。"], "notes": []}, {"id": "b9", "title": "紅豆湯圓", "src": "補充", "e": "🍡", "paras": ["週末下午，奶奶做了一盤熱騰騰的紅豆湯圓。", "小明聞到香甜的味道，馬上跑進廚房幫忙。", "他拿著湯匙，一顆一顆把湯圓放進碗裡，再端給爺爺。", "爺爺嘗了一口，笑著說：「真好吃，謝謝你！」"], "notes": []}, {"id": "b10", "title": "雨中的小貓", "src": "補充", "e": "🐱", "paras": ["下雨的星期三，小華撐著黃色的雨傘走在放學的路上。", "路邊的水窪裡，映出一朵朵彩色的雨傘。小華看見一隻小貓縮在屋簷下發抖。", "他立刻把自己的雨傘靠在牆邊，再從書包裡拿出毛巾，輕輕擦乾小貓的身體。", "雨停了，小貓喵喵叫著，好像在對小華說謝謝。小華心裡暖暖的，快步走回家。"], "notes": []}], "img": {}, "cover": [["一", "國字注音（短文 3 篇、詞語與句子 9 題）", ["z4_2", "z4_3", "z4_5", "z4_6", "z4_7", "z4_8", "z4_9", "z4_10", "z4_12", "z_a1", "z_a2", "z_a3", "z_a4", "z_a5", "z_a6", "z_a7", "zp_a", "z_b1", "z_b2", "z_b3", "z_b4", "z_b5", "z_b6", "z_b7", "z_b8", "z_b9", "zp_b", "z_c1", "z_c2", "z_c3", "z_c4", "zp_c"]], ["一", "閱讀測驗：午後的影片（打勾題）、海邊的小漁村（2 題）", ["b1q1", "b2q1", "b2q2"]], ["二", "造詞（依、則、警、暫、湯、繩、糧；改成選出正確的詞語、讀音，共 14 題）", ["q2_1", "q2_1z", "q2_2", "q2_2z", "q2_3", "q2_3z", "q2_4", "q2_4z", "q2_5", "q2_5z", "q2_6", "q2_6z", "q2_7", "q2_7z"]], ["三", "選擇題（約束、熱湯、雞湯、偷偷摸摸、招和沼；共 5 題）", ["q3_1", "q3_2", "q3_3", "q3_4", "q3_5"]], ["四", "先寫部首、先寫注音，再造詞（偷、愉、警、繩；共 8 題）", ["q4_1a", "q4_1b", "q4_2a", "q4_2b", "q4_3a", "q4_3b", "q4_4a", "q4_4b"]], ["五", "改錯題（3 題，共 4 個錯字）", ["ty5_1", "ty5_2", "ty5_3"]], ["六", "選擇題：生字延伸成語（以身作則、力爭上游；共 3 題）", ["q6_1", "q6_2", "q6_3"] function zyVariants(z,n){if(!VALIDZ){VALIDZ=new Set(Object.values(ZYC));ZYS.forEach(r=>VALIDZ.add(r[2]))}
  const m=z.match(/^([ㄅ-ㄩ]+)([ˊˇˋ˙]?)$/);if(!m)return[];const base=m[1],tone=m[2];let tv=[],iv=[],fv=[];

  const last=base[base.length-1];if(last==='ㄣ')fv.push(base.slice(0,-1)+'ㄥ'+tone);else if(last==='ㄥ')fv.push(base.slice(0,-1)+'ㄣ'+tone);

          return isCJK(ch)?`<button class="sch tt" data-i="${i}">${zs[i]?`<ruby>${esc(ch)}<rt>${zs[i]}</rt></ruby>`:esc(ch)}</button>`:`<span class="spun">${ch==='　'?'&emsp;':esc(ch)}</span>`}).join('');
      const ins=tl?it.stem+'。':`點出有${td}的字。`;
      const say0=tl?it.tsay+'這些有：'+segText+'。':`點出有${tgs}的字。`+segText;
      const cnt=()=>tl?`🔍 還有 ${segLeft} 個答案`:`🔍 還有 ${segLeft} 個字有${td}${segs.length>1?`（第 ${si+1}／${segs.length} 段）`:''}`;

      setPB((ids.indexOf(id)+si/segs.length)/ids.length);autoSay(say0);
      const tlist=$$('.tt',sb);
      tlist.forEach(t=>t.onclick=()=>{if(t.classList.contains('caught'))return;const i=+t.dataset.i,m=it.marks.find(x=>x.i===i);
        if(m){t.classList.add('caught');t.disabled=true;sfx('ok');popEl(t,tl?'答對了！':'有！');S.words[m.c]=1;save();

              let marked,ans;

              const cs2=[...new Set(it.marks.filter(x=>x.req).map(x=>tl?tl[x.i]:x.c))];

        else{failed=true;wrongs++;sfx('bad');t.classList.add('safe');setTimeout(()=>t.classList.remove('safe'),700);toast(tl?'不是這個，再想想。':`這個字沒有${td}，再找找。`);
          if(wrongs>=2){const r=tlist.find(x=>!x.classList.contains('caught')&&sg.req.some(m=>m.i===+x.dataset.i));if(r)r.classList.add('hintg')}}})}

/* ====== S5 對錯甜甜圈：是非題，小甜甜圈滾到「對」或「錯」 ====== */
function gHop(){const n=CNT(POOL.S5.length,5,8),nf=Math.floor(n/2),ids=shuffle(pickN(POOL.S5.filter(i=>!IT[i].ans),nf).concat(pickN(POOL.S5.filter(i=>IT[i].ans),n-nf)));const {sb}=stageShell('S5',n);

      else{failed=true;sfx('bad');b.classList.add('bad');b.disabled=true;toast('不對喔，再想一想。');later(()=>{if(!locked)hf.className='hfrog'},700)}};
    bs.forEach(b=>b.onclick=()=>pick(b));

/* ====== S8 放大鏡抓錯字：改錯字、刪掉多餘的字 ====== */
function gSpy(){const all=POOL.S8,ex=all.filter(i=>IT[i].marks.some(m=>m.extra)),lg=all.filter(i=>/^ty_/.test(i)),sh=all.filter(i=>!ex.includes(i)&&!lg.includes(i));
  const std=S.len==='std';const ids=shuffle(pickN(lg,1).concat(pickN(ex,std?2:1),pickN(sh,std?4:3)));const {sb}=stageShell('S8',ids.length);
  function round(id,done){const it=IT[id];const s=it.s,zs=zyArr(s);let failed=false,left=it.marks.length,cur=null;const fixed={};
    /* 一次只看一小段（一個逗號或句號以內），字不會太多 */
    const segs=[];{let a=0;for(let i=0;i<s.length;i++){if('，。！？'.includes(s[i])||i===s.length-1){const ms=it.marks.filter(m=>m.i>=a&&m.i<=i);if(ms.length)segs.push({a,b:i+1,ms});a=i+1}}}
    let si=0;const isEx=it.marks.some(m=>m.extra);
    function seg(){const sg=segs[si];const lastSeg=si===segs.length-1;let segLeft=sg.ms.length;
      window.TGI={id,marks:sg.ms.map(m=>m.i),extra:sg.ms.filter(m=>m.extra).map(m=>m.i)};
      const tiles=[...s.slice(sg.a,sg.b)].map((ch,k)=>{const i=sg.a+k;return isCJK(ch)?`<button class="sch" data-i="${i}">${zs[i]?`<ruby>${esc(ch)}<rt>${zs[i]}</rt></ruby>`:esc(ch)}</button>`:`<span class="spun">${esc(ch)}</span>`}).join('');
      const ins=isEx?'找出多餘的字，點它。':(segs.length>1?`第 ${si+1} 段：找出錯字，點它。`:'找出錯字，點它。');
      const segSay=s.slice(sg.a,sg.b);
      sb.innerHTML=progBar()+inst('🐻',ins,ins)+`<div class="radar"><div class="rcount" id="rc">🐻 還有 ${left} 個${isEx?'多餘的字':'錯字'}${segs.length>1?`（第 ${si+1}／${segs.length} 段）`:''}</div><div class="rtxt big" id="rt">${tiles}</div></div><div class="fixbox" id="fx"><div class="hint lt" style="text-align:center">${isEx?'點出多餘的字':'點出錯字'} ${spk(segSay)}</div></div>`;
      setPB((ids.indexOf(id)+si/segs.length)/ids.length);autoSay(ins+segSay);
      const tilesEl=$$('.sch',sb);
      function oneDone(t,m){left--;segLeft--;$('#rc',sb).textContent=left?`🐻 還有 ${left} 個${isEx?'多餘的字':'錯字'}`:'🎉 都找到了！';cur=null;
        if(segLeft>0){$('#fx',sb).innerHTML='<div class="hint lt" style="text-align:center">好棒！這一段還有，再找找看</div>'}
        else if(!lastSeg){$('#fx',sb).innerHTML='<div class="hint lt" style="text-align:center">這一段找完了！看下一段 ➜</div>';say('這一段找完了。看下一段。');later(()=>{si++;seg()},1500)}
        else{$('#fx',sb).innerHTML='';record(id,!failed,t);
          if(isEx){const mm=it.marks[0];const s2=s.slice(0,mm.i)+s.slice(mm.i+1);
            qDone({first:!failed,html:WHYBOX(T(s2),`多出來的字是「${mm.c}」，把它拿掉，句子就通順了。`),say:'多出來的字是，'+mm.c+'。'+s2,onDone:done,delay:700})}
          else{const txt=it.marks.map(x=>`「${x.c}」→「${x.r}」`).join('　');
            const fixedS=segs.map(g=>[...s.slice(g.a,g.b)].map((c,k)=>fixed[g.a+k]!=null?`⟦${fixed[g.a+k]}⟧`:c).join('')).join('');
            qDone({first:!failed,html:WHYBOX(T(fixedS),'錯字改正：'+txt),say:'改正了，'+it.marks.map(x=>x.r).join('，'),onDone:done,delay:700})}}}
      function showFix(i){const m=it.marks.find(x=>x.i===i);cur=m;tilesEl.forEach(t=>t.classList.toggle('sus',+t.dataset.i===i));
        $('#fx',sb).innerHTML=`<div class="fxh">這是錯字。選出正確的字。 ${spk('這是錯字。選出正確的字。')}</div><div class="chipr">${shuffle(m.opts).map(o=>`<button class="chipb" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
        autoSay('這是錯字。選出正確的字。');
        $$('#fx .chipb',sb).forEach(b=>b.onclick=()=>{if(b.disabled)return;if(b.dataset.o===m.r){sfx('ok');const t=tilesEl.find(t=>+t.dataset.i===m.i);fixed[m.i]=m.r;t.classList.remove('sus');t.classList.add('caught');t.disabled=true;
            const s2=[...s].map((c,k)=>fixed[k]!=null?fixed[k]:c).join('');const z2=zyArr(s2);t.innerHTML=`<ruby>${esc(m.r)}<rt>${z2[m.i]||''}</rt></ruby>`;popEl(t,'找到了！');
            oneDone(t,m)}
          else{failed=true;b.disabled=true;b.classList.add('bad');sfx('bad');toast('不是這個，再選選看。')}})}
      tilesEl.forEach(t=>t.onclick=()=>{if(t.classList.contains('caught'))return;const i=+t.dataset.i;const m=it.marks.find(x=>x.i===i);
        if(m&&m.extra){sfx('ok');t.classList.add('caught','struck');t.disabled=true;popEl(t,'找到了！');oneDone(t,m)}
        else if(m)showFix(i);
        else{failed=true;sfx('bad');t.classList.add('safe');setTimeout(()=>t.classList.remove('safe'),700);toast('這個字是對的，再找找。')}})}
    seg()}
  runRounds(sb,ids,round)}

/* ====== S7 巧克力轉轉轉：字詞義 ====== */

    else area=`<div class="comets">${q.opts.map((t,i)=>`<button class="pl comet" data-i="${i}" style="--pc:${PC[i%6].split(',')[0]};--pc2:${PC[i%6].split(',')[1]};--dl:${i*.5}s"><span class="ck">${LETTERS[i]}</span><span>${TO(t)}</span></button>`).join('')}</div>`;

'use strict';
/* ====== S9 蛋糕配配看：照例子，把詞語放進空格，組成短語或句子 ====== */
function gPair(){const all=POOL.S9.filter(i=>IT[i].k==='pair');
  const ids=pickN(all,CNT(all.length,5,7));const {sb}=stageShell('S9',ids.length);
  function round(id,done){const it=IT[id];let failed=false;const filled=it.given.slice();window.TGI={id,bank:it.bank,ans:it.ans};

/* ====== S10 點心圖書館：閱讀測驗 ====== */
function noteMark(i){return String.fromCharCode(0xE000+i)}
function bookHTML(b){const mk=['①','②','③','④','⑤'];
  const para=s=>{let t=s;mk.forEach((m,i)=>{t=t.split(m).join(noteMark(i))});let h=T(t);h=h.replace(/[\ue000-\ue004]/g,c=>`<button class="nt" data-n="${c.charCodeAt(0)-0xE000}" aria-label="注釋">${mk[c.charCodeAt(0)-0xE000]}</button>`);const say=t.replace(/[-]/g,'').replace(/[\n　]+/g,'，');return`<p>${h}<button class="ibtn sp pbtn" data-say="${esc(say)}" aria-label="讀這一段">🔊</button></p>`};
  const title=T(b.title)+(b.titleNote?`<button class="nt" data-n="0">①</button>`:'');
  return `<h3 class="btitle">${title}</h3>${b.paras.map(para).join('')}<div class="notes hint lt2">${b.notes.map((n,i)=>`<div>${mk[i]} ${T(n)}</div>`).join('')}</div>`}
function bookSay(b){return [b.title].concat(b.paras).join('。').replace(/[①②③④⑤]/g,'').replace(/[　]+/g,'，')}
function gLib(){S.books=S.books||{};const {sb}=stageShell('S10',4);
  const rec=D.books.find(b=>!S.books[b.id])||D.books[0];
  sb.innerHTML=inst('📖','選一篇文章來讀。','選一篇文章來讀。讀完，再回答問題。')+`<div class="shelf">${D.books.map(b=>`<button class="bookc ${b.id===rec.id?'rec':''}" data-b="${b.id}"><span class="be">${b.e}</span><span class="bt2">${T(b.title)}</span><span class="bs">${S.books[b.id]?'✅ 讀過了':(b.id===rec.id?'⭐ 推薦':'')}</span></button>`).join('')}</div>`;
  $$('.bookc',sb).forEach(c=>c.onclick=()=>{sfx('pop');read(bookOf(c.dataset.b))});
  function read(b){const qids=D.items.filter(i=>i.bk===b.id&&(!i.lesson||S.lesq)).map(i=>i.id);window.CURID=qids[0];window.TGI={book:b.id,qids};
    sb.innerHTML=`<div class="bookv" id="bv">${bookHTML(b)}</div><div class="notebub" id="nbb" hidden></div><div class="dockbar"><button class="btn b" id="lis">🔊 聽故事</button><button class="btn g big" id="go2">▶ 讀完了，開始答題</button></div>`;
    const bub=$('#nbb',sb);$$('.nt',sb).forEach(n=>n.onclick=()=>{const i=+n.dataset.n,t=b.notes[i];bub.hidden=false;bub.innerHTML=`<b>${['①','②','③','④','⑤'][i]}</b> ${T(t)} ${spk(t)}`;sfx('pop')});
    $('#lis',sb).onclick=()=>say(bookSay(b),null,true);if(S.auto&&S.tts)later(()=>say('讀一讀這篇文章。想聽的話，按聽故事。讀完了，按綠色的按鈕。'),400);
    $('#go2',sb).onclick=()=>{stopSay();ask(b,qids)}}
  function ask(b,qids){let i=0;const next=()=>{if(i>=qids.length){S.books[b.id]=1;save();endStage({extra:`<div class="row" style="justify-content:center"><button class="btn b" id="lib2">📖 換一本書</button></div>`});later(()=>{const x=$('#lib2');if(x)x.onclick=gLib},60);return}
      setProg(i,qids.length);const q=mcq(qids[i]);q.ctx=null;q.say=(q.say||q.stem.replace(/\n/g,'，'))+optSay(q);window.CURID=qids[i];
      sb.innerHTML=progBar()+`<div class="row" style="justify-content:flex-end"><button class="btn w sm" id="again">📖 再看一次故事</button></div><div id="qh"></div>`;setPB(i/qids.length);
      $('#again',sb).onclick=()=>modal(`<div class="bookv small">${bookHTML(b)}</div><div class="row"><button class="btn g" id="cl">關起來</button></div>`,{silent:1}).el.querySelector('#cl').onclick=function(){this.closest('.modalbg').remove()};
      renderMCQ($('#qh',sb),q,{retry:true,onDone:()=>{i++;next()}})};next()}}

/* ====== 排序造句共用：S6 餅乾排排隊 ====== */
const CODES=['①','②','③','④','⑤','⑥'];
function orderRound(sb,ids,id,it,done){const ch=it.chunks;let placed=[],failed=false;window.TGI={id,ord:it.ord};
  /* 每次把詞打亂擺放，而且順序一定和答案不同；格子上的①②③也照擺放位置編 */
  let disp=ch.map((c,i)=>i);for(let t=0;t<40;t++){disp=shuffle(ch.map((c,i)=>i));if(ch.length<2||!disp.every((x,k)=>x===it.ord[k]))if(ch.length<3||!disp.every((x,k)=>x===k))break}
  const pos=i=>disp.indexOf(i);
  const em='🍡',cn='糖球',first='第一個';
  const instT='點下面的詞，排成一句話。',instS='先點第一個詞，再點下一個詞，排成一句話。';

    const draw=()=>{sb.innerHTML=progBar()+inst(em,instT,instS)+(it.intro?`<div class="introq">${T(it.intro)} ${spk(it.intro)}</div>`:'')+(it.prefix?`<div class="target">${T(it.prefix)}（　　　）${it.end||'。'}</div>`:'')
      +`<div class="station lily"><div class="slotsr">${ch.map((c,i)=>`<button class="slotb ${placed[i]!=null?'full':''}" data-p="${i}"><small>第 ${i+1} 個</small>${placed[i]!=null?`<span>${T(ch[placed[i]])}</span>`:'<span class="q">？</span>'}</button>`).join('')}</div></div><div class="hint lt" style="text-align:center">點一個詞，它就放到下一個位置。點上面的詞，可以拿回來。</div><div class="sbricks tiles">${disp.map((i,k)=>`<button class="sbrick tile" data-i="${i}" ${placed.includes(i)?'disabled':''} style="--c:${GCOL[k%6]}"><b class="cd">${CODES[k]}</b>${T(ch[i])}</button>`).join('')}</div>`;
      setPB(ids.indexOf(id)/ids.length);
      $$('.tile',sb).forEach(t=>t.onclick=()=>{if(t.disabled)return;placed.push(+t.dataset.i);sfx('pop');if(placed.length===ch.length)check();else draw()});
      $$('.slotb',sb).forEach(sl=>sl.onclick=()=>{const p=+sl.dataset.p;if(placed[p]==null)return;placed=placed.slice(0,p);sfx('tick');draw()})};
    const check=()=>{draw();const ok=placed.every((x,i)=>x===it.ord[i]);
      if(ok){sfx('win');record(id,!failed,sb);say(it.std.replace(/[「」]/g,''));qDone({first:!failed,html:WHYBOX(T(it.std)+`<div class="hint">答案：${it.ord.map(i=>CODES[pos(i)]).join('')}</div>`,it.why),say:it.std.replace(/[「」]/g,''),onDone:done,delay:900})}
      else{failed=true;sfx('bad');$$('.slotb',sb).forEach((s,i)=>s.classList.add(placed[i]===it.ord[i]?'good':'wrong'));toast('順序不對，再試試看。');later(()=>{placed=[];draw()},1100)}};
    draw();autoSay((it.intro?it.intro.replace(/[。？！\s]+$/,'')+'。':'')+'點下面的詞，一個一個排成句子。點一個詞，它會放到下一個位置。點上面的詞，可以拿回來。可以排的有：'+disp.map(i=>ch[i]).join('；')+'。')}
  if(it.pre){const q=MQ(it.pre.q,it.pre.opts,it.pre.ans,it.pre.why,{pO:0});q.id=id;q.sk='sent';q.say=it.pre.q+optSay(q);
    sb.innerHTML=progBar()+'<div id="qh"></div>';setPB(ids.indexOf(id)/ids.length);
    renderMCQ($('#qh',sb),q,{retry:true,norec:true,onAnswer:first=>{if(!first)failed=true},onDone:()=>orderStep()})}
  else orderStep()}

        qDone({first:!failed,html:WHYBOX(T(it.std),`這是老師的示範句。你也可以用「${it.w}」想一個自己的句子，說給大家聽！`),say:it.std,onDone:done,delay:1000,force:false})}
      else{failed=true;sfx('bad');draw();let k=0;while(k<placed.length&&placed[k].t===it.toks[k])k++;const el=$$('.placed',sb)[k];if(el)el.classList.add('wrong');toast(`第 ${k+1} 塊不對，再試試。`);later(()=>{placed=placed.slice(0,k);draw()},1200)}};
    draw();autoSay(`用${it.w}造句。照順序點糖球。可以用的糖球有：${bank.map(b=>b.t).join('，')}。`)}
  const PNM={'，':'逗號','。':'句號','？':'問號','、':'頓號','！':'驚嘆號'};

    if(left>24){const r=sc.getBoundingClientRect();const dk=sc.querySelector('.dockbar');const dh=dk?dk.offsetHeight:0;cue.style.bottom=Math.max(8,innerHeight-r.bottom+dh+8)+'px';cue.classList.add('show')}else cue.classList.remove('show')}
  cue.onclick=()=>{if(sc)sc.scrollBy({top:Math.max(160,sc.clientHeight*.7),behavior:'smooth'})};
  document.addEventListener('scroll',upd,true);window.addEventListener('resize',upd);setInterval(upd,350)})();
titleScreen();


</script></body></html>
