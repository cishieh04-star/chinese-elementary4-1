<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>星光舞台秀・國語四年級第三課〈我的籃球夢〉（第 21 回）</title>
<style>:root{
  --sky1:#7fd6ff;--sky2:#c9f0ff;--grass:#7ddc6a;--grass2:#4fbf4a;--sun:#ffd84d;--sun2:#ffb703;
  --coral:#ff6b6b;--coral2:#e04848;--blue:#3b9cff;--blue2:#1f78e0;--green:#3ecf72;--green2:#22a653;
  --purple:#9b6bff;--purple2:#7647e0;--ink:#2b3a55;--ink2:#5a6b8c;--card:#ffffff;--line:#d8e6f7;
  --bg:#e8f6ff;--shadow:0 .35rem 0 rgba(30,60,110,.18);--fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(clamp(14px,calc(.6vw + 1.2vh + 6px),32px)*var(--fs));height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;font-weight:700;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:.22rem solid var(--purple);outline-offset:.15rem}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:scr .25s ease}
@keyframes scr{from{opacity:0;transform:translateY(.6rem)}to{opacity:1;transform:none}}
ruby{ruby-position:over}
rt{font-size:.46em;font-weight:700;color:#d0301f;letter-spacing:0;user-select:none}
.zy-off rt{display:none}
.zy-on ruby{ruby-align:center}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:3rem;padding:.55rem 1.3rem;border-radius:1.1rem;
  background:var(--sun);color:#5a3b00;font-size:1.15rem;font-weight:900;box-shadow:0 .3rem 0 var(--sun2);position:relative;top:0;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(.28rem);box-shadow:0 .02rem 0 var(--sun2)}
.btn.g{background:var(--green);color:#fff;box-shadow:0 .3rem 0 var(--green2)}
.btn.g:active:not(:disabled){box-shadow:0 .02rem 0 var(--green2)}
.btn.b{background:var(--blue);color:#fff;box-shadow:0 .3rem 0 var(--blue2)}
.btn.b:active:not(:disabled){box-shadow:0 .02rem 0 var(--blue2)}
.btn.r{background:var(--coral);color:#fff;box-shadow:0 .3rem 0 var(--coral2)}
.btn.r:active:not(:disabled){box-shadow:0 .02rem 0 var(--coral2)}
.btn.p{background:var(--purple);color:#fff;box-shadow:0 .3rem 0 var(--purple2)}
.btn.w{background:#fff;color:var(--ink);box-shadow:0 .3rem 0 #b9cde6}
.btn.w:active:not(:disabled){box-shadow:0 .02rem 0 #b9cde6}
.btn.big{font-size:1.3rem;min-height:3.6rem;padding:.6rem 1.3rem;border-radius:1.3rem}
.btn.sm{min-height:2.4rem;padding:.3rem .8rem;font-size:.95rem;border-radius:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ibtn{width:2.8rem;height:2.8rem;border-radius:50%;background:#fff;box-shadow:0 .22rem 0 #b9cde6;font-size:1.3rem;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ibtn:active{transform:translateY(.2rem);box-shadow:none}
.ibtn.on{background:var(--sun);box-shadow:0 .22rem 0 var(--sun2)}
/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:.5rem;padding:.55rem .7rem;flex:none;flex-wrap:wrap;background:linear-gradient(#fff,#eaf6ff);border-bottom:.2rem solid var(--line);z-index:5}
.hud .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .75rem;border-radius:999px;background:#fff;border:.15rem solid var(--line);font-size:1rem;font-weight:900;white-space:nowrap}
.pill.lv{background:var(--purple);color:#fff;border-color:var(--purple2)}
.pill.coin{background:#fff6cc;border-color:#ffe07a}
.pill.net{background:#dcfbe6;border-color:#9fe6b6}
.xpbar{width:5.5rem;height:.7rem;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden;display:inline-block}
.xpbar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}
.hearts{display:inline-flex;gap:.15rem;font-size:1.3rem}
.hearts .lost{filter:grayscale(1);opacity:.35}
.title-h{font-size:1.25rem;font-weight:900;display:flex;align-items:center;gap:.4rem}
/* ---------- title screen ---------- */
.title-scr{background:linear-gradient(#7fd6ff 0%,#c9f0ff 55%,#bff3c0 55%,#7ddc6a 100%);align-items:center;text-align:center;padding:1rem;overflow:auto}
.title-scr>div{position:relative;z-index:1}
.title-scr .logo{font-size:min(3.4rem,11vw);font-weight:900;color:#fff;text-shadow:0 .25rem 0 var(--blue2),0 .5rem 0 rgba(0,0,0,.12);line-height:1.15;letter-spacing:.05em}
.title-scr .sub{display:inline-block;margin:.4rem 0 .8rem;padding:.3rem 1rem;background:var(--sun);border-radius:99px;color:#5a3b00;font-weight:900;box-shadow:0 .2rem 0 var(--sun2)}
.title-card{background:#fff;border-radius:1.6rem;padding:1rem 1.2rem;box-shadow:var(--shadow);max-width:34rem;width:100%}
.avatars{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:.5rem 0}
.avatars button{width:3.1rem;height:3.1rem;border-radius:1rem;font-size:1.8rem;background:#f0f7ff;border:.2rem solid transparent}
.avatars button.sel{border-color:var(--purple);background:#efe6ff;transform:scale(1.1)}
.nameinp{width:100%;font:inherit;font-size:1.3rem;padding:.6rem 1rem;border-radius:1rem;border:.2rem solid var(--line);text-align:center;font-weight:800;color:var(--ink);background:#fff;user-select:text}
.nameinp:focus{outline:none;border-color:var(--blue)}
.cloud{pointer-events:none;z-index:0;position:absolute;font-size:3rem;opacity:.9;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
/* ---------- hub map ---------- */
.hub{background:linear-gradient(#8fdcff 0%,#d9f4ff 38%,#c4f2b8 38%,#8be07a 100%)}
.mapwrap{flex:1;position:relative;overflow:auto;min-height:0}
.map{position:relative;width:100%;height:100%;min-height:56rem;min-width:min(100%,60rem);margin:0 auto}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.deco{position:absolute;font-size:2.4rem;pointer-events:none;opacity:.95}
.node{background:none;border:0;padding:0;font:inherit;color:inherit;position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.15rem;width:6.9rem;z-index:2}
.node .orb{width:4.6rem;height:4.6rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;
  background:radial-gradient(circle at 30% 25%,#fff8c8,var(--sun) 55%,var(--sun2));border:.28rem solid #fff;box-shadow:0 .4rem 0 rgba(30,60,110,.25);transition:transform .15s}
.node:hover .orb{transform:scale(1.08)}
.node:active .orb{transform:scale(.95)}
.node.cur .orb{animation:bob 1.1s ease-in-out infinite;box-shadow:0 0 0 .35rem rgba(255,255,255,.7),0 .4rem 0 rgba(30,60,110,.25)}
.node.lock .orb{background:radial-gradient(circle at 30% 25%,#eee,#bbb 60%,#999);filter:grayscale(.4)}
.node.boss .orb{width:5.6rem;height:5.6rem;font-size:3rem;background:radial-gradient(circle at 30% 25%,#ffd0d0,var(--coral) 60%,var(--coral2))}
.node .nm{background:#fff;border-radius:.8rem;padding:.1rem .6rem;font-size:.95rem;font-weight:900;box-shadow:0 .15rem 0 rgba(30,60,110,.18);text-align:center;line-height:1.25}
.node .sk{font-size:.72rem;color:var(--ink2);font-weight:800;text-align:center;line-height:1.1;background:rgba(255,255,255,.8);border-radius:.5rem;padding:0 .3rem}
.stars{font-size:1.05rem;letter-spacing:.05rem;filter:drop-shadow(0 .08rem 0 rgba(0,0,0,.2))}
.stars .off{filter:grayscale(1);opacity:.35}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.45rem)}}
.netty{position:absolute;z-index:3;display:flex;align-items:flex-end;gap:.4rem;pointer-events:none}
.netty .bubble{background:#fff;border-radius:1rem;padding:.45rem .8rem;font-size:.95rem;max-width:15rem;box-shadow:var(--shadow);position:relative;pointer-events:auto}
.netty svg{width:4.6rem;height:4.6rem;animation:bob 2.2s ease-in-out infinite;flex:none}
.dock{display:flex;gap:.5rem;padding:.55rem .6rem;justify-content:center;flex-wrap:wrap;flex:none;background:linear-gradient(#fff,#eaf6ff);border-top:.2rem solid var(--line)}
.dock .btn{flex:1;max-width:10rem;min-width:5.5rem;padding:.4rem .5rem;font-size:1rem}
/* ---------- generic page ---------- */
.page{flex:1;overflow:auto;padding:.9rem;min-height:0}
.wrap{max-width:60rem;margin:0 auto;width:100%}
.card{background:var(--card);border-radius:1.2rem;padding:.9rem 1rem;box-shadow:var(--shadow);margin-bottom:.8rem}
.card h3{margin:.1rem 0 .4rem;font-size:1.15rem}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.7rem}
.tab{padding:.45rem 1rem;border-radius:99px;background:#fff;border:.15rem solid var(--line);font-weight:900;font-size:1rem}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue2)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.sw{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.55rem .2rem;border-bottom:.1rem dashed var(--line)}
.sw:last-child{border:0}
.sw small{display:block;font-size:.8rem;color:var(--ink2);font-weight:700}
.toggle{width:3.6rem;height:2rem;border-radius:99px;background:#c9d6e8;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.6rem;height:1.6rem;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 .1rem .2rem rgba(0,0,0,.25)}
.toggle.on{background:var(--green)}
.toggle.on::after{left:1.8rem}
.seg{display:inline-flex;border-radius:.9rem;overflow:hidden;border:.15rem solid var(--line)}
.seg button{padding:.35rem .8rem;background:#fff;font-weight:900}
.seg button.on{background:var(--blue);color:#fff}
.hint{font-size:.9rem;color:var(--ink2);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{padding:.25rem .7rem;border-radius:99px;background:#eef5ff;border:.12rem solid var(--line);font-size:.95rem;font-weight:800}
/* ---------- stage screen ---------- */
.stage{background:linear-gradient(#e9f7ff,#f6fff0)}
.stagebody{flex:1;position:relative;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:.7rem .8rem .9rem;gap:.6rem;align-items:stretch}
.inst{background:#fff;border-radius:1rem;padding:.4rem .8rem;font-size:1rem;box-shadow:0 .2rem 0 rgba(30,60,110,.12);display:flex;align-items:center;gap:.5rem;flex:none}
.inst .em{font-size:1.6rem}
.prog{height:.8rem;background:#d6e6f7;border-radius:99px;overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#9be564);border-radius:99px;transition:width .4s}
/* MCQ */
.qcard{background:#fff;border-radius:1.3rem;padding:1rem 1.1rem;box-shadow:var(--shadow);font-size:1.35rem;line-height:2.3;display:flex;gap:.6rem;align-items:flex-start}
.qcard .qt{flex:1;min-width:0;overflow-wrap:anywhere}
.qcard .sp{flex:none}
.opts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.7rem}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{background:#fff;border-radius:1.1rem;padding:.7rem .9rem;text-align:left;font-size:1.2rem;line-height:1.9;box-shadow:0 .3rem 0 #b9cde6;border:.18rem solid transparent;display:flex;gap:.6rem;align-items:center;min-height:3.4rem;transition:transform .08s}
.opt:active:not(:disabled){transform:translateY(.25rem);box-shadow:0 .03rem 0 #b9cde6}
.opt .k{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:900}
.opt.ok{background:#d9f9e3;border-color:var(--green);box-shadow:0 .3rem 0 var(--green2)}
.opt.ok .k{background:var(--green)}
.opt.bad{background:#ffe0e0;border-color:var(--coral);box-shadow:0 .3rem 0 var(--coral2);animation:shake .35s}
.opt.bad .k{background:var(--coral)}
.opt.gone{opacity:.25;pointer-events:none}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-.4rem)}75%{transform:translateX(.4rem)}}
@media(max-width:34rem){.opts{grid-template-columns:minmax(0,1fr)}}
.skilltag{display:inline-block;font-size:.8rem;background:#efe6ff;color:var(--purple2);border-radius:99px;padding:.05rem .6rem;font-weight:900;margin-right:.4rem;vertical-align:middle}
.mark{background:#fff0a8;border-radius:.4rem;padding:0 .15rem}
.blank{display:inline-block;min-width:2.4em;border-bottom:.18rem solid var(--ink);text-align:center;color:var(--purple2)}
/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(20,40,80,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:46rem;background:#fff;border-radius:1.6rem 1.6rem 0 0;padding:1rem 1.2rem 1.1rem;box-shadow:0 -.4rem 1.2rem rgba(0,0,0,.2);animation:up .28s cubic-bezier(.2,1.3,.5,1);max-height:80%;overflow:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .hd{display:flex;align-items:center;gap:.6rem;font-size:1.5rem;font-weight:900;margin-bottom:.3rem}
.sheet.ok .hd{color:var(--green2)}
.sheet.bad .hd{color:var(--coral2)}
.sheet .body{font-size:1.15rem;line-height:2.2;margin:.2rem 0 .7rem}
.sheet .ans{background:#f0f7ff;border-radius:.9rem;padding:.4rem .8rem;margin:.3rem 0;font-size:1.1rem;line-height:2.1}
.modalbg{position:fixed;inset:0;background:rgba(20,40,80,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:1rem;animation:fade .2s}
.modal{background:#fff;border-radius:1.5rem;padding:1.1rem 1.3rem;max-width:30rem;width:100%;box-shadow:var(--shadow);text-align:center;max-height:92%;overflow:auto}
.modal h2{margin:.2rem 0 .4rem;font-size:1.5rem}
.modal .row{justify-content:center;margin-top:.8rem}
.toast{position:fixed;left:50%;top:5rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.5rem 1.1rem;border-radius:99px;font-size:1.05rem;z-index:70;animation:toast 2.2s forwards;pointer-events:none;text-align:center;max-width:90vw}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-.8rem)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.pop{position:fixed;z-index:65;pointer-events:none;font-weight:900;font-size:1.6rem;color:var(--sun2);text-shadow:0 .1rem 0 #fff,0 0 .3rem #fff;animation:popup .9s forwards}
@keyframes popup{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-3rem) scale(1.3)}}
.conf{position:fixed;top:-2rem;font-size:1.8rem;z-index:80;pointer-events:none;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
/* result */
.result{align-items:center;justify-content:center;text-align:center;padding:1rem;background:linear-gradient(#fff7d1,#e6f7ff);overflow:auto}
.result>.big{font-size:3.2rem;margin:.2rem 0}
.result .stars{font-size:3rem}
.result .rows{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin:.6rem 0}
.result .rows .pill{font-size:1.15rem;padding:.4rem 1rem}
/* ---------- Boss ---------- */
.bosshead{display:flex;align-items:center;gap:.8rem;background:linear-gradient(#ffd6d6,#ffeaea);border-radius:1.2rem;padding:.5rem .9rem;box-shadow:var(--shadow);flex:none}
.bosshead .bossface{font-size:3.2rem}
.powers{display:flex;gap:.5rem;flex:none}
/* ---------- class mode ---------- */
.race{background:linear-gradient(#bfe9ff,#e5f8ff);border-radius:1.2rem;padding:.6rem .8rem;box-shadow:var(--shadow);flex:none}
.rtrack{display:flex;align-items:center;gap:.6rem;margin:.3rem 0}
.rtrack .tn{width:6rem;font-size:1rem;font-weight:900;flex:none;text-align:right;color:var(--ink)}
.rtrack .lane2{flex:1;height:2.4rem;background:rgba(255,255,255,.7);border-radius:99px;position:relative}
.rtrack .bal{position:absolute;top:-.5rem;font-size:2.4rem;transform:translateX(-50%);transition:left .8s cubic-bezier(.3,1.4,.5,1)}
.tpill{padding:.35rem .9rem;border-radius:99px;color:#fff;font-weight:900;font-size:1.2rem;display:inline-block}
.timerbar{height:.9rem;border-radius:99px;background:#d6e6f7;overflow:hidden;flex:none}
.timerbar i{display:block;height:100%;background:var(--green);transition:background .3s}
.teamcfg{display:flex;gap:.5rem;flex-wrap:wrap}
.teamcfg input{font:inherit;font-weight:800;padding:.4rem .7rem;border-radius:.8rem;border:.15rem solid var(--line);width:9rem;user-select:text}
/* ---------- misc ---------- */
.village{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.6rem,1fr));gap:.5rem;background:linear-gradient(#bfe9ff,#bff3b0);border-radius:1.2rem;padding:.8rem;min-height:12rem}
.hut{font-size:2.4rem;text-align:center;line-height:1;position:relative;animation:scr .4s}
.hut::after{content:"";position:absolute;left:50%;top:-.2rem;transform:translateX(-50%);font-size:1.5rem;opacity:.85}
.cert{width:100%;max-width:40rem;border-radius:1rem;box-shadow:var(--shadow);display:block;margin:0 auto}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.6rem}
.badge{background:#fff;border-radius:1rem;padding:.6rem .4rem;text-align:center;box-shadow:0 .2rem 0 #cfdcee;font-size:.85rem;line-height:1.4}
.badge .e{font-size:2.3rem;display:block}
.badge.no{opacity:.4;filter:grayscale(1)}
.bar2{display:flex;align-items:center;gap:.5rem;margin:.3rem 0;font-size:.95rem}
.bar2 .nm{width:7.5rem;flex:none}
.bar2 .tr{flex:1;height:1.2rem;background:#e3eefb;border-radius:99px;overflow:hidden}
.bar2 .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:99px}
.bar2 .v{width:4.5rem;text-align:right;flex:none;font-size:.85rem;color:var(--ink2)}
.wb{background:#fff;border-radius:1rem;padding:.7rem .9rem;box-shadow:0 .2rem 0 #cfdcee;margin-bottom:.6rem;font-size:1.05rem;line-height:2.1}
.idcard{background:linear-gradient(#fff,#fff7dc);border:.18rem solid #ffe07a;border-radius:1rem;padding:.6rem .8rem;line-height:1.9}
.idcard b{font-size:1.4rem;color:var(--coral2)}
.idcard.no{opacity:.45;filter:grayscale(1);border-style:dashed}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.reduce *{animation-duration:.01s!important;transition-duration:.01s!important}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
@media print{body{overflow:visible}#app{position:static}.hud,.dock,.btn,.tabs{display:none}}

#zyBtn{position:fixed;top:.5rem;right:.6rem;z-index:90;min-width:3.5rem;height:3rem;border-radius:1rem;background:#fff;border:.15rem solid var(--line);box-shadow:0 .25rem 0 #b9cde6;font-weight:900;font-size:.9rem;line-height:1.1;padding:.1rem .5rem;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center}
#zyBtn small{font-size:.62rem;letter-spacing:.02rem;color:#d0301f}
#zyBtn.on{background:var(--sun);color:#5a3b00;box-shadow:0 .25rem 0 var(--sun2);border-color:#fff}
#zyBtn:active{transform:translateY(.2rem);box-shadow:none}
.hud,.title-scr{padding-right:4.8rem}
.zy-on .qcard,.zy-on .opt,.zy-on .speech,.zy-on .sheet .body,.zy-on .sheet .ans,.zy-on .inst,.zy-on .sense,.zy-on .brick,.zy-on .ordi,.zy-on .wb,.zy-on .enemy .say,.zy-on .runq,.zy-on .gate .g,.zy-on .sorti,.zy-on .cardc,.zy-on .wtile,.zy-on .idcard,.zy-on .hint{line-height:2.7}
.zy-on .chtile{line-height:2.4;min-width:2.8rem}
.zy-on .pchar,.zy-on .slot{line-height:2.2}
.zy-on .node .nm,.zy-on .node .sk{line-height:2}
.brick .mark{color:#2b3a55}

#go{padding:.7rem .5rem;white-space:nowrap}

.inst>span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
.inst>span:last-child,.opt>span:last-child,.ordi>span:last-child,.speech>div>div{min-width:0}

.zy-on .gate .g{font-size:1rem;line-height:2.5;padding:.3rem 0}.zy-on .gate .g rt{font-size:.4em}

.opt,.sense,.cardc,.ordi,.brick{overflow-wrap:anywhere;max-width:100%}

.btn{white-space:nowrap}.lanebtns .btn{white-space:normal}

.wtile.zt{font-size:1.1rem}
.wtile.sel{outline:3px solid #ffb300;background:#fff8e1}
.wtile.popped.zt{opacity:.5}

<script>
const DATA={"items": [{"id": "z5_2", "sec": "一", "no": "2", "k": "zy", "st": ["S1"], "sk": "zy", "s": "學校的美術⟪社⟫學生在比賽中得到⟪優⟫異的成績。", "src": "一.2"}, {"id": "z5_3", "sec": "一", "no": "3", "k": "zy", "st": ["S1"], "sk": "zy", "s": "魔術師只花了幾⟪秒⟫鐘就⟪巧⟫妙的把絲巾變成了鴿子，臺下瞬間響起此起⟪彼⟫落的掌聲。", "src": "一.3"}, {"id": "z5_5", "sec": "一", "no": "5", "k": "zy", "st": ["S1"], "sk": "zy", "s": "自從他參加烘焙⟪社⟫以後，烹飪技⟪巧⟫越來越純⟪熟⟫。", "src": "一.5"}, {"id": "z5_6", "sec": "一", "no": "6", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪投⟫籃", "src": "一.6"}, {"id": "z5_7", "sec": "一", "no": "7", "k": "zy", "st": ["S1"], "sk": "zy", "s": "分⟪秒⟫必爭", "src": "一.7"}, {"id": "z5_8", "sec": "一", "no": "8", "k": "zy", "st": ["S1"], "sk": "zy", "s": "籃球⟪社⟫", "src": "一.8"}, {"id": "z5_9", "sec": "一", "no": "9", "k": "zy", "st": ["S1"], "sk": "zy", "s": "知己知⟪彼⟫", "src": "一.9"}, {"id": "z5_10", "sec": "一", "no": "10", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪揮⟫手", "src": "一.10"}, {"id": "z5_12", "sec": "一", "no": "12", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪社⟫會", "src": "一.12"}, {"id": "z_a1", "sec": "一", "no": "1", "k": "zy", "st": ["S1"], "sk": "zy", "s": "週六，我⟪與⟫同學受⟪邀⟫參加國樂⟪社⟫的成果發表會。", "src": "一.1（短文分句）"}, {"id": "z_a2", "sec": "一", "no": "1", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪優⟫雅的團長踏上指⟪揮⟫臺不到十⟪秒⟫鐘，", "src": "一.1（短文分句）"}, {"id": "z_a3", "sec": "一", "no": "1", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪喧⟫譁的觀眾立刻安靜下來，紛紛⟪投⟫以敬佩的眼光。", "src": "一.1（短文分句）"}, {"id": "z_a4", "sec": "一", "no": "1", "k": "zy", "st": ["S1"], "sk": "zy", "s": "團員們在這座⟪弧⟫形舞臺上，⟪彼⟫此展現著純⟪熟⟫的技⟪巧⟫，", "src": "一.1（短文分句）"}, {"id": "z_a5", "sec": "一", "no": "1", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪彈⟫奏出悠揚的樂曲，讓人把煩惱都拋到⟪遙⟫遠的九霄雲外了。", "src": "一.1（短文分句）"}, {"id": "z_a6", "sec": "一", "no": "1", "k": "zy", "st": ["S1"], "sk": "zy", "s": "表示未⟪曾⟫欣賞過如此精采的表演。", "src": "一.1（短文分句）"}, {"id": "zp_a", "sec": "一", "no": "1", "k": "zp", "st": ["S2"], "sk": "zy", "s": "週六，我⟪與⟫同學受⟪邀⟫參加國樂⟪社⟫的成果發表會。⟪優⟫雅的團長踏上指⟪揮⟫臺不到十⟪秒⟫鐘，⟪喧⟫譁的觀眾立刻安靜下來，紛紛⟪投⟫以敬佩的眼光。\n團員們在這座⟪弧⟫形舞臺上，⟪彼⟫此展現著純⟪熟⟫的技⟪巧⟫，⟪彈⟫奏出悠揚的樂曲，讓人把煩惱都拋到⟪遙⟫遠的九霄雲外了。\n音樂會結束時，觀眾都報以熱烈的掌聲，表示未⟪曾⟫欣賞過如此精采的表演。", "title": "國樂社的成果發表會", "qs": [], "src": "一.1（短文）"}, {"id": "z_b1", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "這個週末，我⟪與⟫家人⟪邀⟫請⟪彼⟫此的朋友一起登山。", "src": "一.4（短文分句）"}, {"id": "z_b2", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "路途中，我們一邊⟪遙⟫望山下的景色，", "src": "一.4（短文分句）"}, {"id": "z_b3", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "一邊享受遠離城市⟪喧⟫囂的寧靜。", "src": "一.4（短文分句）"}, {"id": "z_b4", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "到達山頂時，爸爸和大家分享了大學參加登山⟪社⟫時，", "src": "一.4（短文分句）"}, {"id": "z_b5", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪曾⟫發生過的趣事，讓我產生未來加入專業登山團隊的夢想。", "src": "一.4（短文分句）"}, {"id": "z_b6", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "直到天色漸漸變暗，我們才依依不捨的⟪揮⟫別⟪優⟫美的山林，", "src": "一.4（短文分句）"}, {"id": "zp_b", "sec": "一", "no": "4", "k": "zp", "st": ["S2"], "sk": "zy", "s": "這個週末，我⟪與⟫家人⟪邀⟫請⟪彼⟫此的朋友一起登山。路途中，我們一邊⟪遙⟫望山下的景色，一邊享受遠離城市⟪喧⟫囂的寧靜。到達山頂時，爸爸和大家分享了大學參加登山⟪社⟫時，⟪曾⟫發生過的趣事，讓我產生未來加入專業登山團隊的夢想。直到天色漸漸變暗，我們才依依不捨的⟪揮⟫別⟪優⟫美的山林，踏上返家的路程。", "title": "週末登山", "qs": [], "src": "一.4（短文）"}, {"id": "z_c1", "sec": "一", "no": "8", "k": "zy", "st": ["S1"], "sk": "zy", "s": "兩隊球員的實力不相上下，皆展現純⟪熟⟫的傳球技⟪巧⟫。", "src": "一.8（短文分句）"}, {"id": "z_c2", "sec": "一", "no": "8", "k": "zy", "st": ["S1"], "sk": "zy", "s": "球迷⟪喧⟫鬧的加油聲此起⟪彼⟫落，球員們⟪揮⟫汗如雨。", "src": "一.8（短文分句）"}, {"id": "z_c3", "sec": "一", "no": "8", "k": "zy", "st": ["S1"], "sk": "zy", "s": "比賽的最後一⟪秒⟫，隊長一個⟪彈⟫跳，", "src": "一.8（短文分句）"}, {"id": "z_c4", "sec": "一", "no": "8", "k": "zy", "st": ["S1"], "sk": "zy", "s": "將手中的球以⟪優⟫美的⟪弧⟫度⟪投⟫入籃框，現場響起如雷的掌聲。", "src": "一.8（短文分句）"}, {"id": "zp_c", "sec": "一", "no": "8", "k": "zp", "st": ["S2"], "sk": "zy", "s": "兩隊球員的實力不相上下，皆展現純⟪熟⟫的傳球技⟪巧⟫。球迷⟪喧⟫鬧的加油聲此起⟪彼⟫落，球員們⟪揮⟫汗如雨。\n比賽的最後一⟪秒⟫，隊長一個⟪彈⟫跳，將手中的球以⟪優⟫美的⟪弧⟫度⟪投⟫入籃框，現場響起如雷的掌聲。", "title": "精采的籃球賽", "qs": [], "src": "一.8（短文）"}, {"id": "z_d1", "sec": "一", "no": "10", "k": "zy", "st": ["S1"], "sk": "zy", "s": "教練鼓勵剛加入籃球⟪社⟫的新成員，平常多練習運球技⟪巧⟫，", "src": "一.10（短文分句）"}, {"id": "z_d2", "sec": "一", "no": "10", "k": "zy", "st": ["S1"], "sk": "zy", "s": "雙手若能控制⟪彈⟫跳的球，就能將它以⟪優⟫美的⟪弧⟫度⟪投⟫進籃框。", "src": "一.10（短文分句）"}, {"id": "z_d3", "sec": "一", "no": "10", "k": "zy", "st": ["S1"], "sk": "zy", "s": "另外還可透過觀看比賽，⟪熟⟫悉籃下三⟪秒⟫等賽事規則。", "src": "一.10（短文分句）"}, {"id": "zp_d", "sec": "一", "no": "10", "k": "zp", "st": ["S2"], "sk": "zy", "s": "教練鼓勵剛加入籃球⟪社⟫的新成員，平常多練習運球技⟪巧⟫，雙手若能控制⟪彈⟫跳的球，就能將它以⟪優⟫美的⟪弧⟫度⟪投⟫進籃框。另外還可透過觀看比賽，⟪熟⟫悉籃下三⟪秒⟫等賽事規則。", "title": "教練的叮嚀", "qs": [], "src": "一.10（短文）"}, {"id": "zk_t21", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "「走，我們一起去報名籃球⟪社⟫。」", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "zk_t22", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "還記得剛開學時，在同學的⟪邀⟫約下，", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "zk_t23", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪與⟫好友一起加入籃球⟪社⟫。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "zpk_t2", "sec": "課本", "no": "課文", "k": "zp", "st": ["S2"], "sk": "zy", "s": "「走，我們一起去報名籃球⟪社⟫。」還記得剛開學時，在同學的⟪邀⟫約下，就算是運動神經不好的我，也決定勇敢踏出第一步，⟪與⟫好友一起加入籃球⟪社⟫。我們都夢想著，有朝一日能成為球場上的風雲人物。", "title": "課文第二段：報名籃球社", "qs": [], "src": "課本（課文〈我的籃球夢〉）"}, {"id": "zk_t31", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "初次站在球場上的我，覺得籃球架像一座⟪遙⟫不可及的高山，", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "zk_t32", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "此外，我也不知道要怎麼做才能將球⟪投⟫進。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "zk_t33", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "學長都為我打氣說：「⟪熟⟫能生⟪巧⟫，只要你努力多練習，", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "zpk_t3", "sec": "課本", "no": "課文", "k": "zp", "st": ["S2"], "sk": "zy", "s": "初次站在球場上的我，覺得籃球架像一座⟪遙⟫不可及的高山，一看就讓人覺得害怕。此外，我也不知道要怎麼做才能將球⟪投⟫進。學長都為我打氣說：「⟪熟⟫能生⟪巧⟫，只要你努力多練習，就一定會進步。」", "title": "課文第三段：站上球場", "qs": [], "src": "課本（課文〈我的籃球夢〉）"}, {"id": "zk_t41", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "好幾次還反⟪彈⟫飛撞我的下巴。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "zk_t42", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "但是為了實現夢想，我不⟪曾⟫放棄，總是最早到球場練習。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "zk_t43", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "漸漸的，球終於接受我雙手的「指⟪揮⟫」，跳出迷人的舞姿。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "zk_t44", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "我享受著運動帶來的喜悅，每當⟪投⟫球進籃時，", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "zpk_t4", "sec": "課本", "no": "課文", "k": "zp", "st": ["S2"], "sk": "zy", "s": "隨著教練的口令，我們開始學運球。奇怪的是，球總是不好好的待在我的手下，好幾次還反⟪彈⟫飛撞我的下巴。但是為了實現夢想，我不⟪曾⟫放棄，總是最早到球場練習。漸漸的，球終於接受我雙手的「指⟪揮⟫」，跳出迷人的舞姿。我享受著運動帶來的喜悅，每當⟪投⟫球進籃時，場邊的歡呼都讓我興奮不已。", "title": "課文第四段：學運球", "qs": [], "src": "課本（課文〈我的籃球夢〉）"}, {"id": "zk_t51", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "此時，熱鬧的加油聲此起⟪彼⟫落，球場上，", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "zk_t52", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "雙方實力平分秋色，在比賽結束前五⟪秒⟫，", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "zpk_t5", "sec": "課本", "no": "課文", "k": "zp", "st": ["S2"], "sk": "zy", "s": "「加油！加油！」此時，熱鬧的加油聲此起⟪彼⟫落，球場上，每個人都努力展現出平日練習的成果。雙方實力平分秋色，在比賽結束前五⟪秒⟫，我帶著緊張的心情上場，同伴拍拍我的肩膀說：「你可以的，加油！」而我也相信自己做得到。", "title": "課文第五段：比賽時刻", "qs": [], "src": "課本（課文〈我的籃球夢〉）"}, {"id": "zk_t61", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "忘記周圍的⟪喧⟫鬧，世界變得一片安靜。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "zk_t62", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "我用力吸了一口氣，將手中的籃球以⟪優⟫美的⟪弧⟫線拋出……。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "zpk_t6", "sec": "課本", "no": "課文", "k": "zp", "st": ["S2"], "sk": "zy", "s": "忘記周圍的⟪喧⟫鬧，世界變得一片安靜。我用力吸了一口氣，將手中的籃球以⟪優⟫美的⟪弧⟫線拋出……。", "title": "課文第六段：投出那一球", "qs": [], "src": "課本（課文〈我的籃球夢〉）"}, {"id": "z5x_01", "sec": "補充", "no": "1", "k": "zy", "st": ["S1"], "sk": "zy", "s": "技⟪巧⟫", "src": "補充題（詞語）", "gen": 1}, {"id": "z5x_02", "sec": "補充", "no": "2", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪巧⟫手", "src": "補充題（詞語）", "gen": 1}, {"id": "z5x_03", "sec": "補充", "no": "3", "k": "zy", "st": ["S1"], : 0, "why": "「我」代替說話的人，說這句話的是兆庭。", "src": "課本（教學走廊：認識詞語）", "bk": "b7"}, {"id": "b7q3", "sec": "課本", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "「子軒不是也很想參加比賽嗎？你趕快約他一起來練球。」句中的「他」，是指誰？", "opts": ["子軒", "教練", "兆庭"], "ans": 0, "why": "「他」是對話雙方以外的人，這裡是在說子軒。", "src": "課本（教學走廊：認識詞語）", "bk": "b7"}, {"id": "b7q4", "sec": "課本", "no": "4", "k": "mc", "st": ["S10"], "sk": "read", "stem": "子軒說：「我剛剛好像聽到你們在聊比賽的事。」句中的「你們」，是指誰？", "opts": ["兆庭和小傑", "子軒和教練", "全班同學"], "ans": 0, "why": "「你們」代替聽話的人，子軒是對兆庭和小傑說話。", "src": "課本（教學走廊：認識詞語）", "bk": "b7"}, {"id": "b7q5", "sec": "課本", "no": "5", "k": "mc", "st": ["S10"], "sk": "read", "stem": "「他還說會先選出八個預備球員。」句中的「他」，是指誰？", "opts": ["教練", "兆庭", "子軒"], "ans": 0, "why": "前面說教練下週要讓大家上場比賽，所以「他」指教練。", "src": "課本（教學走廊：認識詞語）", "bk": "b7"}, {"id": "b7q6", "sec": "課本", "no": "6", "k": "mc", "st": ["S10"], "sk": "read", "stem": "「我、我們」可以代替哪一種人？", "opts": ["說話的人", "聽話的人", "對話雙方以外的人"], "ans": 0, "why": "課本說：「我、我們」可以代替說話的人。", "src": "課本（教學走廊：認識詞語）", "bk": "b7"}, {"id": "b7q7", "sec": "課本", "no": "7", "k": "mc", "st": ["S10"], "sk": "read", "stem": "「你、你們」可以代替哪一種人？", "opts": ["聽話的人", "說話的人", "對話雙方以外的人"], "ans": 0, "why": "課本說：「你、你們」可以代替聽話的人。", "src": "課本（教學走廊：認識詞語）", "bk": "b7"}, {"id": "b7q8", "sec": "課本", "no": "8", "k": "mc", "st": ["S10"], "sk": "read", "stem": "「他、他們」可以代替哪一種人？", "opts": ["對話雙方以外的人", "說話的人", "聽話的人"], "ans": 0, "why": "課本說：「他、他們」可以代替對話雙方以外的人。", "src": "課本（教學走廊：認識詞語）", "bk": "b7"}, {"id": "b1q1", "sec": "一", "no": "1-1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "根據文章內容，可以知道下列哪一個訊息？", "opts": ["購票須知", "表演人數", "觀眾反應", "節目流程"], "ans": 2, "why": "文章說：觀眾立刻安靜下來，紛紛投以敬佩的眼光，還報以熱烈的掌聲，這是觀眾反應。", "bk": "b1", "src": "一.1（打勾題）；課本習作一的提問"}, {"id": "b1q2", "sec": "補充", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "「我」週六參加了什麼活動？", "opts": ["國樂社的成果發表會", "籃球比賽", "學校運動會"], "ans": 0, "why": "文章說：週六，我與同學受邀參加國樂社的成果發表會。", "src": "補充（短文）", "bk": "b1", "gen": 1}, {"id": "b1q3", "sec": "補充", "no": "3", "k": "mc", "st": ["S10"], "sk": , "src": "十.1（１）"}, {"id": "b3q2", "sec": "十", "no": "1-2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "關於舞蹈家許芳宜的描述，下列何者錯誤？", "opts": ["從小學一年級開始學舞", "曾跟著瑪莎．格蘭姆舞團首席舞者羅斯．帕克斯學習", "曾到紐約留學", "在西元一九九九年晉升為瑪莎．格蘭姆舞團的首席舞者"], "ans": 0, "why": "文章說：許芳宜國小四年級才開始學舞，不是小學一年級。", "bk": "b3", "src": "十.1（２）"}, {"id": "b3q3", "sec": "十", "no": "1-3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "根據本文，許芳宜成功的原因不包含哪一個？", "opts": ["堅持", "努力", "毅力", "驕傲"], "ans": 3, "why": "文章說她腳踏實地的練習、憑著過人的毅力、努力堅持夢想，沒有提到「驕傲」。", "bk": "b3", "src": "十.1（３）"}, {"id": "b3q4", "sec": "補充", "no": "4", "k": "mc", "st": ["S10"], "sk": "read", "stem": "許芳宜在舞蹈上的成就，是靠什麼得來的？", "opts": ["腳踏實地的練習", "偶然的運氣", "別人的幫忙"], "ans": 0, "why": "文章說：不是憑藉著偶然成功的運氣，而是腳踏實地的練習。", "src": "補充（短文）", "bk": "b3", "gen": 1}, {"id": "b3q5", "sec": "補充", "no": "5", "k": "mc", "st": ["S10"], "sk": "read", "stem": "大學畢業後，許芳宜獨自前往哪裡追求夢想？", "opts": ["美國的紐約", "日本的東京", "英國的倫敦"], "ans": 0, "why": "文章說：她隻身前往舞者聖地——美國的紐約繼續追求夢想。", "src": "補充（短文）", "bk": "b3", "gen": 1}, {"id": "b3q6", "sec": "補充", "no": "6", "k": "mc", "st": ["S10"], "sk": "read", "stem": "許芳宜認為：「努力不一定會成功，但成功一定要……」？", "opts": ["努力", "運氣", "幫忙"], "ans": 0, "why": "文章說：「努力不一定會成功，但成功一定要努力。」", "src": "補充（短文）", "bk": "b3", "gen": 1}, {"id": "b4q1", "sec": "十", "no": "2-1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "戴資穎為什麼會開始學習羽毛球？", "opts": ["參加學校社團", "教練的推薦", "自己的興趣", "受到爸爸的影響"], "ans": 3, "why": "文章說：受到爸爸熱愛羽球的影響，小學三年級就開始練習羽球。", "bk": "b4", "src": "十.2（１）"}, {"id": "b4q2", "sec": "十", "no": "2-2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "戴資穎學習羽球的過程，可以用下列哪個成語來形容？", "opts": ["不自量力", "腳踏實地", "弄巧成拙", "五體投地"], "ans": 1, "why": "她從不間斷的接受訓練，經過一番苦練才拿到好成績，可以用「腳踏實地」形容。", "bk": "b4", "src": "十.2（２）"}, {"id": "b4q3", "sec": "十", "no": "2-3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "戴資穎認為「戰場上沒有永遠的贏家，只有不斷努力的人。」為什麼她會這麼認為呢？", "opts": ["因為她經常贏球。", "因為她知道練球很辛苦。", "因為她知道對手比自己厲害。", "雖然比賽的輸贏不一定，但自己可以不斷努力求進步。"], "ans": 3, "why": "她認為輸贏不一定，但自己可以不斷努力求進步。", "bk": "b4", "src": "十.2（３）"}, {"id": "b4q4", "sec": "補充", "no": "4", "k": "mc", "st": ["S10"], "sk": "read", "stem": "戴資穎假日時為什麼不能出去遊玩？", "opts": ["她要訓練，這是運動員的本分", "她不喜歡玩", "她要上補習班"], "ans": 0, "why": "文章說：假日時，她無法出去遊玩，她明白這就是運動員的本分。", "src": "補充（短文）", "bk": "b4", "gen": 1}, {"id": "b4q5", "sec": "補充", "no": "5", "k": "mc", "st": ["S10"], "sk": "read", "stem": "戴資穎在二十二歲那年，得到什麼成績？", "opts": ["香港羽球賽女單冠軍", "奧運金牌", "全國跳遠冠軍"], "ans": 0, "why": "文章說：得到二○一六年香港羽球賽的女單冠軍。", "src": "補充（短文）", "bk": "b4", "gen": 1}, {"id": "b4q6", "sec": "補充", "no": "6", "k": "mc", "st": ["S10"], "sk": "read", "stem": "戴資穎說：「好與壞都是成長過程，最重要的是什麼？」", "opts": ["相信自己", "贏過別人", "賺很多錢"], "ans": 0, "why": "文章說：最重要的是相信自己！", "src": "補充（短文）", "bk": "b4", "gen": 1}, {"id": "b5q1", "sec": "十一", "no": "1-1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "下列對於牟子的敘述，哪一個正確？", "opts": ["是西漢人", "善於製作各種宗教器具", "佛教學者會向他請教佛學問題", "會引用儒家經書講解佛學道理"], "ans": 3, "why": "文章說：牟子在對儒家學者講解佛理時，總是引用儒家的經書來作說明。", "bk": "b5", "src": "十一.1（１）"}, {"id": "b5q2", "sec": "十一", "no": "1-2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "下列句子的空格中，哪一個不適合填入「對牛彈琴」？\n①對這些人講道理，無異□□□□，得另想辦法才行。\n②你這場演講內容很精采，遺憾的是□□□□，我們都聽不懂。\n③我們平常就要對機器作深入了解，以便出狀況時能□□□□。\n④我根本不懂抽象畫，害你浪費這麼多時間來□□□□，真是抱歉。", "opts": ["①", "②", "③", "④"], "ans": 2, "why": "「對牛彈琴」是比喻對不懂道理的人講道理，③句的意思是機器出狀況時能夠應付，不適合填入。", "bk": "b5", "src": "十一.1（２）"}, {"id": "b5q3", "sec": "補充", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "牟子為什麼總是引用儒家經書來講解佛理？", "opts": ["因為儒家學者對儒家經典很熟，容易了解", "因為他不懂佛經", "因為佛經太貴"], "ans": 0, "why": "牟子說：你們對儒家經典的內容很熟，引用儒家經典解釋佛理，你們很容易就能了解。", "src": "補充（短文）", "bk": "b5", "gen": 1}, {"id": "b5q4", "sec": "補充", "no": "4", "k": "mc", "st": ["S10"], "sk": "read", "stem": "公明儀彈琴給牛聽，牛有什麼反應？", "opts": ["充耳不聞，自顧著吃草", "立刻跳起舞來", "馬上跑走了"], "ans": 0, "why": "文章說：牛卻充耳不聞，自顧著吃草。", "src": "補充（短文）", "bk": "b5", "gen": 1}, {"id": "b5q5", "sec": "補充", "no": "5", "k": "mc", "st": ["S10"], "sk": "read", "stem": "後來公明儀改彈什麼，牛就停下來聽了？", "opts": ["蚊虻鼓翅聲、落單小牛的悲鳴聲", "很大聲的鼓聲", "悅耳的詩歌"], "ans": 0, "why": "文章說：後來他改彈出蚊虻鼓翅聲、落 "sk": "tf", "stem": "〈我的籃球夢〉這一課，是陳孟萍寫的。", "ans": 1, "why": "課本封面的作者簡介寫著：陳孟萍。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf167", "sec": "補充", "no": "167", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "作者一開始就是球場上的高手。", "ans": 0, "why": "課文說：作者是運動神經不好的人，一開始球總是不好好待在手下。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf168", "sec": "補充", "no": "168", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "作者是在同學的邀約下，加入籃球社的。", "ans": 1, "why": "課文說：在同學的邀約下，與好友一起加入籃球社。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf169", "sec": "補充", "no": "169", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "作者加入籃球社，是因為老師強迫他。", "ans": 0, "why": "課文說是在同學的邀約下，作者勇敢踏出第一步，不是老師強迫。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf170", "sec": "補充", "no": "170", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "作者初次站在球場上，覺得籃球架像一座高山。", "ans": 1, "why": "課文說：覺得籃球架像一座遙不可及的高山。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf171", "sec": "補充", "no": "171", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "作者初次站在球場上，覺得很輕鬆有趣。", "ans": 0, "why": "課文說：一看就讓人覺得害怕。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf172", "sec": "補充", "no": "172", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "學長對作者說：「熟能生巧，只要多練習，就一定會進步。」", "ans": 1, "why": "課文說：學長都為我打氣說：「熟能生巧，只要你努力多練習，就一定會進步。」", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf173", "sec": "補充", "no": "173", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "作者為了實現夢想，總是最晚到球場練習。", "ans": 0, "why": "課文說：總是最早到球場練習。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf174", "sec": "補充", "no": "174", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "作者不曾放棄夢想，總是最早到球場練習。", "ans": 1, "why": "課文說：我不曾放棄，總是最早到球場練習。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf175", "sec": "補充", "no": "175", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "球反彈飛撞到作者的下巴。", "ans": 1, "why": "課文說：好幾次還反彈飛撞我的下巴。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf176", "sec": "補充", "no": "176", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "球反彈飛撞到作者的腳。", "ans": 0, "why": "課文說：反彈飛撞的是作者的下巴。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf177", "sec": "補充", "no": "177", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "球「跳出迷人的舞姿」，是把球當成人來寫。", "ans": 1, "why": "球不會真的跳舞，作者把球當成人來寫，好像球聽從指揮，跳出迷人的舞姿。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf178", "sec": "補充", "no": "178", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "比賽結束前五秒，作者帶著緊張的心情上場。", "ans": 1, "why": "課文說：在比賽結束前五秒，我帶著緊張的心情上場。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf179", "sec": "補充", "no": "179", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "比賽結束前五秒，作者帶著輕鬆的心情上場。", "ans": 0, "why": "課文說：帶著緊張的心情上場。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf180", "sec": "補充", "no": "180", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "作者投球前，忘記周圍的喧鬧，世界變得一片安靜。", "ans": 1, "why": "課文說：忘記周圍的喧鬧，世界變得一片安靜。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf181", "sec": "補充", "no": "181", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "作者將籃球以優美的弧線拋出。", "ans": 1, "why": "課文說：將手中的籃球以優美的弧線拋出。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf182", "sec": "補充", "no": "182", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「此處的代名詞」中，「我、我們」可以代替說話的人。", "ans": 1, "why": "課本說：「我、我們」可以代替說話的人。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf183", "sec": "補充", "no": "183", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「你、你們」可以代替說話的人。", "ans": 0, "why": "「你、你們」代替的是聽話的人，不是說話的人。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf184", "sec": "補充", "no": "184", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「他、他們」可以代替對話雙方以外的人。", "ans": 1, "why": "課本說：「他、他們」可以代替對話雙方以外的人。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf185", "sec": "補充", "no": "185", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「他」可以代替正在對你說話的人。", "ans": 0, "why": "正在對你說話的人，要用「你」，不是「他」。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf186", "sec": "補充", "no": "186", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「非常」和「不已」都是用來形容程度的詞語，只要保留一個就可以了。", "ans": 1, "why": "「非常興奮不已」的「非常」和「不已」意思相近，保留一個即可。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf187", "sec": "補充", "no": "187", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「有朝一日」和「有一天」同時出現，句子會變得很累贅。", "ans": 1, "why": "「有朝一日」和「有一天」意思相近，同時出現會很累贅，保留一個即可。", "src": "是非題（依試卷與課本內容改編）"}, {"id": "tf188", "sec": "補充", "no": "188", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "檢視 常熟悉，而能詳盡的知道或說出來。\n下列哪一個詞語和它的意思相反？", "opts": ["前所未聞", "家喻戶曉", "滾瓜爛熟", "耳濡目染"], "ans": 0, "why": "「前所未聞」，是從來未曾聽說過，和「耳熟能詳」相反。家喻戶曉：家家戶戶都知道。滾瓜爛熟：比喻極為純熟流利。耳濡目染：形容見得多、聽得多而慢慢受到影響。", "src": "六.2"}, {"id": "q6_3", "sec": "六", "no": "3", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「那位魔術師能把白鴿從帽子裡變出來，讓臺下的觀眾都對他的技術感到非常欽佩。」\n句中畫線的地方可以替換成哪個詞語？", "opts": ["無與倫比", "借題發揮", "五體投地", "對牛彈琴"], "ans": 2, "why": "「五體投地」，是比喻佩服到極點，最適合替換「非常欽佩」。無與倫比：比喻沒有能比得上的。借題發揮：假借某事為藉口。對牛彈琴：比喻講話不看對象。", "src": "六.3"}, {"id": "q6x_1", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「熟能生巧」是什麼意思？", "opts": ["練習到很熟練，就能產生巧妙的技術", "不用練習就很厲害", "跑得很快"], "ans": 0, "why": "「熟能生巧」，是練習到很熟練，就能產生巧妙的技術。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_2", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「平分秋色」是什麼意思？", "opts": ["雙方各得一半，實力不相上下", "一方遠遠領先", "秋天的顏色很多"], "ans": 0, "why": "「平分秋色」，是比喻雙方各得一半，或實力不相上下。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_3", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「此起彼落」是什麼意思？", "opts": ["這邊才響起，那邊又接著響起，不斷出現", "這邊停了，那邊也停了", "只有一個地方發出聲音"], "ans": 0, "why": "「此起彼落」，是這邊才響起，那邊又接著響起，一直不斷。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_4", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「遙不可及」是什麼意思？", "opts": ["離得很遠，沒有辦法達到", "很近，一下子就到", "很容易做到"], "ans": 0, "why": "「遙不可及」，是離得很遠，沒有辦法達到。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_5", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「對牛彈琴」是什麼意思？", "opts": ["對不懂道理的人講道理，沒有用", "對牛很溫柔", "很會彈琴"], "ans": 0, "why": "「對牛彈琴」，是比喻講話、做事不看對象。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_6", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「耳熟能詳」是什麼意思？", "opts": ["聽得很熟悉，而且能詳細說出來", "從來沒聽過", "聽不清楚"], "ans": 0, "why": "「耳熟能詳」，是聽得非常熟悉，而能詳盡的知道或說出來。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_7", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「借題發揮」是什麼意思？", "opts": ["借別的事，說出自己真正想說的話", "借書來讀", "借用別人的題目考試"],  "sec": "課本", "no": "代名詞", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "聽話的人，可以用哪一組代名詞代替？", "opts": ["你、你們", "我、我們", "他、他們"], "ans": 0, "why": "課本說：「你、你們」可以代替聽話的人。", "src": "課本（教學走廊：認識詞語）"}, {"id": "cg_7", "sec": "課本", "no": "代名詞", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "對話雙方以外的人，可以用哪一組代名詞代替？", "opts": ["他、他們", "我、我們", "你、你們"], "ans": 0, "why": "課本說：「他、他們」可以代替對話雙方以外的人。", "src": "課本（教學走廊：認識詞語）"}, {"id": "cg_8", "sec": "課本", "no": "代名詞", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "媽媽對我說：「你今天要早點睡。」句中的「你」是指誰？", "opts": ["我（聽話的人）", "媽媽（說話的人）", "爸爸（沒在說話的人）"], "ans": 0, "why": "「你」代替聽話的人，媽媽是對我說話，所以「你」是指我。", "src": "課本（教學走廊：認識詞語）"}, {"id": "cg_9", "sec": "課本", "no": "代名詞", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "哥哥對弟弟說：「我們一起去打球吧！」句中的「我們」是指誰？", "opts": ["哥哥和弟弟", "只有哥哥", "只有弟弟"], "ans": 0, "why": "「我們」代替說話的人和一起的人，所以是哥哥和弟弟。", "src": "課本（教學走廊：認識詞語）"}, {"id": "cm_1", "sec": "課本", "no": "修改", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「我享受著運動帶來的喜悅，每當投球進籃時，場邊的歡呼都讓我非常興奮不已。」\n「非常」和「不已」都是形容程度的詞語，可以怎麼修改？", "opts": ["保留一個，刪去另一個", "兩個都保留", "再加一個「很」"], "ans": 0, "why": "「非常」和「不已」意思相近，保留一個就可以了。", "src": "課本（教學走廊：我會修改句子）"}, {"id": "cm_2", "sec": "課本", "no": "修改", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「我們都夢想著，有朝一日有一天能成為球場上的風雲人物。」\n可以怎麼修改？", "opts": ["刪去「有一天」或「有朝一日」其中一個", "把「夢想」刪掉", "在句首加「非常」"], "ans": 0, "why": "「有朝一日」和「有一天」意思相近，保留一個就可以了。", "src": "課本（教學走廊：我會修改句子）"}, {"id": "cm_3", "sec": "課本", "no": "修改", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「有朝一日」和「有一天」放在同一個句子裡，會怎麼樣？", "opts": ["意思重複，句子變得累贅", "句子變得更精簡", "沒有任何問題"], "ans": 0, "why": "兩個詞語意思相近，同時出現造成累贅。", "src": "課本（教學走廊：我會修改句子）"}, {"id": "cm_4", "sec": "課本", "no": "修改", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "怎麼修改，可以讓句子更精簡流暢？", "opts": ["檢視文句，刪除意思相近的詞語，保留一個", "把句子寫得更長", "多加幾個形容詞"], "ans": 0, "why": "課本說：檢視文句，刪除意思相近的詞語，可以讓句子更精簡流暢。", "src": "課本（教學走廊：我會修改句子）"}, {"id": "cm_5", "sec": "課本", "no": "修改", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "下列哪一個句子，有意思重複的詞語？", "opts": ["我 期末音樂會，班上有很多同學上臺（　　）奏樂器。", "opts": ["彈", "憚", "單"], "ans": 0, "why": "「彈奏」的「彈」，是這個字。", "src": "課本（教學走廊：我會認字）", "pO": 1, "say": "選出對的字，放進空格。期末音樂會，班上有很多同學上臺，空格，奏樂器。"}, {"id": "cr_9", "sec": "課本", "no": "認字", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "選出對的字，放進空格。\n下課時，我喜歡和同學一起玩（　　）珠。", "opts": ["彈", "憚", "單"], "ans": 0, "why": "「彈珠」的「彈」，是這個字。", "src": "課本（教學走廊：我會認字）", "pO": 1, "say": "選出對的字，放進空格。下課時，我喜歡和同學一起玩，空格，珠。"}, {"id": "cr_10", "sec": "課本", "no": "認字", "k": "mc", "st": ["S7"], "sk": "zy", "stem": "「⟬熟⟭悉」\n框框裡的字，怎麼讀？", "opts": ["ㄕㄨˊ", "ㄕㄨˇ", "ㄕㄨˋ"], "ans": 0, "why": "「熟悉」的「熟」，讀ㄕㄨˊ。", "src": "課本（教學走廊：我會認字）", "pO": 1, "say": "熟悉的熟，怎麼讀？"}, {"id": "cr_11", "sec": "課本", "no": "認字", "k": "mc", "st": ["S7"], "sk": "zy", "stem": "「⟬熱⟭情」\n框框裡的字，怎麼讀？", "opts": ["ㄖㄜˋ", "ㄖㄜˊ", "ㄖㄜˇ"], "ans": 0, "why": "「熱情」的「熱」，讀ㄖㄜˋ。", "src": "課本（教學走廊：我會認字）", "pO": 1, "say": "熱情的熱，怎麼讀？"}, {"id": "cr_12", "sec": "課本", "no": "認字", "k": "mc", "st": ["S7"], "sk": "zy", "stem": "「反⟬彈⟭」\n框框裡的字，怎麼讀？", "opts": ["ㄊㄢˊ", "ㄉㄢˋ", "ㄊㄢˇ"], "ans": 0, "why": "「反彈」的「彈」，讀ㄊㄢˊ。", "src": "課本（教學走廊：我會認字）", "pO": 1, "say": "反彈的彈，怎麼讀？"}, {"id": "cr_13", "sec": "課本", "no": "認字", "k": "mc", "st": ["S7"], "sk": "zy", "stem": "「子⟬彈⟭」\n框框裡的字，怎麼讀？", "opts": ["ㄉㄢˋ", "ㄊㄢˊ", "ㄊㄢˇ"], "ans": 0, "why": "「子彈」的「彈」，讀ㄉㄢˋ。", "src": "課本（教學走廊：我會認字）", "pO": 1, "say": "子彈的彈，怎麼讀？"}, {"id": "cs_1", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「喝采」是什麼意思？", "opts": ["大聲叫好，鼓勵別人", "大聲哭泣", "小聲說話"], "ans": 0, "why": "「喝采」，是大聲叫好，鼓勵別人。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "cs_2", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「成就感」是什麼意思？", "opts": ["完成一件事後，心裡覺得很滿足", "覺得很餓", "覺得很冷"], "ans": 0, "why": "「成就感」，是完成一件事後，心裡覺得很滿足的感覺。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "cs_3", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「邀約」是什麼意思？", "opts": ["邀請、約請", "拒絕", "告別"], "ans": 0, "why": "「邀約」，是邀請、約請。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "cs_4", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「運動神經不好」是什麼意思？", "opts": ["動作不太靈活，運動能力比較差", "很會運動", "不喜歡看書"], "ans": 0, "why": "「運動神經不好」，是動作不太靈活，運動能力比較差。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "cs_5", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「風雲人物」是什麼意思？", "opts": ["很出名、很有影響力的人", "天氣預報員", "很怕風的人"], "ans": 0, "why": "「風雲人物」，是在社會上或某個領域很出名、很有影響力的人。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "cs_6", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「遙不可及」是什麼意思？", "opts": ["離得很遠，沒有辦法達到", "很近，一下子就到", "很好吃"], "ans": 0, "why": "「遙不可及」，是離得很遠，沒有辦法達到。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "cs_7", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「熟能生巧」是什麼意思？", "opts": ["練習到很熟練，就能產生巧妙的技術", "不用練習就很厲害", "跑得很快"], "ans": 0, "why": "「熟能生巧」，是練習到很熟練，就能產生巧妙的技術。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "cs_8", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「反彈」是什麼意思？", "opts": ["東西撞到別的東西後彈回來", "往下掉", "停住不動"], "ans": 0, "why": "「反彈」，是東西撞到別的東西後彈回來。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "cs_9", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「我不曾放棄」是什麼意思？", "opts": ["從來沒有放棄過", "已經放棄了", "想要放棄"], "ans": 0, "why": "「不曾」，是從來沒有。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "cs_10", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「漸漸的」是什麼意思？", "opts": ["一點一點慢慢的", "一下子突然", "永遠不會"], "ans": 0, "why": "「漸漸的」，是一點一點慢慢的變化。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "cs_11", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「興奮不已」是什麼意思？", "opts": ["非常興奮，沒辦法停下來", "有一點點開心", "一點也不高興"], "ans": 0, "why": "「興奮不已」，是非常興奮，沒辦法停下來。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "cs_12", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「此起彼落」是什麼意思？", "opts": ["這邊才響起，那邊又接著響起", "這邊停了，那邊也停了", "只有一個地方發出聲音"], "ans": 0, "why": "「此起彼落」，是這邊才響起，那邊又接著響起，一直不斷。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "cs_13", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「雙方實力平分秋色」是什麼意思？", "opts": ["兩邊實力差不多，不相上下", "一邊很強，一邊很弱", "兩邊都不想比賽"], "ans": 0, "why": "「平分秋色」，是比喻雙方實力不相上下。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "cs_14", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「喧鬧」是什麼意思？", "opts": ["聲音吵雜", "安靜無聲", "很黑暗"], "ans": 0, "why": "「喧鬧」，是聲音吵雜，很熱鬧。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "cs_15", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「優美的弧線」是什麼樣的線？", "opts": ["又好看又彎彎的線", "筆直的線", "斷掉的線"], "ans": 0, "why": "「優美」是優雅美好，「弧線」是彎彎的線。", "src": "課本（課文〈我的籃球夢〉）"}, {"id": "cf_1", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "這一課〈我的籃球夢〉，主要在寫什麼？", "opts": ["作者加入籃球社，努力練習，終於投進關鍵一球", "上課時的情形", "一次旅行"], "ans": 0, "why": "全文寫作者加入籃球社，努力練習，最後在比賽中投出關鍵一球。", "src": "課本（課文句型、修辭、標點）"}, {"id": "cf_2", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「覺得籃球架像一座遙不可及的高山」，作者把籃球架比成什麼？", "opts": ["一座高山", "一棵大樹", "一把雨傘"], "ans": 0, "why": "作者把籃球架比成又高又遠的高山，來說明籃球架讓他覺得害怕。", "src": "課本（課文句型、修辭、標點）"}, {"id": "cf_3", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「球終於接受我雙手的指揮，跳出迷人的舞姿」，這句話是把球當成什麼來寫？", "opts": ["像人一樣，聽指揮、會跳舞", "像真的舞者", "像一隻小鳥"], "ans": 0, "why": "球不會真的接受指揮、跳舞，作者把球當成人來寫。", "src": "課本（課文句型、修辭、標點）"}, {"id": "cf_4", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「只要你努力多練習，就一定會進步」，「只要……就……」是什麼意思？", "opts": ["做到前面的條件，就會有後面的結果", "不管怎樣都不會成功", "只有一半成功"], "ans": 0, "why": "「只要……就……」，表示只要做到前面的條件，就會有後面的結果。", "src": "課本（課文句型、修辭、標點）"}, {"id": "cf_5", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「每當投球進籃時，場邊的歡呼都讓我興奮不已」，「每當」是什麼意思？", "opts": ["每一次、每次", "偶爾", "從來不"], "ans": 0, "why": "「每當」，是每一次的意思。", "src": "課本（課文句型、修辭、標點）"}, {"id": "cf_6", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「你可以的，加油！」句尾的「！」叫什麼？", "opts": ["驚嘆號", "問號", "頓號"], "ans": 0, "why": "「！」叫做驚嘆號，用在表示驚訝、感嘆或呼喊的句子後面。", "src": "課本（課文句型、修辭、標點）"}, {"id": "cf_7", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「走，我們一起去報名籃球社。」外面的「」叫什麼？", "opts": ["引號", "括號", "頓號"], "ans": 0, "why": "「」叫做引號，用來標示別人說的話。", "src": "課本（課文句型、修辭、標點）"}, {"id": "cf_8", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "課文最後用「……」，是表示什麼？", "opts": ["話還沒說完，讓人去想像後面的情形", "話已經說完了", "在問問題"], "ans": 0, "why": "「……」叫做刪節號，這裡讓人想像球飛出去的樣子。", "src": "課本（課文句型、修辭、標點）"}, {"id": "cf_9", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "投球前，周圍很吵，為什麼作者覺得世界變得一片安靜？", "opts": ["因為他很專心，忘記了周圍的喧鬧", "因為大家都走了", "因為比賽結束了"], "ans": 0, "why": "課文說：忘記周圍的喧鬧，世界變得一片安靜，表示他非常專心。", "src": "課本（課文句型、修辭、標點）"}, {"id": "g4_1", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "小明抱著什麼去球場？", "opts": ["籃球", "書包", "雨傘"], "ans": 0, "why": "短文說：小明抱著籃球飛也似的跑去球場。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "放學後，小明抱著籃球飛也似的跑去球場。"}, {"id": "g4_2", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "教練說，只要怎麼做就會進步？", "opts": ["多練習", "多睡覺", "多吃飯"], "ans": 0, "why": "短文說：只要多練習，球技一定會進步。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "教練說：「只要多練習，球技一定會進步。」"}, {"id": "g4_3", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "小美在音樂會上做什麼？", "opts": ["彈鋼琴", "打籃球", "跳繩"], "ans": 0, "why": "短文說：小美彈著鋼琴。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "音樂會上，小美彈著鋼琴，台下的掌聲此起彼落。"}, {"id": "g4_4", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "兩隊的實力怎麼樣？", "opts": ["差不多", "差很多", "都不會打"], "ans": 0, "why": "短文說：兩隊的比賽平分秋色，表示實力差不多。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "兩隊的比賽平分秋色，直到最後一秒才分出勝負。"}, {"id": "g4_5", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "哥哥每天早上練習什麼？", "opts": ["投籃", "游泳", "畫畫"], "ans": 0, "why": "短文說：哥哥每天早上都練習投籃。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "哥哥每天早上都練習投籃，風雨無阻。"}, {"id": "g4_6", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "老師做了什麼，讓大家安靜？", "opts": ["輕輕敲桌子", "大聲罵人", "關上燈"], "ans": 0, "why": "短文說：老師輕輕敲了三下桌子。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "教室裡很喧鬧，老師輕輕敲了三下桌子，大家馬上安靜下來。"}, {"id": "g4_7", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "弟弟邀請誰來家裡？", "opts": ["同學", "老師", "警察"], "ans": 0, "why": "短文說：弟弟邀請同學來家裡玩。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "弟弟邀請同學來家裡玩，大家玩得非常開心。"}, {"id": "g4_8", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "球在空中畫出了什麼？", "opts": ["優美的弧線", "一個圓圈", "一條直線"], "ans": 0, "why": "短文說：球在空中畫出一道優美的弧線。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "小傑跳起來，球在空中畫出一道優美的弧線，咻的一聲進籃了。"}, {"id": "g4_9", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "妹妹第一次上臺，心情怎麼樣？", "opts": ["有一點緊張", "一點也不怕", "很生氣"], "ans": 0, "why": "短文說：妹妹第一次上臺，雖然緊張。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "妹妹第一次上臺表演，雖然緊張，但是她沒有放棄，勇敢的唱完了。"}, {"id": "g4_10", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "社團課時，我選了什麼社？", "opts": ["國樂社", "籃球社", "美術社"], "ans": 0, "why": "短文說：我選了國樂社。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "社團課時，我選了國樂社，學習彈奏琵琶。"}, {"id": "g4_11", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "比賽結束後，隊員做了什麼？", "opts": ["互相握手", "吵架", "直接回家"], "ans": 0, "why": "短文說：兩隊的隊員彼此握手。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "比賽結束後，兩隊的隊員彼此握手，互相說「謝謝」。"}], "books": [{"id": "b0", "title": "我的籃球夢（課文）", "src": "課本 第三課", "e": "🏀", "paras": ["「ㄕㄨㄚ——」空心進籃！全場歡聲四起，這一刻，大家都在為我喝采，真有說不出的成就感。", "「走，我們一起去報名籃球社。」還記得剛開學時，在同學的邀約下，就算是運動神經不好的我，也決定勇敢踏出第一步，與好友一起加入籃球社。我們都夢想著，有朝一日能成為球場上的風雲人物。", "初次站在球場上的我，覺得籃球架像一座遙不可及的高山，一看就讓人覺得害怕。此外，我也不知道要怎麼做才能將球投進。學長都為我打氣說：「熟能生巧，只要你努力多練習，就一定會進步。」", "「一、二、三、ㄅㄧ——」隨著教練的口令，我們開始學運球。奇怪的是，球總是不好好的待在我的手下，好幾次還反彈飛撞我的下巴。但是為了實現夢想，我不曾放棄，總是最早到球場練習。漸漸的，球終於接受我雙手的「指揮」，跳出迷人的舞姿。我享受著運動帶來的喜悅，每當投球進籃時，場邊的歡呼都讓我興奮不已。", "「加油！加油！」此時，熱鬧的加油聲此起彼落，球場上，每個人都努力展現出平日練習的成果。雙方實力平分秋色，在比賽結束前五秒，我帶著緊張的心情上場，同伴拍拍我的肩膀說：「你可以的，加油！」而我也相信自己做得到。", "忘記周圍的喧鬧，世界變得一片安靜。我用力吸了一口氣，將手中的籃球以優美的弧線拋出……。"], "notes": ["風雲人物：在社會上或某個領域很出名、很有影響力的人。", "遙不可及：離得很遠，沒有辦法達到。", "熟能生巧：練習到很熟練，就能產生巧妙的技術。", "此起彼落：這邊才響起，那邊又接著響起，一直不斷。", "平分秋色：雙方不相上下，各得一半。"]}, {"id": "b7", "title": "認識詞語：代名詞（教學走廊）", "src": "課本（教學走廊：認識詞語）", "e": "💬", "paras": ["兆庭，教練下週準備讓我們上場比賽了！", "太棒了！那我得加緊練習投籃。", "子軒不是也很想參加比賽嗎？你趕快約他一起來練球。", "我剛剛好像聽到你們在聊比賽的事。", "教練下週要讓我們上場比賽了！", "他還說會先選出八個預備球員，希望我們都能被選中。", "此處的代名詞是用來代替人物的詞語。「我、我們」可以代替說話的人，「你、你們」可以代替聽話的人，「他、他們」可以代替對話雙方以外的人。"], "notes": []}, {"id": "b1", "title": "國樂社的成果發表會", "src": "一.1（閱讀）", "e": "🎻", "paras": ["週六，我與同學受邀參加國樂社的成果發表會。優雅的團長踏上指揮臺不到十秒鐘，喧譁的觀眾立刻安靜下來，紛紛投以敬佩的眼光。", "團員們在這座弧形舞臺上，彼此展現著純熟的技巧，彈奏出悠揚的樂曲，讓人把煩惱都拋到遙遠的九霄雲外了。", "音樂會結束時，觀眾都報以熱烈的掌聲，表示未曾欣賞過如此精采的表演。"], "notes": []}, {"id": "b2", "title": "週末登山", "src": "一.4（閱讀）", "e": "⛰", "paras": ["這個週末，我與家人邀請彼此的朋友一起登山。路途中，我們一邊遙望山下的景色，一邊享受遠離城市喧囂的寧靜。", "到達山頂時，爸爸和大家分享了大學參加登山社時，曾發生過的趣事，讓我產生未來加入專業登山團隊的夢想。", "直到天色漸漸變暗，我們才依依不捨的揮別優美的山林，踏上返家的路程。"], "notes": []}, {"id": "b3", "title": "腳踏實地的許芳宜", "src": "十.1（延伸閱讀）", "e": "💃", "paras": ["在眾人眼中，舞蹈家許芳宜是舞臺上最耀眼的星星，然而她在舞蹈上的成就，不是憑藉著偶然成功的運氣，而是腳踏實地的練習。", "許芳宜國小四年級才開始學舞，所以比別人加倍努力。她每天除了上學，就是練舞，在國立藝術學院舞蹈系求學期間，跟著瑪莎．格蘭姆舞團首席舞者羅斯．帕克斯學習。因為老師的鼓勵，她立志要成為專業的舞者。", "大學畢業後，她隻身前往舞者聖地——美國的紐約繼續追求夢想。她忍受孤獨，克服語言的障礙，不斷的學習與成長。當她踮起腳尖翩翩起舞，流過的淚水與汗水，踩過的困難與挫折，都成為蛻變的養分，讓她散發美麗與自信的光彩。", "許芳宜認為：「努力不一定會成功，但成功一定要努力。」她憑著過人的毅力，不斷的挑戰自己，終於在西元一九九九年晉升為瑪莎．格蘭姆舞團的首席舞者。她努力堅持夢想，終於走出一條屬於自己的成功之路。"], "notes": []}, {"id": "b4", "title": "世界球后戴資穎", "src": "十.2（延伸閱讀）", "e": "🏸", "paras": ["臺灣羽球史上首位「世界球后」戴資穎，受到爸爸熱愛羽球的影響，小學三年級就開始練習羽球。她擁有堅定的毅力，從不間斷的接受訓練。假日時，她無法出去遊玩，也沒辦法多陪伴家人，她明白這就是運動員的本分，要經過一番的苦練後，才能拿到好成績。", "學習羽球的過程很辛苦，有時需要忍受運動造成的傷害，有時成績不理想還會遭受批評，但是戴資穎從沒放棄她熱愛羽球的夢想。她曾說：「好與壞都是成長過程，最重要的是相信自己！」在她二十二歲那年，得到二○一六年香港羽球賽的女單冠軍，登上世界女單排名第一，成為「世界球后」。", "即使現在的戴資穎已是球場上的常勝軍，但她還是認為戰場上沒有永遠的贏家，只有不斷努力的人。她期勉自己時時精進，將狀態調整到最好，繼續在羽球世界發光發熱。"], "notes": ["常勝軍：常常得到勝利的隊伍或人。", "精進：努力讓自己變得更好。", "期勉：期待並勉勵。"]}, {"id": "b5", "title": "對牛彈琴", "src": "十一（成語故事）", "e": "🐮", "paras": ["牟子，本名牟融，東漢人，熟讀各種書籍，並精通佛理，許多儒家學者都向他請教有關佛學的問題。不過牟子在對儒家學者講解佛理時，總是引用儒家的經書來作說明，有人問：「您說佛家經典那麼多，內容廣博深厚，為什麼不用佛經講解呢？」", "牟子答道：「你們對儒家經典的內容很熟，如果我引用儒家經典解釋佛理，你們很容易就能了解。反之，我若是引用佛典，就像對瞎子說各種漂亮顏色，對聾子演奏音樂，一點幫助也沒有。例如春秋時，魯國的公明儀，有一次看見一頭牛在吃草，就彈琴給牠聽，可是不管旋律多悅耳動聽，牛卻充耳不聞，自顧著吃草，這是因為人類的音樂不適合給牛聽。後來他改彈出蚊虻鼓翅聲、落單小牛的悲鳴聲，牛就立刻停止吃草，搖著尾巴，豎起耳朵，徬徨不安的聆聽。我引用儒家經典來講解佛理，也是同樣的道理。」", "後來這個故事就被濃縮成「對牛彈琴」，用來比喻對不懂道理的人講道理。"], "notes": ["自顧：自身難保，沒有餘力再幫助他人。", "落單：離開團體，單獨一人。"]}, {"id": "b8", "title": "球場上的好朋友", "src": "補充", "e": "🏀", "paras": ["放學後，小傑和兆庭一起走到學校的籃球場。", "小傑拿起籃球，站在罰球線上，深深吸了一口氣。", "「咻——」球在空中畫出一道弧線，穩穩的進了籃框。", "兆庭拍手說：「投得真準！」小傑開心的笑了。"], "notes": []}, {"id": "b9", "title": "音樂表演會", "src": "補充", "e": "🎹", "paras": ["星期五晚上，學校的禮堂裡舉辦音樂表演會。", "小美穿著漂亮的白色裙子，站在舞臺中間彈鋼琴。", "悠揚的琴聲響起，臺下的觀眾都靜靜的聽著。", "表演結束，大家熱烈的鼓掌，小美鞠躬道謝。"], "notes": []}, {"id": "b10", "title": "下雨天的籃球隊", "src": "補充", "e": "🌈", "paras": ["下雨的星期三，籃球場溼溼的，小華沒辦法練球。", "他和同學們坐在走廊上，看著雨滴一滴一滴落下來。", "教練拿出一本筆記本，教大家畫戰術圖，說明要怎麼傳球。", "雨停了，彩虹出現在天空，大家開心的跑出去，在球場上繼續練習。"], "notes": []}], "img": {}, "cover": [["一", "國字注音（短文 4 篇、詞語與句子 9 題）", ["z5_2", "z5_3", "z5_5", "z5_6", "z5_7", "z5_8", "z5_9", "z5_10", "z5_12", "z_a1", "z_a2", "z_a3", "z_a4", "z_a5", "z_a6", "zp_a", "z_b1", "z_b2", "z_b3", "z_b4", "z_b5", "z_b6", "zp_b", "z_c1", "z_c2", "z_c3", "z_c4", "zp_c", "z_d1", "z_d2", "z_d3", "zp_d"]], ["一", "閱讀測驗：國樂社的成果發表會（打勾題）、週末登山（3 題）", ["b1q1", "b2q1", "b2q2", "b2q3"]], ["二", "連連看：弧、狐、孤的組合", ["m_c1e"]], ["二", "造詞（社、巧、遙、弧、狐、孤、彈、與；改成選出正確的詞語、讀音，共 20 題）", ["q2_1", "q2_1z", "q2_2", "q2_2z", "q2_3", "q2_3z", "q2_4", "q2_4z", "q2_5", "q2_5z", "q2_6", "q2_6z", "q2_7", "q2_8", "q2_7z", "q2_8z", "q2_9", "q2_10", "q2_9z", "q2_10z"]], ["三", "選擇題（擔憂與優美、錯別字、優和擾、字形不同、邀和社；共 5 題）", ["q3_1", "q3_2", "q3_3", "q3_4", "q3_5"]], ["四", "連連看：邀、激、繳；彼、披、疲的組合", ["m_c1f", "m_c1g"]], ["四", "先寫注音，再造詞（邀、激、繳；投、設；優、憂；彼、披、被、疲；共 22 題）", ["q4_1z", "q4_1", "q4_2z", "q4_2", "q4_3z", "q4_3", "q4_4z", "q4_4", "q4_5z", "q4_5", "q4_6z", "q4_6", "q4_7z", "q4_7", "q4_8z", "q4_8", "q4_9z", "q4_9", "q4_10z", "q4_10", "q4_11z", "q4_11"]], ["五", "改錯題（3 題，共 5 個錯字）", ["ty5_1", "ty5_2", "ty5_3"]], ["六", "選擇題：生字延伸成語（對牛彈琴、耳熟能詳、五體投地；共 3 題）", ["q6_1", "q6_2", "q6_3"]], ["七", "圈圈看：多餘或不恰當的詞語（4 題）、弧／孤（2 題）、沒有ㄠ音的字（共 7 題）", ["q7_1", "q7_2", "q7_3", "q7_4", "q7_5a", "q7_5b", "q7_6"]], ["八", "連連看（組成方式相同的短語：動作＋樣子＋ function qDone(o){const quick=o.first&&!S.why&&!o.force;
  if(quick&&o.sayFirst&&S.tts){sfx('ok');say(o.sayFirst);later(praise,1000);later(o.onDone,2500);return}
  if(quick){sfx('ok');praise();later(o.onDone,S.tts?1400:950);return}
  later(()=>sheet({ok:o.first,title:o.first?undefined:(o.title||'記起來囉！'),html:o.html,say:o.say,onClose:o.onDone}),o.delay==null?500:o.delay)}
const inRect=(el,x,y)=>{const r=el.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom};
/* 拖拉：只負責「拖」；點一下由各元素自己的 click 處理 */
function dragBind(root,o){root.addEventListener('pointerdown',e=>{const el=e.target.closest(o.item);if(!el||!root.contains(el)||(o.can&&!o.can(el)))return;
  const sx=e.clientX,sy=e.clientY,r=el.getBoundingClientRect();let ghost=null,moved=false;
  const zones=()=>$$(o.zone,root.closest('.screen')||document);
  const move=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(!moved&&Math.hypot(dx,dy)<10)return;
    if(!moved){moved=true;ghost=el.cloneNode(true);ghost.className+=' ghost';ghost.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;margin:0;z-index:99;pointer-events:none;transform:scale(1.12) rotate(-4deg);opacity:.95`;document.body.appendChild(ghost);el.classList.add('dragging')}
    ghost.style.left=(r.left+dx)+'px';ghost.style.top=(r.top+dy)+'px';zones().forEach(z=>z.classList.toggle('over',inRect(z,ev.clientX,ev.clientY)))};
  const up=ev=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
    zones().forEach(z=>z.classList.remove('over'));
    if(moved){ghost.remove();el.classList.remove('dragging');const z=zones().find(z=>inRect(z,ev.clientX,ev.clientY));if(z)o.drop(el,z);o._nc=Date.now()}};
  document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up)})}

/* 拖拉 + 點選：避免拖拉結束後又觸發 click */

/* ====== S1 後台報到：國字注音 ====== */
function gRock(){const all=POOL.S1,zyI=all.filter(id=>IT[id].k==='zy');
  const n=CNT(all.length,6,10),nopt=3;

  function arena(opts){return`<div class="rockarena" id="ar"><div class="rocks">${opts.map((c,i)=>`<button class="rock rk${i%4}${[...c].length>2?' wide':''}" data-c="${esc(c)}" style="--dl:${(i*.55).toFixed(2)}s;--my:${[.2,2.2,.9,1.8][i%4]}rem"><span class="rk ${[...c].length>=2?'w2':''} ${[...c].length>3?'w3':''}">${esc(c)}</span></button>`).join('')}</div><div class="shipbar"><span class="ship" id="ship">🎤</span></div></div>`}
  function bindRocks(right,onHit,onMiss){const ar=$('#ar',sb),ship=$('#ship',sb);let over=false,wrongs=0;
    function fire(rock){const ra=ar.getBoundingClientRect(),sr=ship.getBoundingClientRect(),rr=rock.getBoundingClientRect();
      const sx=sr.left+sr.width/2-ra.left,sy=sr.top+sr.height/2-ra.top,tx=rr.left+rr.width/2-ra.left,ty=rr.top+rr.height/2-ra.top,dx=tx-sx,dy=ty-sy;
      const l=document.createElement('div');l.className='laser';l.style.cssText=`left:${sx}px;top:${sy}px;width:${Math.hypot(dx,dy)}px;transform:rotate(${Math.atan2(dy,dx)*180/Math.PI}deg)`;ar.appendChild(l);setTimeout(()=>l.remove(),420);
      }

      if(r.dataset.c===right){over=true;fire(r);sfx('whack');setTimeout(()=>{r.classList.add('boom');r.querySelector('.rk').textContent='⭐';sfx('ok');popEl(r,'嘩啦！');$$('.rock',sb).forEach(x=>{if(x!==r)x.classList.add('gone')});onHit(r)},300)}
      else{wrongs++;sfx('bad');r.classList.add('bad');toast('不是這個，再找找看。');onMiss(wrongs);
        if(wrongs>=2){const rr=$$('.rock',sb).find(x=>x.dataset.c===right);if(rr)rr.classList.add('hint')}}})}
  function roundZy(id,done){const it=IT[id],b=one_(zyBlanks(it)),st=zyStem(b),o=zyOpts(b,nopt),sentP=b.seg.map(k=>k.c).join('');

    sb.innerHTML=progBar()+inst('🎵','看注音，點出對的字。','看上面的注音，點出對的字。')+`<div class="qcard"><div class="qt" id="qs">${T(st.s)}</div>${spk(sentP)}</div>`+arena(opts);

          qDone({first:!failed,html:WHYBOX(T(zyStem(b,true).s),`「${b.c}」讀作 ${o.zh}。`),say:`${b.c}，讀作${o.zh}`,onDone:done,delay:700})},()=>{failed=true})}

/* ====== S2 舞台廣播：國字注音（短文）＋閱讀問答 ====== */
function gRadio(){const its=POOL.S2.filter(id=>IT[id].k==='zp');
  const pid=pickN(its,1)[0],it=IT[pid];
  const P=it.s.replace(/⟪(.)⟫/g,'$1'),zs=zyArr(P);
  const blanks=[];{let j=0;for(let i=0;i<it.s.length;i++){const ch=it.s[i];if(ch==='⟪'){blanks.push({pi:j,c:it.s[i+1]});i+=2;j++}else j++}}
  /* 把長文拆成一小句一小句：電台一次只傳一句 */
  const sents=[];{const re=/[^。？！\n]+[。？！]?/g;let m;while((m=re.exec(P))){sents.push({a:m.index,b:m.index+m[0].length})}}
  sents.forEach(se=>se.bl=blanks.filter(b=>b.pi>=se.a&&b.pi<se.b));
  const k=CNT(blanks.length,5,8);
  /* 每句先各挑一個缺口，再補足 */
  const withB=shuffle(sents.filter(se=>se.bl.length));const chosen=[];
  withB.forEach(se=>{if(chosen.length<k)chosen.push(shuffle(se.bl)[0])});
  let guard=0;while(chosen.length<k&&guard++<50){const c=shuffle(blanks.filter(b=>!chosen.includes(b)))[0];if(!c)break;chosen.push(c)}
  chosen.sort((x,y)=>x.pi-y.pi);
  const rounds=sents.filter(se=>chosen.some(b=>b.pi>=se.a&&b.pi<se.b));
  const nGen=S.len==='std'?3:2;const total=chosen.length+nGen;const {sb}=stageShell('S2',total);window.CURID=pid;
  const nopt=3;
  chosen.forEach(b=>{b.opts=shuffle([b.c].concat(xchars(b.c,nopt-1)))});
  let done=0,failedAny=false;window.TGI={chosen:chosen.map(b=>b.c)};
  const sentHTML=(se,filled)=>{let html='<span class="cl">';for(let j=se.a;j<se.b;j++){const ch=P[j];const bi=chosen.findIndex(b=>b.pi===j);
      if(bi>=0&&!(filled||chosen[bi].done))html+=`<button class="hole" data-b="${bi}"><ruby class="zb"><span class="zbx">　</span><rt>${zs[j]}</rt></ruby></button>`;
      else if(zs[j])html+=`<ruby>${esc(ch)}<rt>${zs[j]}</rt></ruby>`;else html+=esc(ch);
      if((ch==='，'||ch==='─')&&j<se.b-1)html+='</span> <span class="cl">'}return html+'</span>'};
  const plainS=se=>P.slice(se.a,se.b).replace(/\n/g,'');
  function showRound(ri){const se=rounds[ri];let cur=-1;
    const mine=chosen.map((b,i)=>i).filter(i=>chosen[i].pi>=se.a&&chosen[i].pi<se.b);
    sb.innerHTML=progBar()+inst('📣','看注音，點出對的字。','看注音，點出對的字。')+`<div class="radio"><div class="rhead"><span>📣 廣播 ${ri+1}/${rounds.length}</span><span class="sigs">${chosen.map((b,i)=>`<i id="sg${i}" class="${b.done?'on':''}"></i>`).join('')}</span></div><div class="rmsg big" id="rm">${sentHTML(se)}</div><div class="rkeys" id="rk"></div></div>`;
    setPB(done/total);setProg(done,total);autoSay((ri===0?'先點一個框框，看框框上面的注音，再從下面點出對的字。':'下一塊廣播。看注音，點出對的字。')+plainS(se));
    const holes=$$('.hole',sb);
    function focus(bi){cur=bi;holes.forEach(h=>h.classList.toggle('act',+h.dataset.b===bi&&!h.classList.contains('okh')));const b=chosen[bi];
      $('#rk',sb).innerHTML=b.opts.map(c=>`<button class="key" data-c="${esc(c)}">${esc(c)}</button>`).join('');
      $$('.key',sb).forEach(kb=>kb.onclick=()=>{if(kb.disabled)return;const b2=chosen[cur];
        if(kb.dataset.c===b2.c){const h=holes.find(x=>+x.dataset.b===cur);h.classList.add('okh');h.classList.remove('act');h.innerHTML=`<ruby>${esc(b2.c)}<rt>${zs[b2.pi]}</rt></ruby>`;sfx('pop');popEl(h,'⭐');$('#sg'+cur,sb).classList.add('on');
          record(pid,!b2.bad,h);done++;setProg(done,total);setPB(done/total);b2.done=1;if(b2.bad)failedAny=true;
          const nx=mine.find(i=>!chosen[i].done);if(nx!==undefined)focus(nx);
          else{$('#rk',sb).innerHTML=`<div class="sigdone">🎉 廣播補好了！</div>`;sfx('win');later(()=>say('好棒！廣播補好了。'+plainS(se)),300);later(()=>{if(ri+1<rounds.length)showRound(ri+1);else phase2()},2200)}}
        else{b2.bad=true;kb.disabled=true;kb.classList.add('bad');sfx('bad');toast('不是這個，再看看注音。')}})}
    holes.forEach(h=>h.onclick=()=>{const bi=+h.dataset.b;if(chosen[bi].done)return;focus(bi)});
    focus(mine[0])}
  /* 舞台廣播問答：短文本身就在畫面上，不需要課本 */
  const gen=pickN(POOL.S2.filter(id=>IT[id].gen),S.len==='std'?3:2);
  function phase2(){let qi=0;const qs=gen;
    const nextQ=()=>{if(qi>=qs.length)return endStage();const q=mcq(qs[qi]);window.CURID=qs[qi];const cl=x=>String(x).replace(/[。？！\s]+$/,'');q.say=`舞台廣播：${cl(q.ctx)}。問題：${cl(q.stem)}？有${q.opts.length}個答案：${q.opts.map((o,i)=>'ABCD'[i]+'，'+o.replace(/。$/,'')).join('；')}。請選一個。`;setProg(chosen.length+qi,total);
      sb.innerHTML=progBar()+inst('📣','聽廣播，點出答案。','聽廣播，再點出答案。')+`<div id="qh"></div>`;setPB((chosen.length+qi)/total);
      renderMCQ($('#qh',sb),q,{retry:true,ctxOpen:true,onDone:()=>{qi++;nextQ()}})};nextQ()}

/* ====== S3 樂器拼拼：拼字、連成詞語、短語連連看 ====== */
const PSAY={'氵':'三點水','扌':'提手旁','刂':'立刀旁','亻':'單人旁','言':'言字旁','虫':'蟲字旁','隹':'追','圭':'規','门':'門','门':'門','开':'開字裡面的开','立':'站立的立','戈':'戈','又':'又','果':'水果的果','門':'門'};
const partSay=p=>p.endsWith('＋出頭')?p.split('＋')[0]+'，字出頭':p.split('＋').map(x=>PSAY[x]||x).join('，加，');
function gMatch(){
  const cmpAll=POOL.S3.filter(id=>IT[id].k==='cmp'),mAll=POOL.S3.filter(id=>IT[id].k==='match');

    const ins=tp?'點上面的音符，再點下面的樂器。字出頭，變成新的字。':md==='char'?'點上面的音符，再點下面的樂器，拼成一個字。':md==='word'?'點上面的音符，再點下面的樂器，連成詞語。':'點上面的音符，再點下面的樂器，找組成方式一樣的短語。';

  function cmpRound(id,done){const it=IT[id];let failed=false,locked=false;window.TGI={id,ans:it.ans};const opts=shuffle(it.opts.slice());

/* ====== S4 聚光燈找一找：找出藏著某個部件（或某個注音）的字 ====== */
function gFind(){const n=CNT(POOL.S4.length,5,7),ids=pickN(POOL.S4,n);const {sb}=stageShell('S4',n);
  function round(id,done){const it=IT[id],tl=it.tiles,s=tl?'':it.s,zs=tl?[]:zyArr(s);let failed=false,si=0;
    const tg=it.tg||'山',td=it.tgd||`「${tg}」`,tgs=it.tgsay||tg;
    let segs=[];

        const g={a,b:e+1};g.ms=it.marks.filter(m=>m.i>=g.a&&m.i<g.b);g.req=g.ms.filter(m=>m.req);if(g.req.length)segs.push(g);a=e+1;i=e}}}
    function seg(){const sg=segs[si],last=si===segs.length-1;let segLeft=sg.req.length,wrongs=0;window.TGI={id,marks:sg.ms.map(m=>m.i),req:sg.req.map(m=>m.i)};
      const segText=tl?tl.join('，'):s.slice(sg.a,sg.b).replace(/[\n　]/g,'，');
      const tiles=tl?tl.map((t,i)=>`<button class="sch tt wide" data-i="${i}">${it.noz?esc(t):T(t)}</button>`).join(''):
        [...s.slice(sg.a,sg.b)].map((ch,k)=>{const i=sg.a+k;if(ch==='\n')return'<span class="nl"></span>';
          return isCJK(ch)?`<button class="sch tt" data-i="${i}">${zs[i]?`<ruby>${esc(ch)}<rt>${zs[i]}</rt></ruby>`:esc(ch)}</button>`:`<span class="spun">${ch==='　'?'&emsp;':esc(ch)}</span>`}).join('');

          if(wrongs>=2){const r=tlist.find(x=>!x.classList.contains('caught')&&sg.req.some(m=>m.i===+x.dataset.i));if(r)r.classList.add('hintg')}}})}

/* ====== S8 放大鏡抓錯字：改錯字、刪掉多餘的字 ====== */
function gSpy(){const all=POOL.S8,ex=all.filter(i=>IT[i].marks.some(m=>m.extra)),lg=all.filter(i=>/^ty_/.test(i)),sh=all.filter(i=>!ex.includes(i)&&!lg.includes(i));
  const std=S.len==='std';const ids=shuffle(pickN(lg,1).concat(pickN(ex,std?2:1),pickN(sh,std?4:3)));const {sb}=stageShell('S8',ids.length);
  function round(id,done){const it=IT[id];const s=it.s,zs=zyArr(s);let failed=false,left=it.marks.length,cur=null;const fixed={};
    /* 一次只看一小段（一個逗號或句號以內），字不會太多 */
    const segs=[];{let a=0;for(let i=0;i<s.length;i++){if('，。！？'.includes(s[i])||i===s.length-1){const ms=it.marks.filter(m=>m.i>=a&&m.i<=i);if(ms.length)segs.push({a,b:i+1,ms});a=i+1}}}
    let si=0;const isEx=it.marks.some(m=>m.extra);
    function seg(){const sg=segs[si];const lastSeg=si===segs.length-1;let segLeft=sg.ms.length;
      window.TGI={id,marks:sg.ms.map(m=>m.i),extra:sg.ms.filter(m=>m.extra).map(m=>m.i)};
      const tiles=[...s.slice(sg.a,sg.b)].map((ch,k)=>{const i=sg.a+k;return isCJK(ch)?`<button class="sch" data-i="${i}">${zs[i]?`<ruby>${esc(ch)}<rt>${zs[i]}</rt></ruby>`:esc(ch)}</button>`:`<span class="spun">${esc(ch)}</span>`}).join('');
      const ins=isEx?'找出多餘的字，點它。':(segs.length>1?`第 ${si+1} 段：找出錯字，點它。`:'找出錯字，點它。');
      const segSay=s.slice(sg.a,sg.b);
      sb.innerHTML=progBar()+inst('👻',ins,ins)+`<div class="radar"><div class="rcount" id="rc">👻 還有 ${left} 個${isEx?'多餘的字':'錯字'}${segs.length>1?`（第 ${si+1}／${segs.length} 段）`:''}</div><div class="rtxt big" id="rt">${tiles}</div></div><div class="fixbox" id="fx"><div class="hint lt" style="text-align:center">${isEx?'點出多餘的字':'點出錯字'} ${spk(segSay)}</div></div>`;
      setPB((ids.indexOf(id)+si/segs.length)/ids.length);autoSay(ins+segSay);
      const tilesEl=$$('.sch',sb);
      function oneDone(t,m){left--;segLeft--;$('#rc',sb).textContent=left?`👻 還有 ${left} 個${isEx?'多餘的字':'錯字'}`:'🎉 都找到了！';cur=null;
        if(segLeft>0){$('#fx',sb).innerHTML='<div class="hint lt" style="text-align:center">好棒！這一段還有，再找找看</div>'}
        else if(!lastSeg){$('#fx',sb).innerHTML='<div class="hint lt" style="text-align:center">這一段找完了！看下一段 ➜</div>';say('這一段找完了。看下一段。');later(()=>{si++;seg()},1500)}
        else{$('#fx',sb).innerHTML='';record(id,!failed,t);
          if(isEx){const mm=it.marks[0];const s2=s.slice(0,mm.i)+s.slice(mm.i+1);
            qDone({first:!failed,html:WHYBOX(T(s2),`多出來的字是「${mm.c}」，把它拿掉，句子就通順了。`),say:'多出來的字是，'+mm.c+'。'+s2,onDone:done,delay:700})}
          else{const txt=it.marks.map(x=>`「${x.c}」→「${x.r}」`).join('　');
            const fixedS=segs.map(g=>[...s.slice(g.a,g.b)].map((c,k)=>fixed[g.a+k]!=null?`⟦${fixed[g.a+k]}⟧`:c).join('')).join('');
            qDone({first:!failed,html:WHYBOX(T(fixedS),'錯字改正：'+txt),say:'改正了，'+it.marks.map(x=>x.r).join('，'),onDone:done,delay:700})}}}
      function showFix(i){const m=it.marks.find(x=>x.i===i);cur=m;tilesEl.forEach(t=>t.classList.toggle('sus',+t.dataset.i===i));
        $('#fx',sb).innerHTML=`<div class="fxh">這是錯字。選出正確的字。 ${spk('這是錯字。選出正確的字。')}</div><div class="chipr">${shuffle(m.opts).map(o=>`<button class="chipb" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
        autoSay('這是錯字。選出正確的字。');
        $$('#fx .chipb',sb).forEach(b=>b.onclick=()=>{if(b.disabled)return;if(b.dataset.o===m.r){sfx('ok');const t=tilesEl.find(t=>+t.dataset.i===m.i);fixed[m.i]=m.r;t.classList.remove('sus');t.classList.add('caught');t.disabled=true;
            const s2=[...s].map((c,k)=>fixed[k]!=null?fixed[k]:c).join('');const z2=zyArr(s2);t.innerHTML=`<ruby>${esc(m.r)}<rt>${z2[m.i]||''}</rt></ruby>`;popEl(t,'找到了！');
            oneDone(t,m)}
          else{failed=true;b.disabled=true;b.classList.add('bad');sfx('bad');toast('不是這個，再選選看。')}})}
      tilesEl.forEach(t=>t.onclick=()=>{if(t.classList.contains('caught'))return;const i=+t.dataset.i;const m=it.marks.find(x=>x.i===i);
        if(m&&m.extra){sfx('ok');t.classList.add('caught','struck');t.disabled=true;popEl(t,'找到了！');oneDone(t,m)}
        else if(m)showFix(i);
        else{failed=true;sfx('bad');t.classList.add('safe');setTimeout(()=>t.classList.remove('safe'),700);toast('這個字是對的，再找找。')}})}
    seg()}
  runRounds(sb,ids,round)}

/* ====== S10 劇本圖書館：閱讀測驗 ====== */
function noteMark(i){return String.fromCharCode(0xE000+i)}
function bookHTML(b){const mk=['①','②','③','④','⑤'];

  const title=T(b.title)+(b.titleNote?`<button class="nt" data-n="0">①</button>`:'');
  return `<h3 class="btitle">${title}</h3>${b.paras.map(para).join('')}<div class="notes hint lt2">${b.notes.map((n,i)=>`<div>${mk[i]} ${T(n)}</div>`).join('')}</div>`}
function bookSay(b){return [b.title].concat(b.paras).join('。').replace(/[①②③④⑤]/g,'').replace(/[　]+/g,'，')}
function gLib(){S.books=S.books||{};const {sb}=stageShell('S10',4);

  function read(b){const qids=D.items.filter(i=>i.bk===b.id&&(!i.lesson||S.lesq)).map(i=>i.id);window.CURID=qids[0];window.TGI={book:b.id,qids};

    $('#lis',sb).onclick=()=>say(bookSay(b),null,true);if(S.auto&&S.tts)later(()=>say('讀一讀這篇文章。想聽的話，按聽故事。讀完了，按綠色的按鈕。'),400);

      setProg(i,qids.length);const q=mcq(qids[i]);q.ctx=null;q.say=(q.say||q.stem.replace(/\n/g,'，'))+optSay(q);window.CURID=qids[i];
      sb.innerHTML=progBar()+`<div class="row" style="justify-content:flex-end"><button class="btn w sm" id="again">📖 再看一次故事</button></div><div id="qh"></div>`;setPB(i/qids.length);

      renderMCQ($('#qh',sb),q,{retry:true,onDone:()=>{i++;next()}})};next()}}

/* ====== 排序造句共用：S6 節目單排排隊 ====== */
const CODES=['①','②','③','④','⑤','⑥'];
function orderRound(sb,ids,id,it,done){const ch=it.chunks;let placed=[],failed=false;window.TGI={id,ord:it.ord};
  /* 每次把詞打亂擺放，而且順序一定和答案不同；格子上的①②③也照擺放位置編 */
  let disp=ch.map((c,i)=>i);for(let t=0;t<40;t++){disp=shuffle(ch.map((c,i)=>i));if(ch.length<2||!disp.every((x,k)=>x===it.ord[k]))if(ch.length<3||!disp.every((x,k)=>x===k))break}
  const pos=i=>disp.indexOf(i);
  const em='🎵',cn='音符',first='第一個';
  const instT='點下面的詞，排成一句話。',instS='先點第一個詞，再點下一個詞，排成一句話。';
  function orderStep(){
    const draw=()=>{sb.innerHTML=progBar()+inst(em,instT,instS)+(it.intro?`<div class="introq">${T(it.intro)} ${spk(it.intro)}</div>`:'')+(it.prefix?`<div class="target">${T(it.prefix)}（　　　）${it.end||'。'}</div>`:'')

/* ====== S11 音符串句子：用詞語造句（跳音符）＋ 幫句子放標點 ====== */
function gBricks(){const std=S.len==='std';
  const sn=POOL.S11.filter(i=>IT[i].k==='sent'),pu=POOL.S11.filter(i=>IT[i].k==='punct');
  const a=pickN(sn,std?3:2),b=pickN(pu,std?4:3);const ids=[];for(let k=0;k<Math.max(a.length,b.length);k++){if(a[k])ids.push(a[k]);if(b[k])ids.push(b[k])}
  const {sb}=stageShell('S11',ids.length);
  function sentRound(id,it,done){let placed=[],failed=false,hinted=false;const bank=shuffle(it.toks.concat(it.dis).map((t,i)=>({t,i})));window.TGI={id,toks:it.toks,dis:it.dis};
    const draw=()=>{const pre=(()=>{let n=0;while(n<placed.length&&placed[n].t===it.toks[n])n++;return n})();
      sb.innerHTML=progBar()+inst('🌟',`用「${it.w}」造句：照順序點音符。`,`用${it.w}造句。照順序，一個一個點音符，排成一句話。`)+`<div class="target">造句詞語：<b>${T(it.w)}</b></div><div class="station river"><div class="floors" id="fl">${placed.length?placed.map((p,k)=>`<button class="sbrick placed" data-k="${k}" style="--c:${GCOL[p.i%6]}">${T(p.t)}</button>`).join(''):'<div class="hint lt">點下面的音符，排在這裡</div>'}</div></div><div class="sbricks" id="bk">${bank.map(b=>`<button class="sbrick ${placed.some(p=>p.i===b.i)?'used':''} ${hinted&&!placed.some(p=>p.i===b.i)&&b.t===it.toks[pre]?'glow':''}" data-i="${b.i}" ${placed.some(p=>p.i===b.i)?'disabled':''} style="--c:${GCOL[b.i%6]}">${T(b.t)}</button>`).join('')}</div><div class="row" style="justify-content:center"><button class="btn w sm" id="rs">🔄 重來</button><button class="btn p sm" id="ht">💡 提示</button></div>`;
      setPB(ids.indexOf(id)/ids.length);
      $$('#bk .sbrick',sb).forEach(b=>b.onclick=()=>{if(b.disabled)return;placed.push(bank.find(x=>x.i===+b.dataset.i));hinted=false;sfx('pop');if(placed.length===it.toks.length)check();else draw()});
      $$('.placed',sb).forEach(b=>b.onclick=()=>{placed.splice(+b.dataset.k,1);sfx('tick');draw()});
      $('#rs',sb).onclick=()=>{placed=[];draw()};$('#ht',sb).onclick=()=>{failed=true;hinted=true;draw();toast('亮亮的音符，是下一個！')}};
    const check=()=>{const ok=placed.every((p,i)=>p.t===it.toks[i]);
      if(ok){draw();$$('.placed',sb).forEach(b=>b.classList.add('shine'));sfx('win');confetti(14);record(id,!failed,sb);S.sents.push({pat:it.w,text:it.std});if(S.sents.length>60)S.sents.shift();save();say(it.std);
        qDone({first:!failed,html:WHYBOX(T(it.std),`這是老師的示範句。你也可以用「${it.w}」想一個自己的句子，說給大家聽！`),say:it.std,onDone:done,delay:1000,force:false})}
      else{failed=true;sfx('bad');draw();let k=0;while(k<placed.length&&placed[k].t===it.toks[k])k++;const el=$$('.placed',sb)[k];if(el)el.classList.add('wrong');toast(`第 ${k+1} 塊不對，再試試。`);later(()=>{placed=placed.slice(0,k);draw()},1200)}};
    draw();autoSay(`用${it.w}造句。照順序點音符。可以用的音符有：${bank.map(b=>b.t).join('，')}。`)}
  const PNM={'，':'逗號','。':'句號','？':'問號','、':'頓號','！':'驚嘆號'};
  function punctRound(id,it,done){const MKS=it.marks||['，','。','？'],ext=MKS.length>3;const ns=it.ans.length;let k=0,failed=false;const put=Array(ns).fill(null);window.TGI={id,ans:it.ans};
    const full=()=>it.parts.map((p,i)=>p+(i<ns?put[i]||'':'')).join('');
    const draw=()=>{const body=it.parts.map((p,i)=>T(p)+(i<ns?`<span class="pstone ${put[i]?'ok':i===k?'act':''}">${put[i]?put[i]:'□'}</span>`:'')).join('');
      sb.innerHTML=progBar()+inst('✏️',ext?'選出對的標點符號，點一點。':'話還沒說完，點「，」；話說完了，點「。」；問問題，點「？」',ext?'選出對的標點符號。話還沒說完，點逗號。一樣的詞，中間點頓號。話說完了，點句號。問問題，點問號。很開心，點驚嘆號。':'話還沒說完，點逗號。話說完了，點句號。問問題，點問號。')+`<div class="station river punctw"><div class="ptxt">${body}</div></div><div class="pbtns">${MKS.map(m=>`<button class="pk" data-p="${m}"><b>${m}</b><span>${T(PNM[m])}</span></button>`).join('')}</div>`;
      setPB((ids.indexOf(id)+k/ns)/ids.length);
      const sayStep=(first)=>autoSay((first?(ext?'話還沒說完，點逗號。一樣的詞，中間點頓號。話說完了，點句號。問問題，點問號。很開心，點驚嘆號。':'話還沒說完，點逗號。話說完了，點句號。問問題，點問號。'):'')+`看第${k+1}個空格。前面是：${it.parts[k]}。${it.parts[k+1]?'後面是：'+it.parts[k+1]+'。':'後面沒有字了。'}點哪一個標點符號？`);
      sayStep(k===0&&put.every(x=>!x));
      $$('.pk',sb).forEach(b=>b.onclick=()=>{const c=b.dataset.p;
        if(it.ans[k].includes(c)){put[k]=c;sfx('ok');k++;if(k>=ns){draw2()}else draw()}
        else{failed=true;sfx('bad');b.classList.add('bad');toast(`這裡不是${PNM[c]}，再試試。`);later(()=>b.classList.remove('bad'),500)}})};
    const draw2=()=>{const body=it.parts.map((p,i)=>T(p)+(i<ns?`<span class="pstone ok">${put[i]}</span>`:'')).join('');
      sb.innerHTML=progBar()+inst('✏️','標點都放好了！','標點都放好了')+`<div class="station river punctw"><div class="ptxt">${body}</div></div>`;setPB((ids.indexOf(id)+1)/ids.length);sfx('win');
      record(id,!failed,sb);const txt=full();say(txt);
      qDone({first:!failed,html:WHYBOX(T(txt),(ext?'逗號「，」表示話還沒說完；頓號「、」用來隔開一樣的詞；句號「。」表示一句話說完了；問號「？」表示在問問題；驚嘆號「！」表示很開心、很驚訝。':'逗號「，」表示話還沒說完，要停一下；句號「。」表示一句話說完了；問號「？」表示在問問題。')),say:txt,onDone:done,delay:1000})};
    draw()}
  runRounds(sb,ids,(id,done)=>{const it=IT[id];if(it.k==='punct')punctRound(id,it,done);else sentRound(id,it,done)})}
